<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forum Sport · Pricing dinámico</title>
<meta name="description" content="Panel de precios, márgenes y stock del catálogo de running y trail de Forum Sport.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23E32219'/%3E%3Cpath d='M9 23V9h12M9 16h9' stroke='white' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&family=Roboto:wght@300;400;500;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ── Tokens · Forum Sport design system ───────────────────────────────
   Values come from the kit's tokens/{colors,typography,spacing}.css. The
   brand ships exactly two hues — red #E32219 and blue #0279FF — so every
   chart ramp below is derived from those two in OKLCH and then VALIDATED
   with the dataviz validator rather than eyeballed. Light ramps are checked
   against #FFFFFF, dark ones against brand ink #222222: the dark mode is
   stepped on purpose, never an automatic flip. */
:root{
  color-scheme: light;
  /* Brand */
  --fs-red:#E32219; --fs-blue:#0279FF; --fs-ink:#222222;
  --plane:#FFFFFF;      /* the site is a white page */
  --surface:#FFFFFF;    /* cards are white, separated by hairlines, not fills */
  --stage:#F2F2F2;      /* image stages, table headers, inner blocks */
  --ink:#222222;        /* headings, nav, primary button */
  --ink-2:#333333;      /* body copy */
  --muted:#787676;      /* inactive */
  --grid:#E3E3E3;       /* hairlines, gridlines */
  --axis:#BCBCBC;
  --rule:#E3E3E3;
  --accent:#0279FF;
  --s1:#0279FF; --s2:#E32219;              /* categorical · validated on #fff */
  /* Ordinal, single hue at the brand-blue angle, L evenly spaced */
  --o1:#73ACFF; --o2:#3B8CFE; --o3:#036EE8; --o4:#0155B8; --o5:#003E8A;
  /* Diverging: blue = we are cheaper, grey = level, red = we are dearer.
     Brand-coherent, and red/blue is the safest diverging pair for CVD. */
  /* "Cheaper" is green by request, overriding the brand's two-hue palette.
     Green/red is the classic colour-blind failure pair, so the greens below
     were picked for CVD separation, not for looks: #05893E holds dE 7.9 under
     deuteranopia and 4.51:1 on white. That sits in the 6-8 band, which is only
     legal because every instance is also labelled ("mas barato"/"mas caro")
     and signed (-25,99 EUR), never colour alone. */
  --dv-c3:#057836; --dv-c2:#2E9E52; --dv-c1:#53BE70;
  --dv-mid:#BCBCBC;
  --dv-d1:#FF7261; --dv-d2:#D90E0A; --dv-d3:#8B0202;
  --good:#05893E;       /* cheaper / positive. 4.51:1 on white: legible as text. */
  --bad:#D90E0A;
  /* The brand is flat. Only chips and floating elements carry a shadow. */
  --shadow:none;
  --shadow-chip:0 1px 2px rgba(0,0,0,.18);
  --display:'Roboto Condensed','Arial Narrow',sans-serif;
  --sans:'Roboto',Helvetica,Arial,sans-serif;
  --price:'Caveat','Comic Sans MS',cursive;   /* substitute for the brand's hand-lettered price face */
  --tracking-nav:0.08em;
  --filters-h:58px;
}

@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --plane:#171717; --surface:#222222; --stage:#2B2B2B;
    --ink:#FFFFFF; --ink-2:#E3E3E3; --muted:#BCBCBC;
    --grid:#3A3A3A; --axis:#555555; --rule:#3A3A3A;
    --accent:#2081FF;
    --s1:#2081FF; --s2:#EF3327;
    --o1:#B5D3FF; --o2:#87B8FF; --o3:#569BFE; --o4:#0E7BFE; --o5:#0263D2;
    --dv-c3:#25984D; --dv-c2:#53BE70; --dv-c1:#7CE695;
    --dv-mid:#787676;
    --dv-d1:#FEB6AA; --dv-d2:#FF6150; --dv-d3:#D60203;
    --good:#5AC576;
    --bad:#FF6150;
    --shadow:none;
    --shadow-chip:0 1px 2px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#171717; --surface:#222222; --stage:#2B2B2B;
  --ink:#FFFFFF; --ink-2:#E3E3E3; --muted:#BCBCBC;
  --grid:#3A3A3A; --axis:#555555; --rule:#3A3A3A;
  --accent:#2081FF;
  --s1:#2081FF; --s2:#EF3327;
  --o1:#B5D3FF; --o2:#87B8FF; --o3:#569BFE; --o4:#0E7BFE; --o5:#0263D2;
  --dv-c3:#25984D; --dv-c2:#53BE70; --dv-c1:#7CE695;
  --dv-mid:#787676;
  --dv-d1:#FEB6AA; --dv-d2:#FF6150; --dv-d3:#D60203;
  --good:#5AC576;
  --bad:#FF6150;
  --shadow:none;
  --shadow-chip:0 1px 2px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--plane); color:var(--ink);
  font-family:var(--sans); font-weight:400;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
.wrap{max-width:1240px; margin:0 auto; padding:0 16px}
@media(min-width:900px){ .wrap{padding:0 40px} }

/* ── Masthead ─────────────────────────────────────────────────────────── */
header.mast{border-bottom:1px solid var(--rule); padding:0 0 18px; margin-bottom:28px}
.mast-brand{display:flex; align-items:center; gap:16px; min-height:66px;
  border-bottom:1px solid var(--rule); margin-bottom:18px; flex-wrap:wrap}
/* Las acciones comparten fila con la marca y se van al extremo. */
.mast-brand .mast-actions{margin-left:auto}
@media(max-width:620px){ .mast-brand .mast-actions{margin-left:0; padding-bottom:12px} }
.mast-brand img{height:44px; width:auto; display:block}
/* The kit ships the logo as a raster on white. On a dark surface that reads as
   a transparency bug, so it gets an explicit white plate instead. Replace with
   a transparent or reversed logo if the brand team supplies one. */
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])) .mast-brand img{background:#fff; padding:5px 9px}
}
:root[data-theme="dark"] .mast-brand img{background:#fff; padding:5px 9px}
.mast-brand .tool{font-family:var(--display); font-weight:700; font-size:14px; margin:0;
  letter-spacing:var(--tracking-nav); text-transform:uppercase; color:var(--ink);
  padding-bottom:3px; border-bottom:2px solid var(--fs-red)}
h1{
  font-family:var(--display); font-weight:700; text-transform:uppercase;
  font-size:clamp(30px,5vw,46px); line-height:1.05; margin:0;
  letter-spacing:var(--tracking-display,.01em);
}
h1 em{font-style:normal; color:var(--fs-red)}
.mast-meta{
  margin:16px 0 0; color:var(--ink-2); font-size:14px;
  display:flex; gap:8px 18px; flex-wrap:wrap; align-items:center;
}
.mast-meta b{font-weight:650; color:var(--ink); font-variant-numeric:tabular-nums}
.dot{width:3px;height:3px;border-radius:50%;background:var(--axis);flex:none}
.live{
  display:inline-flex; align-items:center; gap:7px; font-size:11px;
  letter-spacing:.1em; text-transform:uppercase; font-weight:650; color:var(--ink-2);
  font-family:var(--display); border:1px solid var(--rule); border-radius:0;
  padding:6px 11px; background:var(--surface);
}
/* Punto estático, no pulsante. El latido prometía un dato que cambia mientras
   lo miras; lo que hay detrás es un rastreo diario, y la propia página avisa
   700px más abajo de que solo lleva tres días de histórico. Un indicador quieto
   con una etiqueta exacta dice la verdad y no cuesta nada. */
.pulse{width:6px;height:6px;border-radius:50%;background:var(--good); flex:none}
.mast-actions{display:flex; gap:8px; align-items:center}
/* Language switch. A segmented pair rather than a dropdown: with exactly two
   options a <select> hides the alternative behind a click, and the point of
   the control is that the other language is visibly available. */
.lang{display:inline-flex; border:1px solid var(--rule); background:var(--surface)}
.lang button{
  font-family:var(--display); font-size:12px; font-weight:700;
  text-transform:uppercase; letter-spacing:var(--tracking-nav);
  color:var(--muted); background:none; border:0; border-radius:0;
  padding:7px 10px; cursor:pointer; transition:.16s;
}
.lang button + button{border-left:1px solid var(--rule)}
.lang button:hover{color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--ink); color:var(--plane)}
button.ghost{
  font-family:var(--display); font-size:12px; font-weight:700; color:var(--ink);
  text-transform:uppercase; letter-spacing:var(--tracking-nav);
  background:var(--surface); border:1px solid var(--rule); border-radius:0;
  padding:7px 12px; cursor:pointer; transition:.16s;
}
button.ghost:hover{color:var(--ink); border-color:var(--axis)}

/* ── Navegación de secciones ──────────────────────────────────────────
   Tres trabajos, tres paneles. Bajo una marca sin radios y sin sombras, la
   pestaña activa se marca con la regla inferior y el peso del texto — no con
   una pastilla, que sería la única esquina redondeada de la página. */
.secciones{border-bottom:1px solid var(--rule); margin:0 0 24px}
.sec-lista{display:flex; gap:0; flex-wrap:wrap}
.sec{
  display:flex; align-items:flex-start; gap:10px; text-align:left;
  background:none; border:0; border-bottom:2px solid transparent; border-radius:0;
  padding:12px 20px 13px; margin-bottom:-1px; cursor:pointer; transition:.16s;
  font-family:var(--sans);
}
.sec:first-child{padding-left:0}
.sec-n{
  font-family:var(--display); font-size:11px; font-weight:700; color:var(--muted);
  border:1px solid var(--rule); min-width:20px; height:20px; flex:none;
  display:inline-flex; align-items:center; justify-content:center; margin-top:1px;
}
.sec-txt{display:flex; flex-direction:column; gap:2px; min-width:0}
.sec-tit{
  font-family:var(--display); font-size:13px; font-weight:700; color:var(--ink-2);
  text-transform:uppercase; letter-spacing:var(--tracking-nav);
}
.sec-sub{font-size:11.5px; color:var(--muted); line-height:1.35}
.sec:hover .sec-tit{color:var(--ink)}
.sec[aria-selected="true"]{border-bottom-color:var(--accent)}
.sec[aria-selected="true"] .sec-tit{color:var(--ink)}
.sec[aria-selected="true"] .sec-n{
  background:var(--accent); border-color:var(--accent); color:#fff}
#app:focus{outline:none}
@media(max-width:720px){
  .sec{padding:10px 14px 11px}
  .sec-sub{display:none}          /* en móvil el título ya nombra la sección */
}

/* ── Panel de rastreo ─────────────────────────────────────────────────── */
.sc-puerta{display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin:12px 0 4px}
.sc-token{
  width:300px; max-width:100%; font-family:var(--sans); font-size:13px;
  padding:7px 9px; color:var(--ink); background:var(--plane);
  border:1px solid var(--rule); border-radius:0;
}
.sc-token:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.sc-lanzar{
  display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap;
  padding:10px 0 14px;
}
.sc-lanzar .param{flex-direction:column; align-items:flex-start; gap:4px;
  justify-content:flex-start}
.sc-lanzar select{min-width:150px}
.sc-lim{width:110px; font-family:var(--sans); font-size:13px; padding:5px 7px;
  color:var(--ink); background:var(--plane); border:1px solid var(--rule);
  border-radius:0; text-align:right; font-variant-numeric:tabular-nums}
.sc-go{height:31px}
.sc-num{width:100%; max-width:74px; font-family:var(--sans); font-size:12.5px;
  padding:4px 6px; color:var(--ink); background:var(--plane);
  border:1px solid var(--rule); border-radius:0; text-align:right;
  font-variant-numeric:tabular-nums}
.t-scrape th:nth-child(1){width:20%} .t-scrape th:nth-child(7){width:17%}
.t-scrape th:nth-child(8){width:7%}
.t-scrape td{vertical-align:middle}
.t-scrape td:last-child{text-align:center}
.t-scrape .edad{display:block}
.t-scrape td small{display:block; color:var(--muted); font-size:11px;
  white-space:normal; line-height:1.35; margin-top:2px}
@media(max-width:900px){
  /* Retardo y tope de sitemap son ajuste fino: en pantalla estrecha estorban
     más de lo que aportan, y el estado y el botón de lanzar no. */
  .t-scrape th:nth-child(5), .t-scrape td:nth-child(5),
  .t-scrape th:nth-child(6), .t-scrape td:nth-child(6){display:none}
  .t-scrape th:nth-child(1){width:30%}
}
@media(max-width:620px){
  .t-scrape th:nth-child(4), .t-scrape td:nth-child(4),
  .t-scrape th:nth-child(7), .t-scrape td:nth-child(7){display:none}
  .t-scrape th:nth-child(1){width:46%}
}

/* ── Hero ─────────────────────────────────────────────────────────────── */
/* A full-width info bar, not a hero block: one baseline, hairline top and
   bottom, no fill. It states the headline and gets out of the way — the charts
   below are what the page is for. */
.hero{
  display:flex; align-items:baseline; flex-wrap:wrap; gap:6px 18px;
  border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);
  padding:12px 0; margin:0 0 26px;
}
.hero-fig{
  font-family:var(--display); font-weight:700; font-size:clamp(24px,2.6vw,32px);
  line-height:1; letter-spacing:0; margin:0; color:var(--fs-red); flex:none;
  font-variant-numeric:tabular-nums;
}
.hero .lede{
  font-family:var(--display); font-weight:700; font-size:16px; line-height:1.3;
  margin:0; color:var(--ink); flex:1 1 240px; min-width:0;
}
/* The supporting sentence is secondary: it sits right, quiet, and never
   competes with the figure. */
.hero-note{
  margin:0; font-size:13px; line-height:1.45; color:var(--muted);
  flex:0 1 68ch; min-width:0; text-align:right;
}
.hero-note strong{color:var(--ink-2); font-weight:700}
@media(max-width:900px){ .hero-note{text-align:left; flex-basis:100%} }
/* La brecha mayor: el único dato del pliegue sobre el que se puede actuar hoy,
   así que se lee como una frase y no como un pie de foto. */
.hero-brecha{
  margin:-18px 0 26px; font-size:15px; line-height:1.45; color:var(--ink-2);
  font-family:var(--sans);
}
.hero-brecha b{color:var(--ink); font-weight:700}


/* ── KPI row ──────────────────────────────────────────────────────────── */
.kpis{
  display:grid; grid-template-columns:repeat(2,1fr); gap:1px;
  background:var(--rule); border:1px solid var(--rule); border-radius:0;
  overflow:hidden; margin-bottom:34px;
}
@media(min-width:700px){ .kpis{grid-template-columns:repeat(3,1fr)} }
@media(min-width:1050px){ .kpis{grid-template-columns:repeat(6,1fr)} }
/* La tira principal son cuatro, y cuatro huecos en una rejilla de seis dejan
   dos celdas grises al final. El contexto plegado sí son seis. */
@media(min-width:1050px){ .kpis:not(.kpis-sec){grid-template-columns:repeat(4,1fr)} }
/* La tira del motor son siete fichas. Fijar cuatro columnas deja una fila de
   tres y una celda gris colgando; auto-fit reparte lo que haya. */
.kpis-eng{grid-template-columns:repeat(auto-fit,minmax(148px,1fr))!important}
details.ctx{margin:0 0 30px}
details.ctx .kpis-sec{margin:10px 0 0}
.kpi{background:var(--surface); padding:16px 16px 18px}
/* Secondary row: same grid, quieter, for the catalogue context beneath the
   competitive headline. */
.kpis-sec{margin-top:-22px; margin-bottom:34px}
.kpis-sec .k-val{font-size:20px; font-weight:600}
.kpis-sec .k-label{font-size:10px}
.kpi .k-label{font-family:var(--display); font-weight:700;
  font-size:11px; letter-spacing:var(--tracking-nav); text-transform:uppercase;
  color:var(--muted); font-weight:650; margin:0 0 7px}
.kpi .k-val{font-family:var(--display); font-size:28px; font-weight:700; letter-spacing:0;
  margin:0; color:var(--ink); font-variant-numeric:tabular-nums}
/* Money wears the brand's hand-lettered price face — its one distinctive
   type moment. Percentages and counts do not: they are not prices. */
.kpi .k-val.money{font-family:var(--price); font-size:36px; line-height:.95; color:var(--fs-gray-900,var(--ink-2))}
.kpi .k-sub{font-size:12px; color:var(--muted); margin:4px 0 0}

/* ── Filters ──────────────────────────────────────────────────────────── */
.filters{
  display:flex; gap:10px; flex-wrap:wrap; align-items:center; min-width:0;
  padding:13px 16px; background:var(--surface);
  border:1px solid var(--rule); border-radius:0; margin-bottom:26px;
  position:sticky; top:0; z-index:20; box-shadow:var(--shadow);
}
.filters .f-lab{font-size:11px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); font-weight:650; margin-right:2px}
/* The eight catalogue dimensions, folded away. flex-basis:100% puts the
   disclosure on its own line inside the wrapping filter bar. */
.dims{flex-basis:100%; margin:0}
.dims>summary{display:inline-flex; align-items:center; gap:7px; cursor:pointer;
  font-family:var(--display); font-size:12px; font-weight:700; color:var(--ink);
  text-transform:uppercase; letter-spacing:var(--tracking-nav);
  padding:4px 0; width:max-content}
.dims>summary::marker{color:var(--muted)}
.dims>summary .n{background:var(--accent); color:#fff; border-radius:999px;
  padding:1px 7px; font-size:11px; font-weight:700; font-variant-numeric:tabular-nums}
.dim-row{display:flex; flex-wrap:wrap; gap:8px; padding:9px 0 2px}
/* Parámetros del motor */
.params{flex-basis:auto; margin:4px 0 16px}
/* Quince campos sin un solo título eran tres familias distintas —objetivos en
   %, ajustes en pp, barreras en €— en una sola rejilla indiferenciada. */
.param-grupo{
  font-family:var(--display); font-size:11px; font-weight:700;
  text-transform:uppercase; letter-spacing:.07em; color:var(--muted);
  margin:16px 0 0; padding-top:12px; border-top:1px solid var(--rule);
}
/* La matriz es una matriz: se lee como la hoja de la que viene, con sus filas
   y sus columnas, no como quince campos sueltos. */
.t-matriz{margin-top:8px}
.t-matriz th{font-size:10px}
.t-matriz td{padding:4px 6px}
.t-matriz .param{justify-content:flex-end}
.t-matriz .param input{width:100%; max-width:84px}
.t-matriz td:first-child{font-family:var(--display); font-weight:700; color:var(--ink)}
.param-grid{display:grid; gap:8px 14px; padding:10px 0 12px;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.param{display:flex; align-items:center; justify-content:space-between; gap:10px;
  font-size:12.5px; color:var(--ink-2)}
.param input{width:86px; flex:none; text-align:right; font-family:var(--sans);
  font-size:13px; padding:5px 7px; color:var(--ink);
  background:var(--plane); border:1px solid var(--rule); border-radius:0;
  font-variant-numeric:tabular-nums}
.param input:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
/* Confianza: la barra hace el número comparable de un vistazo.
   El color es el umbral, no decoración. Antes era el mismo azul al 20 % que al
   90 %, así que la barra no decía nada que el número no dijera ya; y la tarjeta
   gobierna su propio KPI con un corte en el 50 % («293 con confianza ≥ 50 %»)
   que la fila no mostraba por ninguna parte. La muesca marca ese corte. */
.conf{display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
  font-variant-numeric:tabular-nums}
.conf-bar{display:inline-block; width:46px; height:6px; background:var(--grid);
  flex:none; position:relative}
.conf-bar i{display:block; height:100%; background:var(--dv-mid)}
.conf-bar::after{                       /* la muesca del 50 % */
  content:""; position:absolute; left:50%; top:-2px; bottom:-2px; width:1px;
  background:var(--ink-2); opacity:.55;
}
.conf.c-baja  .conf-bar i{background:var(--s2)}      /* < 40: no hay mercado */
.conf.c-media .conf-bar i{background:var(--dv-mid)}  /* 40–59: a mirar */
.conf.c-alta  .conf-bar i{background:var(--good)}    /* ≥ 60: sostenido por dato */
/* Marca de evidencia débil. Hairline, sin relleno: es una advertencia, no una
   alarma, y la fila sigue siendo legible con ella puesta. */
.flag{
  display:inline-block; font-family:var(--display); font-size:10px; font-weight:700;
  letter-spacing:.05em; text-transform:uppercase; white-space:nowrap;
  padding:1px 5px; margin-right:6px; border:1px solid var(--s2); color:var(--s2);
}
tr.debil td{background:color-mix(in srgb, var(--s2) 4%, transparent)}
.card .sub .warn{color:var(--s2); font-weight:600}
.card .note{font-size:12px; color:var(--muted); margin:10px 0 0; line-height:1.5}
.chip[aria-pressed="true"]{background:var(--accent); color:#fff; border-color:var(--accent)}
.periodo{display:inline-flex; gap:4px; align-items:center}
.periodo .chip{padding:7px 9px}
select, .chip{
  font-family:var(--display); font-size:13px; font-weight:700; color:var(--ink);
  text-transform:uppercase; letter-spacing:var(--tracking-nav);
  background:var(--plane); border:1px solid var(--rule); border-radius:0;
  padding:8px 12px; cursor:pointer;
}
select:focus-visible,.chip:focus-visible,button:focus-visible,summary:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--accent); color:#fff; border-color:var(--accent)}
.search{position:relative; flex:1 1 210px; min-width:170px; max-width:320px}
.search-in{
  font-family:var(--sans); font-size:13px; color:var(--ink); width:100%;
  background:var(--plane); border:1px solid var(--rule); border-radius:0;
  padding:7px 28px 7px 30px;
}
.search-in::placeholder{color:var(--muted)}
/* type=search draws its own clear button in WebKit, which would sit beside ours. */
.search-in::-webkit-search-cancel-button,
.search-in::-webkit-search-decoration{-webkit-appearance:none; appearance:none}
.search-in:focus{outline:none; border-color:var(--accent)}
.search .ico{
  position:absolute; left:10px; top:50%; transform:translateY(-50%);
  color:var(--muted); font-size:12px; pointer-events:none;
}
.search .clr{
  position:absolute; right:7px; top:50%; transform:translateY(-50%);
  background:none; border:none; color:var(--muted); cursor:pointer;
  font-size:15px; line-height:1; padding:2px 4px;
}
.search .clr:hover{color:var(--ink)}
.ac{
  position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:45;
  background:var(--surface); border:1px solid var(--rule); border-radius:0;
  box-shadow:var(--shadow); padding:5px; max-height:300px; overflow-y:auto;
}
.ac[hidden]{display:none}
.ac-opt{
  display:flex; align-items:baseline; gap:8px; padding:7px 9px; border-radius:0;
  font-size:13px; cursor:pointer; color:var(--ink);
}
.ac-opt[aria-selected="true"],.ac-opt:hover{background:color-mix(in srgb, var(--accent) 11%, transparent)}
.ac-opt mark{background:color-mix(in srgb, var(--accent) 28%, transparent); color:inherit; border-radius:0}
.ac-opt .br{color:var(--muted); font-size:11.5px}
.ac-opt .cnt{margin-left:auto; color:var(--muted); font-size:11.5px; font-variant-numeric:tabular-nums}
.ac-none{padding:9px; font-size:12.5px; color:var(--muted)}
.ms{position:relative}
.ms-btn{
  font-family:var(--sans); font-size:13px; font-weight:500; color:var(--ink);
  background:var(--plane); border:1px solid var(--rule); border-radius:0;
  padding:7px 11px; cursor:pointer; display:inline-flex; align-items:center; gap:7px;
}
.ms-btn:hover{border-color:var(--axis)}
.ms-btn[aria-expanded="true"]{border-color:var(--accent)}
.ms-btn .caret{color:var(--muted); font-size:10px}
.ms-btn .n{
  background:var(--accent); color:#fff; border-radius:999px;
  font-size:11px; font-weight:700; padding:1px 6px; font-variant-numeric:tabular-nums;
}
.ms-pop{
  position:absolute; top:calc(100% + 6px); left:0; z-index:40; min-width:230px;
  max-height:320px; overflow-y:auto; background:var(--surface);
  border:1px solid var(--rule); border-radius:0; box-shadow:var(--shadow); padding:6px;
}
.ms-pop[hidden]{display:none}
.ms-opt{
  display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:0;
  font-size:13px; cursor:pointer; color:var(--ink); white-space:nowrap;
}
.ms-opt:hover{background:color-mix(in srgb, var(--accent) 9%, transparent)}
.ms-opt input{accent-color:var(--accent); width:14px; height:14px; margin:0; cursor:pointer}
.ms-opt .cnt{margin-left:auto; color:var(--muted); font-size:11.5px; font-variant-numeric:tabular-nums}
.ms-head{
  display:flex; gap:8px; padding:4px 9px 8px; border-bottom:1px solid var(--rule); margin-bottom:4px;
}
.ms-head button{
  font-family:var(--sans); font-size:11.5px; font-weight:600; color:var(--accent);
  background:none; border:none; padding:0; cursor:pointer;
}
.ms-head button:hover{text-decoration:underline}
.f-count{margin-left:auto; flex:none; font-size:13px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.f-count b{color:var(--ink); font-weight:650}

/* ── Chart cards ──────────────────────────────────────────────────────── */
.grid{display:grid; gap:18px; grid-template-columns:1fr; margin-bottom:18px; min-width:0}
@media(min-width:880px){ .grid{grid-template-columns:1fr 1fr} }
.card{
  min-width:0; scroll-margin-top:76px;
  background:var(--surface); border:1px solid var(--rule); border-radius:0;
  padding:20px 20px 16px; box-shadow:var(--shadow);
}
.card.wide{grid-column:1/-1; min-width:0}
.card h2{
  font-family:var(--display); font-weight:700; font-size:20px; line-height:1.2;
  text-transform:uppercase; letter-spacing:.01em;
  margin:0 0 3px; letter-spacing:-.01em;
}
.card .sub{font-size:13px; color:var(--muted); margin:0 0 16px}
.legend{display:flex; gap:16px; flex-wrap:wrap; margin:0 0 12px; font-size:12.5px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.swatch{width:11px; height:11px; border-radius:0; flex:none}
svg{display:block; width:100%; height:auto; overflow:visible}
.tick{font-size:11px; fill:var(--muted); font-variant-numeric:tabular-nums}
.cat{font-size:12px; fill:var(--ink-2)}
.val{font-size:12px; fill:var(--ink-2); font-weight:650; font-variant-numeric:tabular-nums}
text.val.on-light{fill:#0b0b0b}   /* on orange: 6.8:1 — beats white's 3.1:1 */
text.val.on-dark{fill:#fff}       /* on blue:   4.2:1 */
.gridline{stroke:var(--grid); stroke-width:1}
.axis{stroke:var(--axis); stroke-width:1}
.mark{transition:opacity .13s}
.parity{stroke:var(--dv-mid); stroke-width:1.5; stroke-dasharray:4 4}
.hair{stroke:var(--axis); stroke-width:1; pointer-events:none}
.hit{fill:transparent; cursor:pointer}
g.row:hover .mark{opacity:.72}

details{margin-top:14px; border-top:1px solid var(--rule); padding-top:10px}
summary{font-size:12px; color:var(--muted); cursor:pointer; font-weight:600;
  letter-spacing:.04em; list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ "; color:var(--axis)}
details[open] summary::before{content:"▾ "}
summary:hover{color:var(--ink-2)}
/* No horizontal scrolling, at any width — not in the wrapper and not in the
   page. Every table below is table-layout:fixed at width:100%, so a table can
   never be wider than this box; what does not fit is dropped by a media query
   or ellipsed, never pushed off-screen. Before this, the eight-column
   recommendation table measured 1.479px inside a 1.440px window and dragged
   the whole document sideways.
   It also means the wrapper is no longer a scroll container, which is what
   position:sticky resolves against — so the headers now stick at every width
   instead of only above 1.000px. */
.t-wrap{overflow:visible; max-width:100%}
thead th{
  position:sticky;
  /* sits directly under the filter bar, whose height JS measures at runtime */
  top:var(--filters-h, 58px);
  z-index:6;
  background:var(--surface);
}
/* The sticky row needs its own rule, since border-bottom does not travel with it. */
thead th::after{
  content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px;
  background:var(--axis);
}
table{width:100%; border-collapse:collapse; margin-top:10px; font-size:13px;
  table-layout:fixed}
th,td{text-align:right; padding:7px 8px; border-bottom:1px solid var(--rule);
  font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis}
th:first-child,td:first-child{text-align:left; font-variant-numeric:normal}
th{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
  font-weight:650; border-bottom:1px solid var(--axis);
  /* Headers wrap; they do not get cut. With table-layout:fixed a header that
     does not fit is silently truncated, and "RECOMENDA…" is not a word.
     Romper DENTRO de la palabra es el último recurso, no el primero: a 1440px
     sobra sitio y aun así salía «RECOMENDAD / O». Así que aquí solo se permite
     envolver por los espacios; partir letras queda para los anchos estrechos. */
  white-space:normal}

/* ── Sortable headers ─────────────────────────────────────────────────
   Every table on the page sorts by any of its columns. The arrow is always
   present, faint until the column is the active one: a control that only
   appears on hover is a control nobody finds on a touch screen. */
th.sortable{cursor:pointer; user-select:none}
th.sortable:hover{color:var(--ink)}
th.sortable::before{
  content:"↕"; font-size:9px; opacity:.35; margin-right:5px;
  display:inline-block; vertical-align:1px;
}
th.sortable:hover::before{opacity:.7}
th[aria-sort="ascending"], th[aria-sort="descending"]{color:var(--ink)}
th[aria-sort="ascending"]::before {content:"↑"; opacity:1; color:var(--accent)}
th[aria-sort="descending"]::before{content:"↓"; opacity:1; color:var(--accent)}
td{white-space:nowrap}
td.prod-cell{white-space:normal}
tbody tr:hover{background:color-mix(in srgb, var(--accent) 6%, transparent)}
td a{color:var(--ink); text-decoration:none; border-bottom:1px solid var(--axis)}
td a:hover{color:var(--accent); border-color:var(--accent)}
.thumb{
  width:46px; height:46px; border-radius:0; flex:none; object-fit:contain;
  /* Packshots sit on the brand's flat grey stage, as they do on the site. */
  background:var(--stage);
  border:1px solid var(--rule);
}
.thumb[data-failed]{
  background:
    repeating-linear-gradient(45deg, transparent 0 5px, color-mix(in srgb,var(--ink) 5%,transparent) 5px 10px),
    color-mix(in srgb, var(--ink) 3%, transparent);
}
.prod{display:flex; align-items:center; gap:12px}
.prod-name{display:flex; flex-direction:column; gap:1px; min-width:0}
.prod-name small{color:var(--muted); font-size:11.5px; letter-spacing:.03em;
  display:flex; align-items:center; gap:0}
.prod-name a{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
.prod-name small{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
td.prod-cell{padding:8px}
.badge{
  display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.04em;
  padding:3px 8px; border-radius:0; white-space:nowrap;
}
.badge.caro{background:color-mix(in srgb, var(--s2) 18%, transparent); color:var(--ink)}
.badge.barato{background:color-mix(in srgb, var(--good) 18%, transparent); color:var(--ink)}
/* Same price is its own state, not a weak win: blue, distinct from both. */
.badge.igual{background:color-mix(in srgb, var(--s1) 20%, transparent); color:var(--ink)}
tr.igual-row{background:color-mix(in srgb, var(--s1) 6%, transparent)}
/* A model with several rivals reads as one product: the name prints once and a
   heavier rule opens the group, so repeated rows are visibly continuations. */
tr.grp-start td{border-top:1px solid var(--axis)}
tr.grp-cont td.prod-cell{padding-left:70px}
td.cont-mark{color:var(--muted); font-size:12px}
.delta-up{color:var(--s2); font-weight:700}
.delta-dn{color:var(--good); font-weight:700}
.delta-eq{color:var(--s1); font-weight:700}
/* Marks the cheapest price for a product, across us and every rival. */
.star{color:var(--s2); font-weight:700; margin-right:4px; font-size:13px}
td.best{font-weight:700}
.edad{color:var(--muted); font-size:12px; white-space:nowrap}
.edad.stale{color:var(--s2)}
/* ── Column widths ────────────────────────────────────────────────────
   With table-layout:fixed the widths are a decision, not an outcome, so they
   are stated once per table. Below each breakpoint the least load-bearing
   columns are dropped rather than squeezed: eight columns on a phone is eight
   illegible columns. The data is still in the table view and in the tooltip. */
/* 9 columnas: Modelo · Tramo · Actual · Recomendado · Dif. · Posición rec. ·
   Margen rec. · Confianza · Por qué */
.t-rec  th:nth-child(1){width:16%} .t-rec th:nth-child(2){width:7%}
.t-rec  th:nth-child(4){width:11.5%}
.t-rec  th:nth-child(8){width:12%} .t-rec th:nth-child(9){width:17%}
.t-rec  td:nth-child(2){color:var(--muted); font-family:var(--display);
  font-size:11px; font-weight:700; letter-spacing:.04em}
.t-comp th:nth-child(1){width:20%} .t-comp th:nth-child(7){width:14%}
.t-cat  th:nth-child(1){width:34%}
/* El nombre del competidor es la única celda de texto libre que queda en la
   fila, y algunos son largos de verdad. Envuelve en vez de recortarse, y el
   título lleva el nombre completo para el caso extremo. */
.t-comp td.rival{white-space:normal; overflow-wrap:anywhere}
/* The "why" column is prose, so it wraps instead of ellipsing. */
.t-rec td:nth-child(9){white-space:normal}


@media (max-width:1000px){
  /* recommended: drop recommended position and recommended margin */
  .t-rec th:nth-child(6), .t-rec td:nth-child(6),
  .t-rec th:nth-child(7), .t-rec td:nth-child(7),
  /* competition: drop the euro gap (the % stays) and the reading age */
  .t-comp th:nth-child(4), .t-comp td:nth-child(4),
  .t-comp th:nth-child(8), .t-comp td:nth-child(8){display:none}
  /* Con dos columnas menos el reparto cambia: la de confianza se queda corta
     y recorta el símbolo de porcentaje. Más ancho de columna, barra más corta. */
  .t-rec th:nth-child(2){width:10%}
  .t-rec th:nth-child(4){width:15%}
  .t-rec th:nth-child(8){width:15%}
  .conf-bar{width:30px}
}
@media (max-width:720px){
  .t-rec th:nth-child(5), .t-rec td:nth-child(5),
  .t-rec th:nth-child(9), .t-rec td:nth-child(9),
  .t-comp th:nth-child(6), .t-comp td:nth-child(6),
  .t-cat  th:nth-child(2), .t-cat  td:nth-child(2),
  .t-cat  th:nth-child(5), .t-cat  td:nth-child(5){display:none}
  .thumb{width:34px; height:34px}
  tr.grp-cont td.prod-cell{padding-left:28px}
  th,td{padding:7px 5px}
  /* Al caer columnas, los anchos de arriba dejan de valer: el 11,5 % pensado
     para nueve columnas son 38px cuando quedan cinco, y «178,00 €» no cabe.
     Lo visible aquí es Modelo · Tramo · Actual · Recomendado · Confianza. */
  .t-rec th:nth-child(1){width:36%}
  .t-rec th:nth-child(2){width:9%}
  .t-rec th:nth-child(4){width:20%}
  .t-rec th:nth-child(8){width:16%}
  .t-comp th:nth-child(1), .t-cat th:nth-child(1){width:36%}
  /* La barra de confianza es redundante cuando el número está al lado y, a
     este ancho, le roba al número los píxeles del símbolo de porcentaje. */
  .conf-bar{display:none}
  .f-count{margin-left:0}
  /* A este ancho sí: media palabra legible es mejor que media palabra oculta. */
  th{letter-spacing:.02em; overflow-wrap:anywhere}
}

/* Debajo de 560px no caben cinco columnas de cifras sin cortar los importes,
   y un precio cortado es peor que un precio ausente: «180,00 €» recortado a
   «180,0…» se lee como otro número. Antes de esto, 3.015 celdas se recortaban
   a 430px y 3.575 a 360px, con el símbolo del euro fuera de la celda.
   Así que caen más columnas y las que quedan se ensanchan. */
@media (max-width:560px){
  table{font-size:12px}
  th,td{padding:6px 4px}
  /* comparativa: nuestro precio contra el suyo, y quién es. El % se deduce de
     los dos importes que están uno al lado del otro. */
  .t-comp th:nth-child(5), .t-comp td:nth-child(5),
  .t-comp th:nth-child(7), .t-comp td:nth-child(7),
  .t-rec  th:nth-child(2), .t-rec  td:nth-child(2){display:none}
  .t-comp th:nth-child(1){width:34%}
  /* El nombre del rival pierde su columna, así que pasa debajo de su precio. */
  .rival-sm{display:block}
  /* Sin la columna de tramo quedan cuatro, y vuelven a repartirse. */
  .t-rec th:nth-child(1){width:32%}
  .t-rec th:nth-child(4){width:24%}
  .t-rec th:nth-child(8){width:20%}
  .t-cat th:nth-child(1){width:32%}
  /* Las tablas desplegables son etiquetas y cifras dentro de un <details>,
     donde el alto es gratis. Que envuelvan: una fecha recortada a
     «2026-09-2…» no es una fecha corta, es una fecha equivocada. */
  .t-simple td, .t-simple th{white-space:normal; overflow-wrap:anywhere}
}
/* El nombre del rival solo existe cuando su columna no. */
.rival-sm{display:none; color:var(--muted); font-size:10.5px; letter-spacing:.02em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

.comp-note{
  font-size:12px; color:var(--muted); margin:12px 0 0; padding-top:10px;
  border-top:1px solid var(--rule);
}
.pager{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  margin-top:14px; padding-top:13px; border-top:1px solid var(--rule);
}
.pager .range{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.pager .grow{margin-left:auto}
.pager select{padding:5px 8px; font-size:12.5px}
button.pg{
  font-family:var(--sans); font-size:12.5px; font-weight:600; color:var(--ink-2);
  background:var(--plane); border:1px solid var(--rule); border-radius:0;
  min-width:34px; height:32px; padding:0 11px; cursor:pointer; transition:.15s;
}
button.pg:hover:not(:disabled){color:var(--ink); border-color:var(--axis)}

.pager .of{font-size:12.5px; color:var(--ink-2); font-variant-numeric:tabular-nums;
  padding:0 4px; min-width:66px; text-align:center}
.tag{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.04em;
  padding:2px 6px; border-radius:0; background:color-mix(in srgb, var(--s2) 16%, transparent);
  color:var(--ink); margin-left:6px}

/* ── Tooltip ──────────────────────────────────────────────────────────── */
#tip{
  position:fixed; pointer-events:none; opacity:0; transform:translateY(3px);
  transition:opacity .12s, transform .12s; z-index:90;
  background:var(--ink); color:var(--plane); font-size:12.5px; line-height:1.45;
  padding:8px 11px; border-radius:0; max-width:280px;
  box-shadow:var(--shadow-chip);
}
#tip.on{opacity:1; transform:translateY(0)}
#tip b{font-weight:700} #tip .t-k{opacity:.66}

/* ── States / footer ──────────────────────────────────────────────────── */
.state{padding:56px 20px; text-align:center; color:var(--muted); font-size:15px}
.state.err{color:#d03b3b}
#app[data-loading="1"]{opacity:.45; transition:opacity .2s}
footer{border-top:1px solid var(--rule); margin-top:36px; padding:26px 0 40px;
  color:var(--muted); font-size:12.5px; display:flex; justify-content:space-between;

.sig{display:inline-flex; align-items:center; gap:6px; text-decoration:none;
  color:var(--muted); opacity:.65; transition:.2s; font-size:11.5px; letter-spacing:.04em}
.sig:hover{opacity:1; color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}

/* ── Creative Studio ── */
.cr-bar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:0 0 12px}
.cr-bar input{flex:1 1 220px; min-width:0; padding:8px 10px; border:1px solid var(--rule); font:inherit; background:var(--surface); color:var(--ink)}
.cr-table td:last-child{text-align:right}
.cr-table tr.cr-on td{background:var(--stage)}
.cr-panel{border:2px solid var(--ink); padding:16px; margin:0 0 20px; background:var(--surface)}
.cr-prod{display:flex; gap:16px; align-items:center; flex-wrap:wrap}
.cr-prod img{width:120px; height:120px; object-fit:contain; background:var(--stage)}
.cr-prod h3{margin:2px 0; font-family:var(--display); text-transform:uppercase; font-size:20px}
.cr-k{margin:0; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--fs-red)}
.cr-m{margin:0; color:var(--muted); font-size:13px}
.cr-p{margin:6px 0 0; font-size:15px} .cr-p b{font-family:var(--price); font-size:24px; color:var(--fs-red)}
.cr-form{display:flex; gap:14px; flex-wrap:wrap; margin:14px 0 6px}
.cr-form .param{display:flex; flex-direction:column; gap:4px}
.cr-acts{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px}

.cr-card img, .cr-card video{width:100%; display:block; background:var(--stage)}
.cr-card figcaption{padding:10px 12px 12px; font-size:13px; line-height:1.5}
.cr-card figcaption a{display:inline-block; margin-top:6px; font-weight:700; color:var(--ink)}
.cr-rec{font-family:var(--price); font-size:20px; color:var(--fs-red)}
.cr-vid{position:relative} .cr-wm{position:absolute; left:8px; bottom:44px; width:30%!important; background:transparent!important; pointer-events:none}

<body>
<div id="tip" role="status" aria-live="polite"></div>

<div class="wrap">
  <header class="mast">
    <div class="mast-brand">
      <img src="assets/forum-sport.webp" alt="Forum Sport · El deporte nos_une">
      <h1 class="tool">Pricing lab</h1>
      <div class="mast-actions">

/* Sustituye {hueco} por valores ya formateados. Una clave que falte se
   devuelve tal cual, visible en la página: un hueco en blanco se cuela en
   producción, una clave cruda no. */
function t(k, vals){
  const e = T[k];
  let s = e ? (e[LANG] ?? e.es) : k;
  if(vals) for(const n in vals) s = s.split("{"+n+"}").join(vals[n]);
  return s;
}
// Valores del catálogo que se muestran traducidos pero se filtran en crudo.

/* ── formatting ───────────────────────────────────────────────────────── */
let nf, nf1, eur, eur2, rtf, fechaCorta, fechaLarga;
function formatos(){
  const l = LOC();
  nf  = new Intl.NumberFormat(l);
  nf1 = new Intl.NumberFormat(l,{minimumFractionDigits:1,maximumFractionDigits:1});
  eur = new Intl.NumberFormat(l,{style:"currency",currency:"EUR",maximumFractionDigits:0});
  eur2= new Intl.NumberFormat(l,{style:"currency",currency:"EUR",minimumFractionDigits:2});
  rtf = new Intl.RelativeTimeFormat(l, {numeric:"auto"});
  fechaCorta = new Intl.DateTimeFormat(l,{day:"numeric",month:"short"});
  fechaLarga = new Intl.DateTimeFormat(l,{dateStyle:"long", timeStyle:"short"});
}
formatos();
const pct = v => nf1.format(v)+" %";
const N   = v => v===null||v===undefined ? null : Number(v);   // PostgREST sends numeric as string

/* How old a price is matters more than when it was taken, so recent readings
   are relative and older ones fall back to a date. */
function antiguedad(iso){
  if(!iso) return {txt:"—", full:"", stale:false};
  const d = new Date(iso), mins = Math.round((Date.now() - d) / 60000);
  const txt = mins < 1      ? t("g.ahora")
            : mins < 60     ? rtf.format(-mins, "minute")
            : mins < 1440   ? rtf.format(-Math.round(mins/60), "hour")
            : mins < 10080  ? rtf.format(-Math.round(mins/1440), "day")
            : fechaCorta.format(d);
  return {txt, full: fechaLarga.format(d), stale: mins > 10080};
}

/* ── Secciones ─────────────────────────────────────────────────────────
   Tres trabajos distintos en una sola página: mirar cómo vamos, mirar un
   producto concreto, y decidir un precio. Hasta ahora convivían en una columna
   de diez tarjetas donde la tabla de comparativa enterraba todo lo que venía
   detrás.

   La sección vive en el hash de la URL, no en localStorage: así una vista se
   puede enviar por correo, y el botón Atrás del navegador funciona. Los filtros
   son globales a propósito — se mantienen al cambiar de sección, porque
   "Nike, en rebaja" es la misma pregunta en las tres. */
const SECCIONES = ["home", "explorer", "pricing", "creative", "scraping"];
let SECCION = SECCIONES.includes(location.hash.slice(1)) ? location.hash.slice(1) : "home";
addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if(SECCIONES.includes(h) && h !== SECCION){ SECCION = h; if(ROWS.length) render(); }
});
// Sets, so each filter takes 1..n values. An empty set means "no restriction",
// which keeps the default cheap: no membership test runs until something is picked.
const F = { q:"", marcas:new Set(), tipos:new Set(), competidores:new Set(), rebaja:false,
            desde:null, hasta:null };

/* ── the eight catalogue dimensions Forum Sport asked to filter by ──────
   Declared as data, not as eight near-identical blocks: every one of them is
   "pick 1..n values of one column", so the filter row, the predicate and the
   reset button are each written once and loop.

   Two normalisations make the Sets homogeneous:
   · booleans become "true"/"false", because a checkbox value is a string;
   · NULL becomes SIN, so "no classification" is a value the user can pick
     rather than a silently unreachable 294 models. */
const SIN = "__sin__";
const dimVal = (d, campo) => {
  const v = d[campo];
  return (v === null || v === undefined || v === "") ? SIN : String(v);
};
const siNo    = v => v === "true" ? t("si") : t("no");
const ABCD    = ["AA","A","B","C","D",SIN];
const abcdLab = v => v === SIN ? t("abcd.sin")
               : v === "AA" ? t("abcd.AA")
               : v === "D"  ? t("abcd.D") : v;
// Las etiquetas son funciones, no cadenas: DIMS se construye una vez al cargar
// y tiene que seguir siendo correcto después de cambiar de idioma.
const DIMS = [
  {k:"temporadas",  campo:"temporada",        label:()=>t("dim.temporada"),
   fmt:v=>["AN","OI","PV"].includes(v)?t("temp."+v):v},
  {k:"anos",        campo:"ano_temporada",    label:()=>t("dim.ano"),
   // 9998 is the dataset's "no year" sentinel, not a year.
   fmt:v=>v==="9998"?t("sinAno"):v, sort:(a,b)=>b.value.localeCompare(a.value)},
  {k:"exclusivo",   campo:"exclusivo_online", label:()=>t("dim.exclusivo"), fmt:siNo},
  {k:"outlet",      campo:"outlet",           label:()=>t("dim.outlet"),    fmt:siNo},
  {k:"catExt",      campo:"cat_extendido",    label:()=>t("dim.catExt"),    fmt:siNo},
  {k:"customLabel", campo:"custom_label",     label:()=>t("dim.customLabel"),
   fmt:v=>v===SIN?t("sinEtiqueta"):v},
  {k:"abcdTienda",  campo:"abcd_tienda",      label:()=>t("dim.abcdTienda"), fmt:abcdLab,
   sort:(a,b)=>ABCD.indexOf(a.value)-ABCD.indexOf(b.value)},
  {k:"abcdDigital", campo:"abcd_digital",     label:()=>t("dim.abcdDigital"), fmt:abcdLab,
   sort:(a,b)=>ABCD.indexOf(a.value)-ABCD.indexOf(b.value)},
];
for(const d of DIMS) F[d.k] = new Set();

// Accent- and case-insensitive: "galaxy" must find "GALAXY", "peregrine" must
// find "PEREGRINE GORE-TEX", and an accented query must not miss its own match.
const norm = str => (str||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

// render() rebuilds the filter row on every keystroke, so focus and caret are
// re-read from the DOM at the top of render() rather than tracked in a flag.

async function page(offset){
  const u = `${URL_}/rest/v1/v_modelos_detalle?select=${FIELDS}&order=modelo&limit=1000&offset=${offset}`;
  const r = await fetch(u,{headers:{apikey:ANON, Authorization:`Bearer ${ANON}`}});
  if(!r.ok) throw new Error(`${r.status} ${r.statusText} — ${(await r.text()).slice(0,160)}`);
  return r.json();
}

// PostgREST caps every response at 1.000 rows. Any table that can outgrow that
// must be read in pages or it is silently truncated — which is exactly what
// happened to the comparison once it passed 1.000 rows.
async function pagedFetch(url){
  const out=[]; let off=0;
  for(;;){
    const r = await fetch(`${url}&limit=1000&offset=${off}`,
                          {headers:{apikey:ANON, Authorization:`Bearer ${ANON}`}});
    if(!r.ok) return off ? out : null;
    const p = await r.json();
    out.push(...p);
    if(p.length < 1000) return out;
    off += 1000;
  }
}

async function loadComparison(){
  // comparativa_publica is a narrow, public table refreshed by the scraper:
  // prices and the difference between them. Margin and cost stay private.
  const u = `${URL_}/rest/v1/comparativa_publica`
    + `?select=modelo,marca,nombre_modelo,img_thumb,url_fs,precio_fs,pvp,`
    + `competidor,precio_comp,url_comp,delta_eur,delta_pct,somos_mas_baratos,`
    + `nivel_stock,skus_vistos,skus_disponibles,promo,observed_at,match_method`
    // A non-unique sort key is not a stable paging order: rows tied on
    // delta_pct could repeat or vanish between pages, so break the tie.
    + `&order=delta_pct.desc,modelo.asc,competidor.asc`;
  try{
    const rows = await pagedFetch(u);
    if(!rows) return [];                       // no comparison yet is not an error
    return rows.map(d=>({...d,
      precio_fs:N(d.precio_fs), pvp:N(d.pvp), precio_comp:N(d.precio_comp),
      delta_eur:N(d.delta_eur), delta_pct:N(d.delta_pct)}));
  }catch{ return []; }
}

/* How many rows the browser will aggregate before we stop asking for the full
   grain. Past this the page fetches only each day's cheapest rival, which keeps
   the headline series exact and makes the competitor filter stop narrowing the
   reference price — stated in the card rather than silently degraded. */
const LIMITE_FILAS = 40000;
const RANGO_STALE  = 7;            // days an observation may be carried forward

async function loadHistoria(desde, hasta){
  const rango = desde ? `&fecha=gte.${desde}` + (hasta?`&fecha=lte.${hasta}`:"") : "";
  const base = `${URL_}/rest/v1/posicionamiento_historico`;
  let soloBarato = false;
  try{
    // Ask how big the window is before committing to downloading it.
    const head = await fetch(`${base}?select=fecha${rango}&limit=1`,
      {headers:{apikey:ANON, Authorization:`Bearer ${ANON}`,
                Prefer:"count=exact", Range:"0-0"}});
    const total = Number((head.headers.get("content-range")||"").split("/")[1]) || 0;
    soloBarato = total > LIMITE_FILAS;
  }catch{ /* fall through: the fetch below will report the real failure */ }

  const u = base
    + `?select=fecha,modelo,competidor,precio_fs,precio_comp,posicionamiento,es_mas_barato`
    + rango
    + (soloBarato ? "&es_mas_barato=is.true" : "")
    + `&order=fecha.asc,modelo.asc,competidor_slug.asc`;
  try{
    const rows = await pagedFetch(u);
    HIST_COMPLETO = !soloBarato;
    HIST_RANGO = desde ? {desde, hasta} : null;
    if(!rows) return [];
    return rows.map(d=>({...d,
      precio_fs:N(d.precio_fs), precio_comp:N(d.precio_comp),
      posicionamiento:N(d.posicionamiento)}));
  }catch{ return []; }
}

/* The daily POSICIONAMIENTO ONLINE %.

   Deliberately computed here, over the same model objects filtered() just
   returned, rather than in SQL. An RPC would mean the filter predicate existed
   twice in two languages with no shared test, and this project has already paid
   for that twice (migrations 012 and 016). A dropped match is visible; a filter
   that disagrees by 3 % is a plausible-looking chart that is quietly wrong.

   Two corrections the raw average needs:
   · a FIXED BASKET — the models in view, not "whatever was crawled that day",
     so the line moves when prices move and not when coverage does;
   · CARRY-FORWARD, capped at 7 days — a rival's price is still what we last saw
     until we see otherwise. Without it a catalogue crawled competitor-by-
     competitor renders as a sawtooth. */
function serieDiaria(modelos){
  if(!HIST.length) return [];
  const enVista = new Set(modelos.map(m=>m.modelo));
  const comps   = F.competidores;
  const DIA = 86400000;

  // Observations indexed per (modelo, competidor): carry-forward has to run per
  // RIVAL, not per model. Collapsing to "the model's cheapest price that day"
  // first would throw away a still-valid cheaper rival on any day when only a
  // dearer one happened to be crawled — and the crawler does visit one
  // competitor at a time.
  const obs = new Map();            // "modelo|competidor" -> Map(fecha -> precio)
  const nuestro = new Map();        // "modelo|fecha" -> our price that day
  const dias = new Set(), compsDia = new Map();

  for(const h of HIST){
    if(!enVista.has(h.modelo)) continue;
    if(comps.size && !comps.has(h.competidor)) continue;
    if(h.precio_fs == null || !(h.precio_comp > 0)) continue;
    dias.add(h.fecha);
    if(!compsDia.has(h.fecha)) compsDia.set(h.fecha, new Set());
    compsDia.get(h.fecha).add(h.competidor);
    nuestro.set(h.modelo+"|"+h.fecha, h.precio_fs);
    const k = h.modelo+"|"+h.competidor;
    let m = obs.get(k); if(!m){ m = new Map(); obs.set(k, m); }
    const prev = m.get(h.fecha);
    if(prev == null || h.precio_comp < prev) m.set(h.fecha, h.precio_comp);
  }

  const fechas = [...dias].sort();
  if(!fechas.length) return [];
  const tiempos = fechas.map(f=>Date.parse(f));

  // For each rival timeline, carry its last price forward (max 7 days), then
  // keep the cheapest live rival per (día, modelo).
  const refs = fechas.map(()=>new Map());   // índice de día -> Map(modelo -> precio)
  for(const [k, porFecha] of obs){
    const modelo = Number(k.slice(0, k.indexOf("|")));
    let ultimo = null, ultimoT = 0;
    for(let i=0;i<fechas.length;i++){
      const hoy = porFecha.get(fechas[i]);
      if(hoy != null){ ultimo = hoy; ultimoT = tiempos[i]; }
      else if(ultimo == null || (tiempos[i]-ultimoT) > RANGO_STALE*DIA) continue;
      const precio = hoy != null ? hoy : ultimo;
      const prev = refs[i].get(modelo);
      if(prev == null || precio < prev) refs[i].set(modelo, precio);
    }
  }

  // Our own price: that day's if we have it, otherwise the most recent we saw.
  const fsCarry = new Map();
  const mediana = a => { const b=[...a].sort((x,y)=>x-y), i=b.length>>1;
    return b.length%2 ? b[i] : (b[i-1]+b[i])/2; };

  const puntos = fechas.map((f,i)=>{
    const a=[];
    for(const [modelo, precio] of refs[i]){
      const hoy = nuestro.get(modelo+"|"+f);
      if(hoy != null) fsCarry.set(modelo, hoy);
      const fs = hoy != null ? hoy : fsCarry.get(modelo);
      if(fs == null) continue;
      a.push(fs / precio * 100);
    }
    return {
      k: new Date(f+"T00:00:00").toLocaleDateString(LOC(),{day:"2-digit",month:"short"}),
      t: tiempos[i], fecha: f,
      // Mean, so the chart and the "diferencia media" KPI are the same statistic.
      // The median rides along in the tooltip so skew stays visible.
      v: a.length ? a.reduce((x,y)=>x+y,0)/a.length : null,
      mediana: a.length ? mediana(a) : null,
      n: a.length, comps: (compsDia.get(f)||new Set()).size,
    };
  });
  // A day where we happened to crawl one small competitor is not comparable
  // with a day covering the whole catalogue: its average says more about who we
  // looked at than about our prices. Those days stay on the chart — hiding them
  // would be worse — but they are drawn and read as low-confidence.
  const nMax = Math.max(0, ...puntos.map(p=>p.n));
  for(const pt of puntos) pt.flojo = pt.n > 0 && nMax > 0 && pt.n < 0.3*nMax;
  return puntos;
}

async function load(){
  // PostgREST caps a response at 1.000 rows, so the 1.483 models come in two pages.
  const out=[]; let off=0;
  for(;;){ const p = await page(off); out.push(...p); if(p.length<1000) break; off+=1000; }
  return out.map(d=>({...d,
    precio:N(d.precio), precio_rebaja:N(d.precio_rebaja), descuento_pct:N(d.descuento_pct),
    margen:N(d.margen), cobertura_stock:N(d.cobertura_stock), num_skus:N(d.num_skus),
    ano_temporada:N(d.ano_temporada),
    nivel_margen_orden:N(d.nivel_margen_orden), nivel_stock_orden:N(d.nivel_stock_orden)}));
}

// Models carrying a price from each selected competitor. Selecting a competitor
// narrows the whole page, not just the comparison table, so every chart and KPI
// describes the same slice.
const modelosDe = comps => {
  if(!comps.size) return null;
  const ok = new Set();
  for(const c of COMP) if(comps.has(c.competidor)) ok.add(c.modelo);
  return ok;
};

const filtered = () => {
  const conComp = modelosDe(F.competidores);
  const q = norm(F.q);
  return ROWS.filter(d =>
    (!q || norm(d.nombre_modelo).includes(q) || norm(d.marca).includes(q)) &&
    (!F.marcas.size || F.marcas.has(d.brand_code)) &&
    (!F.tipos.size  || F.tipos.has(d.tipo_producto)) &&
    (!F.rebaja      || d.en_rebaja) &&
    (!conComp       || conComp.has(d.modelo)) &&
    DIMS.every(dm => !F[dm.k].size || F[dm.k].has(dimVal(d, dm.campo))));
};

/* ── tooltip ──────────────────────────────────────────────────────────── */
const tip = document.getElementById("tip");
function bindTip(el, html){
  const show = e => {
    tip.innerHTML = html; tip.classList.add("on");
    const r = tip.getBoundingClientRect();
    const x = Math.min(Math.max(8,(e.clientX??0)+14), innerWidth -r.width -8);
    const y = Math.max(8,(e.clientY??0)-r.height-12);
    tip.style.left = x+"px"; tip.style.top = y+"px";
  };
  el.addEventListener("mouseenter",show); el.addEventListener("mousemove",show);
  el.addEventListener("focus",e=>{
    const b=el.getBoundingClientRect();
    show({clientX:b.left+b.width/2, clientY:b.top});
  });
  const hide=()=>tip.classList.remove("on");
  el.addEventListener("mouseleave",hide); el.addEventListener("blur",hide);
}

/* ── Motor de precio recomendado ───────────────────────────────────────
   Esto NO es un optimizador de precio. Un óptimo económico es el argmax de
   (p − coste) · q(p), y q(p) — la demanda — no existe en ningún sitio de este
   proyecto: no hay unidades vendidas, ni ingresos, ni tráfico, ni conversión.
   Sin demanda no hay elasticidad, y sin elasticidad no hay óptimo.

   Lo que sí sostienen los datos es un recomendador por reglas con barreras
   duras: una posición objetivo frente al rival más barato, modulada por
   rotación y stock, recortada por barreras que no se negocian. Es la mitad
   "reglas" de la arquitectura híbrida que hoy se considera buena práctica; la
   mitad "ML dentro de las barreras" queda para cuando lleguen las ventas.

   Vive en el cliente, en una sola implementación, porque los parámetros son
   editables y mover un control tiene que recalcular al instante. Escribir las
   reglas también en SQL significaría tenerlas dos veces: este proyecto ya pagó
   ese error dos veces (migraciones 012 y 016). */

const PARAMS_DEF = {
  // Posición objetivo, en % de la referencia de mercado, por rotación
  // (abcd_digital). Medido: hoy estamos en AA 109,8 · A 106,8 · B 109,9 ·
  // C 110,5 · D 115,0, así que todos estos objetivos son un recorte, y el más
  // hondo cae sobre los más vendidos — los que fijan la percepción de precio.
  obj_AA:100, obj_A:102, obj_B:105, obj_C:108, obj_D:112, obj_sin:106,
  // Ajuste en puntos porcentuales por nivel de stock. Descontar producto que
  // apenas tienes es regalar margen; de ahí el signo positivo abajo.
  stk_muy_alto:-4, stk_alto:-2, stk_medio:0, stk_bajo:2, stk_muy_bajo:4,
  aj_outlet:-3,          // outlet empuja a la baja
  aj_temporada_vieja:-3, // temporada anterior a la vigente
  redondeo:1,            // escalón del precio final, en euros
  referencia:"min",      // qué competidor es "la referencia": min | media | mediana

  /* ── Matriz de tramos de precio ──────────────────────────────────────
     La política de Forum Sport no es un suelo de margen único: es una matriz
     por tramo de precio donde cada tramo exige un margen mínimo EN PORCENTAJE
     Y OTRO EN EUROS —los dos, no el que convenga— y fija un alineamiento
     máximo frente a la referencia de mercado.

     Los dos suelos no son redundantes. Medido sobre el catálogo, el suelo en
     euros es el que manda en 212 modelos, y en el tramo alto en 64 de 79: los
     pares (20 %, 20 €) y (18 %, 36 €) se cruzan exactamente en 100 € y 200 €,
     que son las fronteras de sus tramos. Están calibrados, no aproximados.

     `cortes` son solo las cuatro fronteras interiores. El primer tramo empieza
     en 0 y el último no termina, así que la partición es contigua y exhaustiva
     por construcción y no hay forma de editar un hueco o un solape. */
  cortes:[30, 60, 100, 200],        // €; frontera entre tramo i y tramo i+1
  mg_pct:[30, 27, 24, 20, 18],      // % mínimo sobre el coste sintético
  mg_eur:[2,  8,  14, 20, 36],      // € mínimos sobre el coste sintético
  c_max :[102,101,100, 99, 98],     // alineamiento MÁXIMO vs la referencia, %
};
const N_TRAMOS = 5;
// v2: la forma guardada cambió —desapareció margen_min, apareció la matriz—, y
// un blob antiguo cargado sobre la forma nueva dejaría el motor medio
// configurado sin decirlo.
const PARAMS_KEY = "fs-pricing-params-v2";
let P = JSON.parse(JSON.stringify(PARAMS_DEF));
try{
  const g = JSON.parse(localStorage.getItem(PARAMS_KEY) || "{}");
  for(const k in PARAMS_DEF){
    const def = PARAMS_DEF[k], got = g[k];
    if(Array.isArray(def)){
      // Longitud y tipo, o se descarta entero: media matriz es peor que ninguna.
      if(Array.isArray(got) && got.length === def.length
         && got.every(v => typeof v === "number" && Number.isFinite(v))) P[k] = got.slice();
    } else if(typeof def === "number"){
      if(typeof got === "number" && Number.isFinite(got)) P[k] = got;
    } else if(typeof def === "string"){
      if(typeof got === "string") P[k] = got;
    }
  }
}catch{}
const guardarParams = () => { try{ localStorage.setItem(PARAMS_KEY, JSON.stringify(P)); }catch{} };

const ANO_VIGENTE = 2026;
const OBJ_POR_ABCD = r => {
  const k = r.abcd_digital || r.abcd_tienda;
  return k==="AA"?P.obj_AA : k==="A"?P.obj_A : k==="B"?P.obj_B
       : k==="C"?P.obj_C  : k==="D"?P.obj_D : P.obj_sin;
};
const AJ_STOCK = r => ({"muy alto":P.stk_muy_alto, "alto":P.stk_alto, "medio":P.stk_medio,
                        "bajo":P.stk_bajo, "muy bajo":P.stk_muy_bajo})[r.nivel_stock] ?? 0;

/* Tramo de un precio. Convención [inicio, final): un producto a 30,00 € exactos
   cae en el tramo 2, no en el 1. Es justo el detalle que luego nadie sabe
   responder, así que la tarjeta lo dice en voz alta. */
const tramoDe = precio => {
  for(let i=0; i<P.cortes.length; i++) if(precio < P.cortes[i]) return i;
  return P.cortes.length;
};

/* La referencia de mercado. El mínimo es el rival más barato —lo que el motor
   usaba siempre—; media y mediana reparten el peso entre todos los rivales
   observados. Con un solo competidor las tres coinciden, que es el caso de 279
   de los 571 modelos comparados. */
const REFERENCIAS = ["min", "media", "mediana"];
function referenciaDe(comps){
  const ps = comps.map(x => x.precio_comp).filter(v => v > 0).sort((a,b) => a-b);
  if(!ps.length) return null;
  if(P.referencia === "media")   return ps.reduce((s,v) => s+v, 0) / ps.length;
  if(P.referencia === "mediana"){ const i = ps.length >> 1;
    return ps.length % 2 ? ps[i] : (ps[i-1] + ps[i]) / 2; }
  return ps[0];
}

/* Confianza 0–100: una suma de hechos medibles sobre la CALIDAD DEL DATO, no
   una corazonada sobre el precio. Cada factor responde a una pregunta concreta:
   ¿hay mercado?, ¿es el mismo producto?, ¿sigue vigente?, ¿los rivales se
   ponen de acuerdo?, ¿sabemos si el producto rota? */
function confianza(r, comps){
  const n = comps.length;
  let c = 0, notas = [];
  c += n===0 ? 0 : n===1 ? 15 : n===2 ? 26 : n<=4 ? 34 : 40;
  if(n===0) notas.push(t("c.sinPrecios"));
  if(n===1) notas.push(t("c.unSolo"));

  if(n){
    // gtin13 es talla exacta; ref_prov empareja a nivel de modelo y puede
    // cruzar nuestro color con otro suyo.
    const exacto = comps.some(x=>x.match_method==="gtin13");
    c += exacto ? 15 : 8;
    if(!exacto) notas.push(t("c.porCodigo"));

    const dias = Math.max(0, Math.round(
      (Date.now() - Math.max(...comps.map(x=>Date.parse(x.observed_at)||0))) / 86400000));
    c += dias<=1 ? 20 : dias<=7 ? 14 : dias<=14 ? 8 : dias<=30 ? 3 : 0;
    if(dias>7) notas.push(t("c.antiguo",{n:dias}));
  }
  if(n>=2){
    const ps = comps.map(x=>x.precio_comp).filter(v=>v>0);
    const disp = (Math.max(...ps)-Math.min(...ps))/Math.min(...ps)*100;
    c += disp<5 ? 15 : disp<15 ? 10 : disp<30 ? 5 : 0;
    if(disp>=15) notas.push(t("c.discrepan",{p:pct(disp)}));
  }
  c += r.abcd_digital ? 10 : r.abcd_tienda ? 5 : 0;
  if(!r.abcd_digital && !r.abcd_tienda) notas.push(t("c.sinRot"));

  // Un único punto de mercado no puede corroborarse por mucho que sea fresco y
  // exacto: por encima de 45 estaríamos fingiendo certeza.
  if(n<=1) c = Math.min(c, n===0 ? 25 : 45);
  return {valor: Math.max(0, Math.min(100, Math.round(c))), notas};
}

function recomendar(r, comps){
  const coste   = r.precio_rebaja * (1 - r.margen);   // sintético: ver aviso en la tarjeta
  const actual  = r.precio_rebaja;
  const conf    = confianza(r, comps);
  let objetivo  = OBJ_POR_ABCD(r) + AJ_STOCK(r);
  if(r.outlet) objetivo += P.aj_outlet;
  const vieja = r.ano_temporada && r.ano_temporada !== 9998 && r.ano_temporada < ANO_VIGENTE;
  if(vieja) objetivo += P.aj_temporada_vieja;

  // El tramo lo fija el PRECIO DE VENTA ACTUAL, no el PVP: la política se
  // aplica sobre lo que el cliente paga hoy. Consecuencia asumida: un producto
  // puede cambiar de tramo —y por tanto de reglas— al entrar en rebaja.
  const tramo = tramoDe(r.precio_rebaja);
  const mgPct = P.mg_pct[tramo] / 100;
  const mgEur = P.mg_eur[tramo];
  const cMax  = P.c_max[tramo]  / 100;

  const ref = referenciaDe(comps);
  let bruto;
  if(ref){
    bruto = ref * objetivo/100;
  } else {
    // Sin mercado no hay posición objetivo que perseguir: el ancla es el precio
    // actual y solo se mueve por señales internas.
    //
    // Y esas señales SOLO pueden bajar el precio. Subirlo sin una sola
    // referencia de mercado sería adivinar: "tengo poco stock" justifica no
    // regalar margen, no cobrar más. Sin el tope, el +4 pp de "stock muy bajo"
    // —el nivel de 1.027 de 1.483 modelos— habría recomendado subir el precio
    // de ~900 productos sin ninguna evidencia detrás.
    const ajuste = AJ_STOCK(r) + (r.outlet?P.aj_outlet:0) + (vieja?P.aj_temporada_vieja:0);
    bruto = actual * (1 + Math.min(0, ajuste)/100);
  }

  /* ── Intervalo admisible ──────────────────────────────────────────────
     Antes esto era un recorte secuencial: tope PVP, luego tope outlet, luego
     suelo de margen, uno detrás de otro. Con un único suelo global casi siempre
     converge; con DOS suelos y un techo de alineamiento, un recorte puede
     volver a violar el anterior. Así que el suelo y el techo se calculan una
     sola vez y el precio se mete dentro, en vez de empujarlo a trompicones. */
  const sueloPct = coste / (1 - Math.min(0.95, mgPct));   // margen sobre ingreso
  const sueloEur = coste + mgEur;                         // margen absoluto
  const L = Math.max(sueloPct, sueloEur);                 // los dos, el más exigente

  /* Dos clases de techo, y la diferencia importa cuando el suelo los supera.

     El DURO no se rompe nunca: ni se vende por encima del PVP, ni se sube el
     precio de un producto en liquidación —subir un outlet para cumplir un
     suelo de margen contradice el motivo por el que ese producto está en
     outlet—. El de ALINEAMIENTO sí lo rompe el margen: es la decisión de
     política que gobierna esta matriz.

     Mezclarlos en un solo mínimo costó 93 outlets con subida de precio. */
  const techoDuro = Math.min(r.precio, r.outlet ? actual : Infinity);
  const techoAlin = ref ? ref * cMax : Infinity;
  const U = Math.min(techoDuro, techoAlin);

  const paso   = Math.max(0.01, P.redondeo || 1);
  const arriba = v => Math.ceil (v/paso - 1e-9) * paso;
  const abajo  = v => Math.floor(v/paso + 1e-9) * paso;

  let precio_rec, veredicto, barrera = null;

  if(L > U + 1e-9){
    /* El suelo de margen exige más de lo que el techo permite cobrar. No es un
       caso raro: pasa en 495 modelos. La política elegida es que MANDA EL
       MARGEN sobre el alineamiento, y la fila lo dice en vez de devolver un
       precio que incumple una de las dos reglas en silencio. */
    barrera = "margen";
    if(L <= techoDuro + 1e-9){
      precio_rec = arriba(L);
      veredicto  = "no_alineable";          // rompemos C a propósito, con aviso
    } else {
      // Ni rompiendo C se llega al suelo: el techo duro lo impide. Aquí no hay
      // precio que cumpla, y decirlo es más útil que inventar uno.
      precio_rec = abajo(techoDuro);
      veredicto  = (r.outlet && actual < r.precio - 1e-9
                    && Math.abs(techoDuro - actual) < 1e-9)
                 ? "outlet_bajo_suelo" : "fuera_de_tarifa";
    }
  } else {
    const p = Math.min(Math.max(bruto, L), U);
    if      (p <= L + 1e-9)                              barrera = "margen";
    else if (ref && Math.abs(p - ref*cMax)   < 1e-9)     barrera = "C";
    else if (Math.abs(p - r.precio)          < 1e-9)     barrera = "PVP";
    else if (r.outlet && Math.abs(p - actual) < 1e-9)    barrera = "outlet";

    precio_rec = Math.round(p/paso) * paso;
    // Redondear no puede saltarse una barrera, en ninguna de las dos direcciones.
    if(precio_rec < L - 1e-9) precio_rec = arriba(L);
    if(precio_rec > U + 1e-9) precio_rec = abajo(U);
    // Un intervalo más estrecho que el escalón puede no contener ningún múltiplo.
    // Misma regla que arriba: manda el margen, pero nunca sobre el techo duro.
    if(precio_rec < L - 1e-9){
      barrera = "margen";
      if(arriba(L) <= techoDuro + 1e-9){ precio_rec = arriba(L); veredicto = "no_alineable"; }
      else { precio_rec = abajo(techoDuro); veredicto = "fuera_de_tarifa"; }
    }
    veredicto = veredicto || (ref ? "ok" : "sin_mercado");
  }
  precio_rec = Math.round(precio_rec*100)/100;

  /* Cuando una barrera manda, el precio sale del COSTE, no del mercado. La
     confianza mide calidad del dato de mercado, así que anunciar un 81 % sobre
     un número que el mercado no ha tocado sería prestarle a esa conclusión una
     credibilidad que no ha ganado. */
  let valor = conf.valor, notas = conf.notas;
  if(veredicto === "no_alineable" || veredicto === "fuera_de_tarifa"
     || veredicto === "outlet_bajo_suelo"){
    valor = Math.min(valor, 50);
    notas = [t("c.porCoste"), ...notas];
  }

  const margen_rec = precio_rec>0 ? (precio_rec - coste)/precio_rec*100 : 0;
  return {
    modelo:r.modelo, precio_rec, actual, ref, objetivo,
    tramo, suelo:L, techo:U, veredicto,
    delta_eur: Math.round((precio_rec-actual)*100)/100,
    delta_pct: actual>0 ? (precio_rec-actual)/actual*100 : 0,
    posicion_rec: ref ? precio_rec/ref*100 : null,
    margen_rec, barrera,
    inviable: veredicto === "fuera_de_tarifa" || veredicto === "outlet_bajo_suelo",
    confianza: valor, notas,
    n_comp: comps.length,
  };
}

/* Recomendaciones para la vista actual. Agrupa comparativa_publica por modelo
   una sola vez: render() se llama en cada pulsación de tecla. */
function recomendaciones(modelos){
  const porModelo = new Map();
  for(const c of COMP){
    if(!porModelo.has(c.modelo)) porModelo.set(c.modelo, []);
    porModelo.get(c.modelo).push(c);
  }
  return modelos.map(r => recomendar(r, porModelo.get(r.modelo) || []));
}

/* ── svg helpers ──────────────────────────────────────────────────────── */
const SVGNS="http://www.w3.org/2000/svg";
const el=(n,a={})=>{const e=document.createElementNS(SVGNS,n);
  for(const k in a) e.setAttribute(k,a[k]); return e;};
// Square data-ends: the Forum Sport system is square everywhere, which
// overrides the usual 4px rounded data-end.
function hbarPath(x0,y,w,h,r=0){
  r=Math.min(r,Math.max(0,w),h/2); const x1=x0+w;
  if(w<=r) return `M${x0},${y}H${x1}V${y+h}H${x0}Z`;
  return `M${x0},${y}H${x1-r}Q${x1},${y} ${x1},${y+r}V${y+h-r}Q${x1},${y+h} ${x1-r},${y+h}H${x0}Z`;
}
function vbarPath(x,yTop,w,h,r=0){
  r=Math.min(r,w/2,Math.max(0,h)); const yB=yTop+h;
  if(h<=r) return `M${x},${yTop}H${x+w}V${yB}H${x}Z`;
  return `M${x},${yB}V${yTop+r}Q${x},${yTop} ${x+r},${yTop}H${x+w-r}Q${x+w},${yTop} ${x+w},${yTop+r}V${yB}Z`;
}
/* Axis maxima land on clean numbers AND hug the data: derive the step from
   ~5 intervals, then take only as many steps as the data needs. */
function niceScale(maxVal, target=5){
  if(!(maxVal>0)) return {max:1, ticks:[0,1]};
  const raw=maxVal/target, p=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/p;
  const step=(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;
  const count=Math.max(1,Math.ceil(maxVal/step - 1e-9));
  return {max:step*count, ticks:Array.from({length:count+1},(_,i)=>step*i)};
}

/* Ticks over an arbitrary interval, for a metric that does not start at zero.
   niceScale() is hard-wired to a zero baseline, which is right for counts and
   wrong here: POSICIONAMIENTO ONLINE % lives around 100, so a 0-based axis
   would squeeze the whole signal into a few pixels of wiggle. */
function niceBand(min, max, target=5){
  if(!(max>min)){ min=min-1; max=max+1; }
  const raw=(max-min)/target, p=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/p;
  const step=(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step;
  const ticks=[]; for(let v=lo; v<=hi+1e-9; v+=step) ticks.push(Math.round(v*1e6)/1e6);
  return {min:lo, max:hi, ticks};
}

/* Time series, one series. The x axis is a real time scale (date → position),
   not an index scale: gaps where we did not crawl stay visible as gaps, and a
   coarser grain can be mixed in later without rewriting this. */
function line(points,{fmt=v=>nf1.format(v)+" %", baseline=null, unit=""}={}){
  const W=640,H=272, PADL=48,PADR=14,PADT=16,PADB=38;
  const pw=W-PADL-PADR, ph=H-PADT-PADB;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img"});
  const vals=points.filter(d=>d.v!=null).map(d=>d.v);
  if(!vals.length) return svg;

  // Honour the client's 95–115 % frame as a floor, not a clamp: an outlier day
  // must not render off-canvas.
  const lo=Math.min(95,...vals), hi=Math.max(115,...vals);
  const sc=niceBand(lo,hi);
  const t0=points[0].t, t1=points[points.length-1].t, span=Math.max(1,t1-t0);
  const X=t=>PADL+(points.length===1?pw/2:pw*(t-t0)/span);
  const Y=v=>PADT+ph-ph*(v-sc.min)/(sc.max-sc.min);

  sc.ticks.forEach((tv,i)=>{
    const y=Y(tv);
    svg.append(el("line",{x1:PADL,x2:W-PADR,y1:y,y2:y,class:i?"gridline":"gridline"}));
    const t=el("text",{x:PADL-8,y:y+4,class:"tick","text-anchor":"end"});
    t.textContent=fmt(tv); svg.append(t);
  });

  // Parity. This is the semantic zero of the metric: above it we are dearer.
  if(baseline!=null && baseline>=sc.min && baseline<=sc.max){
    svg.append(el("line",{x1:PADL,x2:W-PADR,y1:Y(baseline),y2:Y(baseline),class:"parity"}));
    const pl=el("text",{x:W-PADR,y:Y(baseline)-6,class:"tick","text-anchor":"end"});
    pl.textContent=t("g.paridad"); pl.setAttribute("fill","var(--muted)"); svg.append(pl);
  }

  // Date labels: first, last and a few evenly spaced between.
  const want=Math.min(points.length,6);
  const cand = points.length<=1 ? [0]
    : Array.from({length:want},(_,i)=>{
        const t=t0+span*i/(want-1);
        return points.reduce((bi,p,j)=>Math.abs(p.t-t)<Math.abs(points[bi].t-t)?j:bi,0);
      });
  let lastX=-1e9;
  [...new Set(cand)].sort((a,b)=>a-b).forEach(i=>{
    const x=X(points[i].t);
    if(x-lastX < 58) return;            // would collide with the previous label
    lastX=x;
    const anchor = x > W-PADR-26 ? "end" : x < PADL+26 ? "start" : "middle";
    const t=el("text",{x,y:PADT+ph+18,class:"tick","text-anchor":anchor});
    t.textContent=points[i].k; svg.append(t);
  });

  // The line, broken wherever a day has no value rather than bridged across it.
  let d="", open=false;
  for(const pt of points){
    if(pt.v==null || pt.flojo){ open=false; continue; }
    d += (open?"L":"M")+X(pt.t)+","+Y(pt.v); open=true;
  }
  svg.append(el("path",{d,fill:"none",stroke:"var(--s1)","stroke-width":2,
                        "stroke-linejoin":"round","stroke-linecap":"round",class:"mark"}));

  // A two-point "trend line" is a lie about trend; while the series is short,
  // show the observations as points instead of implying a slope between them.
  const sparse=vals.filter((_,i)=>true).length<=14;
  for(const pt of points){
    if(pt.v==null) continue;
    if(pt.flojo)
      // Hollow: an observation we have, on a basket too small to trust.
      svg.append(el("circle",{cx:X(pt.t),cy:Y(pt.v),r:4,fill:"var(--surface)",
                              stroke:"var(--muted)","stroke-width":2}));
    else if(sparse)
      svg.append(el("circle",{cx:X(pt.t),cy:Y(pt.v),r:4.5,fill:"var(--s1)",
                              stroke:"var(--surface)","stroke-width":2}));
  }

  // Selective direct labels — never a number on every point.
  const real=points.filter(p=>p.v!=null);
  const solid=real.filter(p=>!p.flojo);
  const base=solid.length?solid:real;
  const mx=base.reduce((a,b)=>b.v>a.v?b:a), mn=base.reduce((a,b)=>b.v<a.v?b:a);
  const marked=new Set([base[0],base[base.length-1],mx,mn]);
  for(const pt of marked){
    // Anchor away from the edges: a centred label on the last point overflows
    // the viewBox and gets clipped.
    const x=X(pt.t);
    const anchor = x > W-PADR-44 ? "end" : x < PADL+44 ? "start" : "middle";
    const t=el("text",{x,y:Y(pt.v)-11,class:"val","text-anchor":anchor});
    t.textContent=fmt(pt.v); svg.append(t);
  }

  // One crosshair over the whole plot, not one hit target per point: at 300
  // points that would be 300 focusable elements.
  const hair=el("line",{x1:0,x2:0,y1:PADT,y2:PADT+ph,class:"hair"});
  hair.style.opacity="0"; svg.append(hair);
  const dot=el("circle",{r:5,fill:"var(--s1)",stroke:"var(--surface)","stroke-width":2});
  dot.style.opacity="0"; svg.append(dot);
  const over=el("rect",{x:PADL,y:PADT,width:pw,height:ph,class:"hit",tabindex:"0",
    role:"img","aria-label":t("ts.aria",{n:points.length, p:base[0].k, pv:fmt(base[0].v),
      u:base[base.length-1].k, uv:fmt(base[base.length-1].v), min:fmt(mn.v), max:fmt(mx.v)})});
  let cur=real.length-1;
  const paint=(e)=>{
    if(e){ const b=over.getBoundingClientRect();
      const frac=(e.clientX-b.left)/Math.max(1,b.width);
      const t=t0+frac*span;
      cur=real.reduce((bi,p,i)=>Math.abs(p.t-t)<Math.abs(real[bi].t-t)?i:bi,0); }
    const pt=real[cur];
    hair.setAttribute("x1",X(pt.t)); hair.setAttribute("x2",X(pt.t));
    hair.style.opacity="1";
    dot.setAttribute("cx",X(pt.t)); dot.setAttribute("cy",Y(pt.v)); dot.style.opacity="1";
    // Labels come from the database, so they are written as text, never as HTML.
    tip.textContent="";
    const b=document.createElement("b"); b.textContent=pt.k; tip.append(b);
    const add=(k,v)=>{ tip.append(document.createElement("br"));
      const sp=document.createElement("span"); sp.className="t-k"; sp.textContent=k+": ";
      tip.append(sp, document.createTextNode(v)); };
    add(t("ts.tipPos"), fmt(pt.v));
    if(pt.mediana!=null) add(t("ts.tipMed"), fmt(pt.mediana));
    if(pt.n!=null)       add(t("ts.tipMod"), nf.format(pt.n)+(pt.flojo?t("ts.cobBaja"):""));
    if(pt.comps!=null)   add(t("ts.tipComp"), nf.format(pt.comps));
    tip.classList.add("on");
    const r=tip.getBoundingClientRect(), bb=over.getBoundingClientRect();
    const cx=(e?e.clientX:bb.left+bb.width*(pt.t-t0)/span);
    tip.style.left=Math.min(Math.max(8,cx+14), innerWidth-r.width-8)+"px";
    tip.style.top =Math.max(8,(e?e.clientY:bb.top)-r.height-12)+"px";
  };
  const hide=()=>{ tip.classList.remove("on"); hair.style.opacity="0"; dot.style.opacity="0"; };
  over.addEventListener("mousemove",paint);
  over.addEventListener("mouseleave",hide);
  over.addEventListener("focus",()=>paint(null));
  over.addEventListener("blur",hide);
  over.addEventListener("keydown",ev=>{
    if(ev.key!=="ArrowLeft"&&ev.key!=="ArrowRight") return;
    ev.preventDefault();
    cur=Math.max(0,Math.min(real.length-1,cur+(ev.key==="ArrowRight"?1:-1)));
    paint(null);
  });
  svg.append(over);
  return svg;
}

/* Horizontal bar chart. One series → one colour, no legend box (the title names it). */
function hbar(items,{fill="var(--s1)", fmt=v=>nf.format(v), unit=t("g.modelos"), colorOf=null}={}){
  const BAR=Math.min(24,Math.max(12,Math.round(210/items.length)));
  const GAP=Math.max(8,Math.round(BAR*.55)), LAB=132, PADR=64, W=640;
  const H=items.length*(BAR+GAP)+16;
  const sc=niceScale(Math.max(...items.map(d=>d.v),0)), max=sc.max, sw=W-LAB-PADR;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img"});
  sc.ticks.forEach((tv,i)=>{ const x=LAB+sw*tv/max;
    svg.append(el("line",{x1:x,x2:x,y1:0,y2:H-16,class:i?"gridline":"axis"}));
    const t=el("text",{x,y:H-3,class:"tick","text-anchor":"middle"}); t.textContent=fmt(tv); svg.append(t);
  });
  items.forEach((d,i)=>{
    const y=i*(BAR+GAP)+2, w=Math.max(0,sw*d.v/max);
    const g=el("g",{class:"row"});
    const lb=el("text",{x:LAB-10,y:y+BAR/2+4,class:"cat","text-anchor":"end"});
    lb.textContent=d.k.length>19?d.k.slice(0,18)+"…":d.k; g.append(lb);
    g.append(el("path",{d:hbarPath(LAB,y,w,BAR),fill:colorOf?colorOf(d,i):fill,class:"mark"}));
    const vt=el("text",{x:LAB+w+9,y:y+BAR/2+4,class:"val"}); vt.textContent=fmt(d.v); g.append(vt);
    const hit=el("rect",{x:0,y:y-GAP/2,width:W,height:BAR+GAP,class:"hit",tabindex:"0",
