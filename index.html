      role:"img","aria-label":`${d.k}: ${fmt(d.v)} ${unit}`});
    bindTip(hit,`<b>${d.k}</b><br><span class="t-k">${unit}:</span> ${fmt(d.v)}${d.note?`<br>${d.note}`:""}`);
    g.append(hit); svg.append(g);
  });
  return svg;
}

/* Column chart. */
function columns(items,{fill="var(--s1)", fmt=v=>nf.format(v), unit=t("g.modelos"), colorOf=null, rotate=false}={}){
  const W=640,H=rotate?250:224, PADB=rotate?52:32, PADT=18, PADL=44, PADR=8;
  const pw=W-PADL-PADR, ph=H-PADB-PADT;
  const band=pw/items.length, BAR=Math.min(24,Math.max(6,band-Math.max(2,band*.28)));
  const sc=niceScale(Math.max(...items.map(d=>d.v),0)), max=sc.max;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img"});
  sc.ticks.forEach((tv,i)=>{ const y=PADT+ph-ph*tv/max;
    svg.append(el("line",{x1:PADL,x2:W-PADR,y1:y,y2:y,class:i?"gridline":"axis"}));
    const t=el("text",{x:PADL-8,y:y+4,class:"tick","text-anchor":"end"}); t.textContent=fmt(tv); svg.append(t);
  });
  items.forEach((d,i)=>{
    const x=PADL+band*i+(band-BAR)/2, h=Math.max(0,ph*d.v/max), y=PADT+ph-h;
    const g=el("g",{class:"row"});
    g.append(el("path",{d:vbarPath(x,y,BAR,h),fill:colorOf?colorOf(d,i):fill,class:"mark"}));
    const lx=PADL+band*i+band/2;
    const lb=el("text",{x:lx,y:PADT+ph+16,class:"tick","text-anchor":rotate?"end":"middle"});
    lb.textContent=d.k;
    if(rotate) lb.setAttribute("transform",`rotate(-42 ${lx} ${PADT+ph+16})`);
    g.append(lb);
    const hit=el("rect",{x:PADL+band*i,y:PADT,width:band,height:ph,class:"hit",tabindex:"0",
      role:"img","aria-label":`${d.k}: ${fmt(d.v)} ${unit}`});
    bindTip(hit,`<b>${d.k}</b><br><span class="t-k">${unit}:</span> ${fmt(d.v)}${d.note?`<br>${d.note}`:""}`);
    g.append(hit); svg.append(g);
  });
  return svg;
}

/* Part-to-whole: a single stacked bar, 2px surface gap between segments. */
function stacked(items,{fmt=v=>nf.format(v)}={}){
  const W=640,H=46,BAR=30,GAP=2, total=items.reduce((s,d)=>s+d.v,0)||1;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img"});
  let x=0;
  items.forEach(d=>{
    const w=Math.max(0,(W-GAP*(items.length-1))*d.v/total);
    const g=el("g",{class:"row"});
    g.append(el("rect",{x,y:6,width:w,height:BAR,rx:4,fill:d.c,class:"mark"}));
    if(w>92){
      const t=el("text",{x:x+10,y:6+BAR/2+4,class:"val "+(d.ink||"on-dark")});
      t.textContent=`${fmt(d.v)} · ${nf1.format(d.v/total*100)} %`; g.append(t);
    }
    const hit=el("rect",{x,y:0,width:w,height:BAR+12,class:"hit",tabindex:"0",
      role:"img","aria-label":`${d.k}: ${fmt(d.v)}`});
    bindTip(hit,`<b>${d.k}</b><br><span class="t-k">${t("g.modelos")}:</span> ${fmt(d.v)} (${nf1.format(d.v/total*100)} %)`);
    g.append(hit); svg.append(g); x+=w+GAP;
  });
  return svg;
}

/* ── multi-select dropdown ────────────────────────────────────────────── */
/* A native <select multiple> is unusable on touch and gives no counts, so this
   is a button + checkbox popover. One open at a time; Escape and outside-click
   close it. */
let openPop = null;
document.addEventListener("click", e => {
  if(openPop && !openPop.root.contains(e.target)) close_();
});
document.addEventListener("keydown", e => { if(e.key === "Escape") close_(); });
function close_(){
  if(!openPop) return;
  openPop.pop.hidden = true;
  openPop.btn.setAttribute("aria-expanded", "false");
  openPop = null;
}

/* Search box with autocomplete over product names.
   The text itself filters live; the dropdown is a shortcut to an exact name. */
function searchBox(rows, onChange){
  const root = document.createElement("div"); root.className = "search";
  root.innerHTML = `<span class="ico">⌕</span>
    <input class="search-in" type="search" placeholder="${t("f.buscar")}"
           autocomplete="off" role="combobox" aria-expanded="false"
           aria-autocomplete="list" aria-label="${t("f.buscarAria")}">
    <button class="clr" type="button" aria-label="${t("f.limpiarAria")}" hidden>×</button>
    <div class="ac" role="listbox" hidden></div>`;
  const input = root.querySelector("input");
  const ac    = root.querySelector(".ac");
  const clr   = root.querySelector(".clr");
  input.value = F.q;
  clr.hidden  = !F.q;
  let cursor = -1, items = [];

  // One entry per distinct product name, with its brand and how many models
  // share it — a name like GALAXY 7 covers several colourways.
  const index = [...rows.reduce((m, r) => {
    const k = r.nombre_modelo + "|" + r.marca;
    m.set(k, m.get(k) ? {...m.get(k), n: m.get(k).n + 1}
                      : {name: r.nombre_modelo, marca: r.marca, n: 1});
    return m;
  }, new Map()).values()];

  const hide = () => { ac.hidden = true; input.setAttribute("aria-expanded","false"); cursor = -1; };

  const mark = (text, q) => {
    const i = norm(text).indexOf(q);
    if (i < 0) return text;
    return text.slice(0,i) + "<mark>" + text.slice(i, i+q.length) + "</mark>" + text.slice(i+q.length);
  };

  const paint = () => {
    const q = norm(input.value);
    if (q.length < 2) return hide();
    // Names that start with the query rank above names that merely contain it.
    items = index.filter(e => norm(e.name).includes(q) || norm(e.marca).includes(q))
      .sort((a,b) => (norm(b.name).startsWith(q) - norm(a.name).startsWith(q))
                  || a.name.localeCompare(b.name,LANG))
      .slice(0, 8);
    ac.innerHTML = items.length
      ? items.map((e,i) => `<div class="ac-opt" role="option" data-i="${i}"
           aria-selected="${i===cursor}"><span>${mark(e.name,q)}</span>
           <span class="br">${e.marca}</span>
           <span class="cnt">${e.n}</span></div>`).join("")
      : `<div class="ac-none">${t("f.sinCoincidencia",{q:input.value})}</div>`;
    ac.hidden = false; input.setAttribute("aria-expanded","true");
    ac.querySelectorAll(".ac-opt").forEach(el =>
      el.onmousedown = ev => { ev.preventDefault(); choose(items[+el.dataset.i]); });
  };

  const choose = e => { if(!e) return; F.q = e.name; hide(); onChange(); };

  input.oninput = () => {
    F.q = input.value; clr.hidden = !F.q;
    cursor = -1; onChange();   // rebuilds the row; the new input repaints on focus

  };
  input.onfocus = () => paint();
  input.onblur  = () => setTimeout(hide, 120);
  input.onkeydown = ev => {
    if (ac.hidden || !items.length) { if (ev.key === "Escape") { F.q=""; input.value=""; onChange(); } return; }
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault();
      cursor = (cursor + (ev.key === "ArrowDown" ? 1 : items.length - 1)) % items.length;
      ac.querySelectorAll(".ac-opt").forEach((el,i) => el.setAttribute("aria-selected", String(i===cursor)));
      ac.querySelector('[aria-selected="true"]')?.scrollIntoView({block:"nearest"});
    } else if (ev.key === "Enter") { ev.preventDefault(); choose(items[cursor >= 0 ? cursor : 0]); }
    else if (ev.key === "Escape") { hide(); }
  };
  clr.onclick = () => { F.q = ""; input.value = ""; clr.hidden = true; hide(); onChange(); };
  return {root, input, paint};
}

function multiSelect({label, options, selected, onChange}){
  const root = document.createElement("div"); root.className = "ms";
  const btn = document.createElement("button");
  btn.type = "button"; btn.className = "ms-btn";
  btn.setAttribute("aria-haspopup", "true"); btn.setAttribute("aria-expanded", "false");
  const pop = document.createElement("div"); pop.className = "ms-pop"; pop.hidden = true;

  const paint = () => {
    const n = selected.size;
    btn.innerHTML = `<span>${label}</span>`
      + (n ? `<span class="n">${n}</span>` : "")
      + `<span class="caret">▾</span>`;
  };
  paint();

  const head = document.createElement("div"); head.className = "ms-head";
  head.innerHTML = `<button type="button" data-all>${t("f.todos")}</button>
                    <button type="button" data-none>${t("f.ninguno")}</button>`;
  pop.append(head);
  head.querySelector("[data-all]").onclick = () => {
    options.forEach(o => selected.add(o.value));
    pop.querySelectorAll("input").forEach(i => i.checked = true); paint(); onChange();
  };
  head.querySelector("[data-none]").onclick = () => {
    selected.clear();
    pop.querySelectorAll("input").forEach(i => i.checked = false); paint(); onChange();
  };

  for(const o of options){
    const row = document.createElement("label"); row.className = "ms-opt";
    row.innerHTML = `<input type="checkbox"${selected.has(o.value) ? " checked" : ""}>
      <span>${o.label}</span>${o.count != null ? `<span class="cnt">${nf.format(o.count)}</span>` : ""}`;
    row.querySelector("input").onchange = e => {
      e.target.checked ? selected.add(o.value) : selected.delete(o.value);
      paint(); onChange();
    };
    pop.append(row);
  }

  btn.onclick = e => {
    e.stopPropagation();
    const wasOpen = openPop && openPop.pop === pop;
    close_();
    if(!wasOpen){
      pop.hidden = false; btn.setAttribute("aria-expanded", "true");
      openPop = {root, btn, pop};
    }
  };
  root.append(btn, pop);
  return root;
}

/* ── aggregation ──────────────────────────────────────────────────────── */
const by=(rows,key)=>{const m=new Map();
  for(const r of rows){const k=key(r); m.set(k,(m.get(k)||0)+1);} return m;};
const avg=(rows,f)=>rows.length?rows.reduce((s,r)=>s+f(r),0)/rows.length:0;

const BANDS=[[0,60,"< 60"],[60,80,"60–79"],[80,100,"80–99"],[100,120,"100–119"],
  [120,140,"120–139"],[140,160,"140–159"],[160,180,"160–179"],[180,200,"180–199"],
  [200,1e9,"200 +"]];
const ORD_MARGEN=["muy bajo","bajo","medio","alto"];
const ORD_STOCK =["muy bajo","bajo","medio","alto","muy alto"];
const RAMP4=["var(--o1)","var(--o2)","var(--o4)","var(--o5)"];
const RAMP5=["var(--o1)","var(--o2)","var(--o3)","var(--o4)","var(--o5)"];

/* ── ordenación por columna ────────────────────────────────────────────
   Se ordena por el valor, no por lo que se ve. «1.234,50 €» y «hace 3 días»
   no se ordenan alfabéticamente, y en inglés el mismo número se escribe
   «1,234.50»: ordenar el texto daría un orden distinto en cada idioma. Por
   eso cada celda formateada lleva data-sort con su valor crudo.

   onSort existe para las tablas que no tienen todas sus filas en el DOM: la
   del catálogo está paginada, así que reordenar los <tr> visibles ordenaría
   una página en lugar de la tabla. */
/* render() vacía #app y reconstruye cada tabla, así que la ordenación que el
   usuario acababa de elegir se perdía en cuanto tocaba un filtro: ordenas por
   confianza, marcas «solo en rebaja», y vuelves al orden de fábrica sin que
   nada lo anuncie. El estado vive fuera del DOM, indexado por el nombre de la
   tabla, y se restituye al reconstruirla. */
const ORDEN = new Map();          // clave de tabla -> {col, dir}

function ordenable(tabla, {onSort=null, inicial=null, clave=null}={}){
  const ths = [...tabla.tHead.rows[0].cells];
  const guardado = clave ? ORDEN.get(clave) : null;
  const arranque = guardado || inicial;
  let col = arranque ? arranque.col : -1;
  let dir = arranque ? arranque.dir : -1;

  const valor = (tr,i) => {
    const td = tr.cells[i];
    if(!td) return "";
    return td.dataset.sort !== undefined ? td.dataset.sort : td.textContent.trim();
  };
  const aplicar = () => {
    ths.forEach((th,i)=>th.setAttribute("aria-sort",
      i!==col ? "none" : dir>0 ? "ascending" : "descending"));
    if(clave && col >= 0) ORDEN.set(clave, {col, dir});
    if(onSort){ onSort(col, dir); return; }
    const tb = tabla.tBodies[0], filas = [...tb.rows];
    const crudos = filas.map(tr=>valor(tr,col));
    const numerica = crudos.every(v => v==="" || v==="—" || !isNaN(parseFloat(v)));
    const vacio = v => v==="" || v==="—";
    filas.sort((a,b)=>{
      const x=valor(a,col), y=valor(b,col);
      // Un hueco no es un cero: siempre al final, se ordene como se ordene.
      if(vacio(x)||vacio(y)) return vacio(x)&&vacio(y) ? 0 : vacio(x) ? 1 : -1;
      return numerica ? dir*(parseFloat(x)-parseFloat(y))
                      : dir*String(x).localeCompare(String(y), LANG, {numeric:true});
    });
    for(const tr of filas) tb.append(tr);
  };
  ths.forEach((th,i)=>{
    th.classList.add("sortable");
    th.tabIndex = 0;
    th.setAttribute("aria-sort","none");
    // Primer clic: texto ascendente, número descendente. Lo que se busca en
    // una columna de cifras es casi siempre la más grande.
    const ir = () => { dir = (col===i) ? -dir : (i===0 ? 1 : -1); col = i; aplicar(); };
    th.onclick = ir;
    th.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); ir(); } };
  });
  if(arranque) aplicar();
  return aplicar;
}

/* ── paginador ─────────────────────────────────────────────────────────
   Uno solo para toda la página. Había tres respuestas distintas a «demasiadas
   filas» conviviendo —cortar a 40, paginar, y renderizar las 1.058—, lo que
   obliga al lector a averiguar en qué tabla está antes de saber si lo que ve
   es todo. La de 1.058 además medía 53.554px y enterraba cinco tarjetas a
   59.000px de altura, donde nadie iba a encontrarlas.

   `total` es una función, no un número: la tabla que lo usa se reordena y se
   refiltra debajo, y un total congelado deja el paginador mintiendo. */
let pagerSeq = 0;
function crearPager({total, por=25, opciones=[12,25,50,100], rango=null, tabla=null, onDraw}){
  const id = "per-" + (++pagerSeq);     // ids únicos: hay más de un paginador
  let per = por, page = 0;
  const paginas = () => Math.max(1, Math.ceil(total() / per));

  const nodo = document.createElement("div"); nodo.className = "pager";
  nodo.innerHTML = `
    <button class="pg" data-go="first" type="button" aria-label="${t("pg.primera")}">«</button>
    <button class="pg" data-go="prev"  type="button" aria-label="${t("pg.anterior")}">‹</button>
    <span class="of" aria-hidden="true"></span>
    <button class="pg" data-go="next"  type="button" aria-label="${t("pg.siguiente")}">›</button>
    <button class="pg" data-go="last"  type="button" aria-label="${t("pg.ultima")}">»</button>
    <span class="range grow" role="status" aria-live="polite"></span>
    <label class="range" for="${id}">${t("pg.porPagina")}</label>
    <select id="${id}" aria-label="${t("pg.filasAria")}">
      ${opciones.map(o=>`<option value="${o}"${o===por?" selected":""}>${o}</option>`).join("")}
    </select>`;
  const of = nodo.querySelector(".of"), rng = nodo.querySelector(".range");
  const btn = k => nodo.querySelector(`[data-go="${k}"]`);

  function draw(){
    page = Math.min(page, paginas()-1);
    const inicio = page*per;
    const vistos = onDraw(inicio, per);
    const n = total();
    of.textContent = `${page+1} / ${nf.format(paginas())}`;
    rng.textContent = n
      ? (rango||t)("pg.rango",{a:nf.format(inicio+1), b:nf.format(inicio+vistos), t:nf.format(n)})
      : t("pg.sinRes");
    btn("first").disabled = btn("prev").disabled = page === 0;
    btn("last").disabled  = btn("next").disabled = page >= paginas()-1;
  }
  const go = k => {
    const ultima = paginas()-1;
    page = k==="first" ? 0 : k==="prev" ? Math.max(0,page-1)
         : k==="next"  ? Math.min(ultima,page+1) : ultima;
    draw();
    // Mantener la cabecera a la vista al paginar desde el final de la lista.
    if(tabla) tabla.scrollIntoView({block:"nearest", behavior:"smooth"});
  };
  nodo.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  nodo.querySelector("#"+CSS.escape(id)).onchange = e => {
    const primera = page*per;          // dejar al lector donde estaba, aproximadamente
    per = Number(e.target.value); page = Math.floor(primera/per); draw();
  };
  return {nodo, draw, primeraPagina(){ page = 0; }};
}

/* Una celda es el texto a mostrar, o [texto, valor por el que ordenar]. */
function tableFor(cols,rows){
  const celda = c => Array.isArray(c)
    ? `<td data-sort="${String(c[1]).replace(/"/g,"&quot;")}">${c[0]}</td>`
    : `<td>${c}</td>`;
  const tb=document.createElement("table"); tb.className="t-simple";
  tb.innerHTML=`<thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead>`
    +`<tbody>${rows.map(r=>`<tr>${r.map(celda).join("")}</tr>`).join("")}</tbody>`;
  // La clave no puede ser el texto de las cabeceras: cambia al cambiar de
  // idioma y el orden elegido se perdería al pulsar EN.
  ordenable(tb, {clave: "simple:"+cols.length+":"+(rows[0]||[]).length});
  const w=document.createElement("div"); w.className="t-wrap"; w.append(tb); return w;
}
function card(title,sub,node,tbl,wide=false){
  const c=document.createElement("section");
  c.className="card"+(wide?" wide":"");
  c.innerHTML=`<h2>${title}</h2><p class="sub">${sub}</p>`;
  if(node) c.append(node);
  if(tbl){ const d=document.createElement("details");
    d.innerHTML=`<summary>${t("g.tabla")}</summary>`; d.append(tbl); c.append(d); }
  return c;
}

/* La altura de la barra de filtros se medía una sola vez por render(), así que
   abrir «Más filtros» la hacía crecer sin que nadie volviera a mirar: la
   cabecera pegajosa de las tablas quedaba tapada 42px en escritorio y 158px en
   un móvil de 360. Se vuelve a medir al plegar/desplegar y al cambiar de ancho.

   Fuera de render() a propósito: render() corre en cada pulsación de tecla, y
   suscribirse a resize ahí dentro acumularía un oyente por tecla. */
const medirBarra = () => {
  const f = document.querySelector(".filters");
  if(!f) return;
  const h = f.getBoundingClientRect().height;
  if(h) document.documentElement.style.setProperty("--filters-h", `${Math.round(h)}px`);
};
addEventListener("resize", () => requestAnimationFrame(medirBarra), {passive:true});

/* ── render ───────────────────────────────────────────────────────────── */
function render(){
  const app=document.getElementById("app");
  pintarNav();

  /* El rastreo no mira el catálogo: no lleva barra de filtros, porque filtrar
     por marca no cambia qué competidores hay que rastrear. */
  if(SECCION === "creative"){
    app.innerHTML = "";
    document.documentElement.style.setProperty("--filters-h", "0px");
    seccionCreative(app);
    document.getElementById("state")?.remove();
    return;
  }
  if(SECCION === "scraping"){
    app.innerHTML = "";
    document.documentElement.style.setProperty("--filters-h", "0px");
    seccionScraping(app);
    document.getElementById("state")?.remove();
    return;
  }

  const rows=filtered();
  // Capture focus BEFORE wiping: clearing the DOM fires the outgoing input's
  // blur handler, so any flag it maintains is already stale by the time the new
  // row is built.
  const active = document.activeElement;
  const keepFocus = !!(active && active.classList && active.classList.contains("search-in"));
  const caret = keepFocus ? (active.selectionStart ?? active.value.length) : 0;
  app.innerHTML="";

  /* filters ---------------------------------------------------------- */
  const marcas = [...new Map(ROWS.map(r=>[r.brand_code, r.marca])).entries()]
    .map(([code,name])=>({value:code, label:name,
                          count:ROWS.filter(r=>r.brand_code===code).length}))
    .sort((a,b)=>a.label.localeCompare(b.label,LANG));
  const tipos = [...new Set(ROWS.map(r=>r.tipo_producto))].sort()
    .map(v=>({value:v, label:t("tipo."+v)==="tipo."+v ? v[0].toUpperCase()+v.slice(1) : t("tipo."+v),
              count:ROWS.filter(r=>r.tipo_producto===v).length}));
  const competidores = [...new Set(COMP.map(c=>c.competidor))].sort()
    .map(n=>({value:n, label:n,
              count:new Set(COMP.filter(c=>c.competidor===n).map(c=>c.modelo)).size}));

  const f = document.createElement("div"); f.className="filters";
  const lab = document.createElement("span"); lab.className="f-lab"; lab.textContent=t("f.filtrar");
  f.append(lab);
  const sb = searchBox(ROWS, render);
  f.append(sb.root);
  f.append(multiSelect({label:t("f.marca"), options:marcas,
                        selected:F.marcas, onChange:render}));
  f.append(multiSelect({label:t("f.tipo"), options:tipos,
                        selected:F.tipos, onChange:render}));
  if(competidores.length)
    f.append(multiSelect({label:t("f.competidor"), options:competidores,
                          selected:F.competidores, onChange:render}));

  /* Period presets. Date range first — it is the control a reader reaches for
     before any dimension. It is also the only filter that refetches, because
     every other one is a pure function of data already in the browser. */
  const per=document.createElement("span"); per.className="periodo";
  const pl=document.createElement("span"); pl.className="f-lab"; pl.textContent=t("f.periodo");
  per.append(pl);
  const hoy=new Date();
  const iso=d=>d.toISOString().slice(0,10);
  const presets=[7,30,90,null];
  for(const dd of presets){
    const b=document.createElement("button");
    b.className="chip"; b.type="button";
    b.textContent = dd===null ? t("f.todo") : t("f.dias",{n:dd});
    const desde = dd===null ? null : iso(new Date(hoy.getTime()-dd*86400000));
    b.setAttribute("aria-pressed", String(F.desde===desde));
    b.onclick=async()=>{
      F.desde=desde; F.hasta=null;
      b.disabled=true; app.style.opacity=".55";
      HIST = await loadHistoria(F.desde, F.hasta);
      app.style.opacity=""; render();
    };
    per.append(b);
  }
  f.append(per);

  const btnRebaja=document.createElement("button");
  btnRebaja.className="chip"; btnRebaja.type="button"; btnRebaja.textContent=t("f.rebaja");
  btnRebaja.setAttribute("aria-pressed", String(F.rebaja));
  btnRebaja.onclick=()=>{F.rebaja=!F.rebaja; render();};
  f.append(btnRebaja);

  /* The eight catalogue dimensions. They live behind a disclosure because the
     filter bar is sticky: eleven dropdowns in one row would wrap to three lines
     and park a wall across the top of the page. Collapsed, the summary carries
     the number of active ones so nothing is hidden silently. */
  const dimBox = document.createElement("details"); dimBox.className="dims";
  const activos = DIMS.reduce((n,dm)=>n+(F[dm.k].size?1:0),0);
  if(activos) dimBox.open = true;
  const sum = document.createElement("summary");
  sum.textContent = t("f.mas");
  if(activos){ const b=document.createElement("span"); b.className="n";
               b.textContent=String(activos); sum.append(b); }
  dimBox.append(sum);
  const dimRow = document.createElement("div"); dimRow.className="dim-row";
  for(const dm of DIMS){
    const counts = new Map();
    for(const r of ROWS){ const v=dimVal(r,dm.campo); counts.set(v,(counts.get(v)||0)+1); }
    const options = [...counts.entries()]
      .map(([value,count])=>({value, label:dm.fmt(value), count}))
      .sort(dm.sort || ((a,b)=>a.label.localeCompare(b.label,LANG)));
    dimRow.append(multiSelect({label:dm.label(), options,
                               selected:F[dm.k], onChange:render}));
  }
  dimBox.append(dimRow);

  const btnClear=document.createElement("button");
  btnClear.className="ghost"; btnClear.type="button"; btnClear.textContent=t("f.limpiar");
  btnClear.onclick=()=>{F.q=""; F.marcas.clear(); F.tipos.clear(); F.competidores.clear();
                        F.rebaja=false; DIMS.forEach(dm=>F[dm.k].clear()); render();};
  f.append(btnClear);

  const cnt=document.createElement("span"); cnt.className="f-count";
  cnt.innerHTML=t("f.cuenta",{n:nf.format(rows.length), total:nf.format(ROWS.length)});
  f.append(cnt);
  f.append(dimBox);
  app.append(f);

  // Park the sticky table headers directly under the filter bar. Measured
  // rather than hard-coded: the bar wraps to two lines on narrow screens.
  // Se medía una sola vez por render(), así que abrir «Más filtros» hacía
  // crecer la barra sin que nadie volviera a mirar: la cabecera pegajosa de
  // las tablas quedaba 42px por debajo en escritorio y 158px en un móvil de
  // 360, es decir, tapada por la propia barra de filtros.
  requestAnimationFrame(medirBarra);
  dimBox.addEventListener("toggle", () => requestAnimationFrame(medirBarra));

  // The row above was just rebuilt, so the input the user is typing in is a new
  // element. Restore focus and caret, or every keystroke would drop the cursor.
  if(keepFocus){
    sb.input.focus();
    try{ sb.input.setSelectionRange(caret, caret); }catch{}
    sb.paint();
  }

  if(!rows.length){
    app.insertAdjacentHTML("beforeend",
      `<div class="state">${t("f.vacio")}${F.q?t("f.vacioQ",{q:F.q}):""}.</div>`); return;
  }

  /* hero + kpis · Forum Sport frente a la competencia ------------------ */
  if(SECCION === "home"){
  // Compared at MODEL level against the cheapest rival for that model, so a
  // product watched at three shops counts once, not three times.
  const ids0 = new Set(rows.map(r=>r.modelo));
  const barato = new Map();
  for(const c of COMP){
    if(!ids0.has(c.modelo)) continue;
    if(!F.competidores.size || F.competidores.has(c.competidor)){
      const prev = barato.get(c.modelo);
      if(!prev || c.precio_comp < prev.precio_comp) barato.set(c.modelo, c);
    }
  }
  const vs        = [...barato.values()];
  const esIgual   = x => Math.abs(x.delta_eur) < 0.005;
  const caros     = vs.filter(x=>!esIgual(x) && x.delta_eur > 0);
  const baratos   = vs.filter(x=>!esIgual(x) && x.delta_eur < 0);
  const iguales0  = vs.filter(esIgual);
  const rivales   = new Set(vs.map(x=>x.competidor)).size;
  const gapMedio  = vs.length ? vs.reduce((s,x)=>s+x.delta_pct,0)/vs.length : 0;
  const peor      = vs.length ? vs.reduce((a,b)=>b.delta_pct>a.delta_pct?b:a) : null;

  const hero=document.createElement("div"); hero.className="hero";
  if(vs.length){
    const pctCaros = caros.length/vs.length*100;
    /* El dato más accionable del pliegue —qué producto nos está haciendo más
       daño— estaba a 13px en gris, alineado a la derecha y partido a mitad de
       nombre. Sube a línea propia, legible, debajo de la cifra. El recuento
       de apoyo se queda donde estaba, que es donde le corresponde. */
    hero.innerHTML=`<p class="hero-fig">${pct(pctCaros)}</p>
      <p class="lede">${t("h.lede")}</p>
      <p class="hero-note">${t("h.nota",{
        n:nf.format(vs.length), r:nf.format(rivales),
        rl:rivales===1?t("h.competidor"):t("h.competidores"),
        gap:(gapMedio>0?"+":"")+pct(gapMedio)})}</p>`;

  } else {
    // Nothing crawled for this slice: fall back to the catalogue story.
    const pctReb0 = rows.filter(r=>r.en_rebaja).length/rows.length*100;
    hero.innerHTML=`<p class="hero-fig">${pct(pctReb0)}</p>
      <p class="lede">${t("h.ledePvp")}</p>
      <p class="hero-note">${t("h.notaPvp")}</p>`;
  }
  app.append(hero);
  if(vs.length && peor && peor.delta_pct > 0){
    const br=document.createElement("p"); br.className="hero-brecha";
    br.innerHTML = t("h.brecha",{m:peor.nombre_modelo,
                                 p:pct(peor.delta_pct), c:peor.competidor});
    app.append(br);               // después de insertar el titular, no antes
  }

  const reb=rows.filter(r=>r.en_rebaja);
  const share = n => vs.length ? pct(n/vs.length*100) : "—";
  /* Eran seis, y las dos que sobran —cuántos competidores y en cuántos
     empatamos— ya están dichas en la línea del titular. Cuatro caben en una
     fila y se leen de una vez; seis se escanean. */
  const kpis = vs.length ? [
    [t("k.comparados"), nf.format(vs.length),
     t("k.delCat",{p:pct(vs.length/rows.length*100)})],
    [t("k.masCaros"), nf.format(caros.length), share(caros.length)],
    [t("k.masBaratos"), nf.format(baratos.length), share(baratos.length)],
    [t("k.difMedia"), `${gapMedio>0?"+":""}${pct(gapMedio)}`, t("k.frenteBarato")],
  ] : [
    [t("k.modelos"), nf.format(rows.length), t("k.sku",{n:nf.format(rows.reduce((s,r)=>s+r.num_skus,0))})],
    [t("k.marcas"), nf.format(new Set(rows.map(r=>r.brand_code)).size), t("k.enCatalogo")],
    [t("k.pvpMedio"), eur.format(avg(rows,r=>r.precio)), t("k.tarifa")],
    [t("k.precioReal"), eur.format(avg(rows,r=>r.precio_rebaja)), t("k.trasRebaja")],
    [t("k.dtoMedio"), reb.length?pct(avg(reb,r=>r.descuento_pct)):"—", t("k.deRebajados")],
    [t("k.margenMedio"), pct(avg(rows,r=>r.margen)*100), t("k.sintetico")],
  ];
  const k=document.createElement("div"); k.className="kpis";
  // Money, and only money, wears the brand's price face.
  const money = v => /€/.test(String(v)) ? " money" : "";
  k.innerHTML=kpis.map(([l,v,sub])=>
    `<div class="kpi"><p class="k-label">${l}</p><p class="k-val${money(v)}">${v}</p><p class="k-sub">${sub}</p></div>`).join("");
  app.append(k);

  // The catalogue figures the competitive view replaced, kept as a second row:
  // they are the context for every chart below.
  const cat=document.createElement("div"); cat.className="kpis kpis-sec";
  cat.innerHTML=[
    [t("k.modelos"), nf.format(rows.length), t("k.sku",{n:nf.format(rows.reduce((s,r)=>s+r.num_skus,0))})],
    [t("k.pvpMedio"), eur.format(avg(rows,r=>r.precio)), t("k.tarifa")],
    [t("k.precioReal"), eur.format(avg(rows,r=>r.precio_rebaja)), t("k.trasRebaja")],
    [t("k.enRebaja"), pct(reb.length/rows.length*100), t("k.nModelos",{n:nf.format(reb.length)})],
    [t("k.margenMedio"), pct(avg(rows,r=>r.margen)*100), t("k.sintetico")],
    [t("k.stockBajo"),
     pct(rows.filter(r=>r.nivel_stock==="muy bajo"||r.nivel_stock==="bajo").length/rows.length*100),
     t("k.delCatalogo")],
  ].map(([l,v,sub])=>
    `<div class="kpi"><p class="k-label">${l}</p><p class="k-val${money(v)}">${v}</p><p class="k-sub">${sub}</p></div>`).join("");
  /* Plegada, no borrada. Son datos de contexto —PVP medio, margen medio,
     reparto de stock— que nadie consulta para decidir un precio, pero que
     explican el catálogo cuando hacen falta. Mientras estuvieron abiertos,
     «PVP MEDIO 146 €» era, por el tipo manuscrito a 36px, la cifra más
     prominente de toda la página: una media de tarifa sobre la que nadie
     actúa, gritando por encima de la respuesta. */
  if(vs.length){
    const d=document.createElement("details"); d.className="dims ctx";
    const sm=document.createElement("summary"); sm.textContent=t("k.contexto");
    d.append(sm, cat);
    app.append(d);
  }

  }   // fin del titular y los KPIs, solo en Resumen

  const grid=document.createElement("div"); grid.className="grid"; app.append(grid);

  /* 0 · POSICIONAMIENTO ONLINE % en el tiempo --------------------------
     La métrica que pide Forum Sport: nuestro precio dividido por el del
     competidor de referencia (para el MVP, el más barato encontrado). */
  if(SECCION === "home"){
    const pts = serieDiaria(rows);
    const sec = document.createElement("section"); sec.className="card wide";
    const dias = pts.length;
    const conDato = pts.filter(p=>p.v!=null);
    // The headline quotes the last day with a basket worth quoting.
    const solidos = conDato.filter(p=>!p.flojo);
    const ultimo  = (solidos.length?solidos:conDato).slice(-1)[0];
    const colaFloja = conDato.length && conDato[conDato.length-1].flojo
                    ? conDato[conDato.length-1] : null;
    let sub = dias
      ? t("ts.sub",{dia:ultimo?ultimo.k:"—", v:pct(ultimo?ultimo.v:0)})
      : t("ts.sinHist");
    if(dias && dias < 14)
      sub += t("ts.corto",{n:dias, d:dias===1?t("ts.dia"):t("ts.diasPl")});
    if(colaFloja)
      sub += t("ts.cola",{dia:colaFloja.k, n:nf.format(colaFloja.n)});
    if(!HIST_COMPLETO)
      sub += t("ts.parcial");
    sec.innerHTML = `<h2>${t("ts.titulo")}</h2><p class="sub">${sub}</p>`;

    if(dias){
      sec.append(line(pts,{baseline:100}));
      // The basket changes from day to day, so say so where it is measurable
      // rather than letting the line imply a stability it does not have.
      const nMin=Math.min(...pts.map(p=>p.n)), nMax=Math.max(...pts.map(p=>p.n));
      if(nMax && nMin !== nMax){
        const nota=document.createElement("p"); nota.className="note";
        nota.textContent=t("ts.cesta",{min:nf.format(nMin), max:nf.format(nMax)});
        sec.append(nota);
      }
      const tbl=tableFor([t("ts.thFecha"),t("ts.tipPos"),t("ts.tipMed"),t("ts.tipMod"),t("ts.tipComp")],
        pts.filter(p=>p.v!=null).map(p=>[p.fecha, [pct(p.v),p.v],
          [pct(p.mediana),p.mediana], [nf.format(p.n),p.n], [nf.format(p.comps),p.comps]]));
      const det=document.createElement("details");
      det.innerHTML=`<summary>${t("g.tabla")}</summary>`; det.append(tbl);
      sec.append(det);
    }
    grid.append(sec);
  }

  /* 0b · Precio recomendado ---------------------------------------------- */
  if(SECCION === "pricing"){
    const recs = recomendaciones(rows);
    const sec = document.createElement("section"); sec.className="card wide";
    const suben  = recs.filter(x=>x.delta_eur >  0.004);
    const bajan  = recs.filter(x=>x.delta_eur < -0.004);
    const igual  = recs.length - suben.length - bajan.length;
    const conRef = recs.filter(x=>x.ref);
    const posRec = conRef.length
      ? conRef.reduce((s,x)=>s+x.posicion_rec,0)/conRef.length : null;
    const posAct = conRef.length
      ? conRef.reduce((s,x)=>s+x.actual/x.ref*100,0)/conRef.length : null;
    const fiables = recs.filter(x=>x.confianza>=50).length;
    // El conflicto entre el suelo de margen y el techo C no es un caso límite:
    // en el catálogo completo son 411 de los 742 modelos comparables. Si no se
    // cuenta en la cabecera, el lector lo descubre fila a fila.
    const noAlin = recs.filter(x=>x.veredicto!=="ok" && x.veredicto!=="sin_mercado").length;

    sec.innerHTML = `<h2>${t("m.titulo")}</h2><p class="sub">${t("m.sub")}</p>`;

    const kpi = document.createElement("div"); kpi.className="kpis kpis-eng";
    kpi.innerHTML = [
      [t("k.modelos"), nf.format(recs.length), t("m.conConf",{n:nf.format(fiables)})],
      [t("m.baja"), nf.format(bajan.length), bajan.length?t("m.media",{v:eur2.format(bajan.reduce((s,x)=>s+x.delta_eur,0)/bajan.length)}):"—"],
      [t("m.alza"), nf.format(suben.length), suben.length?t("m.media",{v:eur2.format(suben.reduce((s,x)=>s+x.delta_eur,0)/suben.length)}):"—"],
      [t("m.sinCambio"), nf.format(igual), t("m.enObjetivo")],
      [t("m.noAlineables"), nf.format(noAlin), t("m.noAlinSub")],
      [t("m.posActual"), posAct?pct(posAct):"—", t("m.sobreRival")],
      [t("m.posRec"), posRec?pct(posRec):"—",
        posRec&&posAct?`${posRec<posAct?"−":"+"}${nf1.format(Math.abs(posRec-posAct))} pp`:"—"],
    ].map(([l,v,sub])=>
      `<div class="kpi"><p class="k-label">${l}</p><p class="k-val">${v}</p><p class="k-sub">${sub}</p></div>`).join("");
    sec.append(kpi);

    /* Parámetros editables. Cambiarlos recalcula al instante porque el motor
       vive aquí, no en el servidor. */
    const box = document.createElement("details"); box.className="dims params";
    if(paramsOpen) box.open = true;
    box.innerHTML = `<summary>${t("m.params")}</summary>`;

    const aplicar = () => { guardarParams(); paramsOpen = true; render(); };
    const grupo = clave => {
      const h = document.createElement("p"); h.className = "param-grupo";
      h.textContent = t(clave); box.append(h);
      const g = document.createElement("div"); g.className = "param-grid";
      box.append(g); return g;
    };
    // Un input numérico con su rango. Devuelve el <label>, ya cableado.
    const num = (etiqueta, valor, min, max, step, set) => {
      const w = document.createElement("label"); w.className = "param";
      w.innerHTML = `<span>${etiqueta}</span>`;
      const i = document.createElement("input");
      i.type="number"; i.value=valor; i.min=min; i.max=max; i.step=step;
      i.onchange = () => {
        const v = parseFloat(i.value);
        if(!Number.isFinite(v)){ i.value = valor; return; }   // vacío o basura: se revierte
        set(Math.max(min, Math.min(max, v))); aplicar();
      };
      w.append(i); return w;
    };

    /* ── La matriz, como tabla ───────────────────────────────────────────
       Quince inputs sueltos en una rejilla no son una matriz: la matriz tiene
       filas y columnas y hay que poder leerla como la hoja de la que viene. */
    const hm = document.createElement("p"); hm.className="param-grupo";
    hm.textContent = t("m.matriz"); box.append(hm);
    const tm = document.createElement("table"); tm.className = "t-matriz";
    tm.innerHTML = `<thead><tr><th>${t("m.thTramo")}</th><th>${t("m.thDesde")}</th>
      <th>${t("m.thHasta")}</th><th>${t("m.thMgPct")}</th><th>${t("m.thMgEur")}</th>
      <th>${t("m.thC")}</th></tr></thead><tbody></tbody>`;
    const tmb = tm.querySelector("tbody");
    for(let i=0; i<N_TRAMOS; i++){
      const tr = document.createElement("tr");
      const desde = i === 0 ? eur.format(0) : eur.format(P.cortes[i-1]);
      tr.innerHTML = `<td>${t("m.tramoN",{n:i+1})}</td><td class="t-k">${desde}</td>`;
      // "Hasta" es el corte, y es editable salvo en el último tramo, que no
      // termina. Editar solo los cortes hace imposible un hueco o un solape.
      const tdH = document.createElement("td");
      if(i < P.cortes.length){
        // Un corte no puede cruzar a sus vecinos, o la partición dejaría de
        // estar ordenada y tramoDe() devolvería cualquier cosa.
        const min = i === 0 ? 0.01 : P.cortes[i-1] + 0.01;
        const max = i === P.cortes.length-1 ? 100000 : P.cortes[i+1] - 0.01;
        tdH.append(num("", P.cortes[i], min, max, 1, v => P.cortes[i] = v));
      } else { tdH.className = "t-k"; tdH.textContent = "∞"; }
      tr.append(tdH);
      for(const [clave, min, max, step] of
          [["mg_pct",0,90,1], ["mg_eur",0,500,1], ["c_max",50,200,1]]){
        const td = document.createElement("td");
        td.append(num("", P[clave][i], min, max, step, v => P[clave][i] = v));
        tr.append(td);
      }
      tmb.append(tr);
    }
    const wm = document.createElement("div"); wm.className = "t-wrap"; wm.append(tm);
    box.append(wm);
    const nm = document.createElement("p"); nm.className = "note";
    nm.innerHTML = t("m.matrizNota"); box.append(nm);

    const gObj = grupo("m.grupoObj");
    for(const [lab,k] of [["m.pObjAA","obj_AA"],["m.pObjA","obj_A"],["m.pObjB","obj_B"],
                          ["m.pObjC","obj_C"],["m.pObjD","obj_D"],["m.pObjSin","obj_sin"]])
      gObj.append(num(t(lab), P[k], 50, 200, 1, v => P[k] = v));

    const gAj = grupo("m.grupoAj");
    for(const [lab,k] of [["m.pStkMA","stk_muy_alto"],["m.pStkA","stk_alto"],
                          ["m.pStkM","stk_medio"],["m.pStkB","stk_bajo"],
                          ["m.pStkMB","stk_muy_bajo"],["m.pOutlet","aj_outlet"],
                          ["m.pVieja","aj_temporada_vieja"]])
      gAj.append(num(t(lab), P[k], -30, 30, 1, v => P[k] = v));

    const gOtr = grupo("m.grupoOtros");
    const wRef = document.createElement("label"); wRef.className = "param";
    wRef.innerHTML = `<span>${t("m.referencia")}</span>`;
    const selRef = document.createElement("select");
    selRef.innerHTML = REFERENCIAS.map(v =>
      `<option value="${v}"${v===P.referencia?" selected":""}>${
        t(v==="min"?"m.refMin":v==="media"?"m.refMedia":"m.refMediana")}</option>`).join("");
    selRef.onchange = () => { P.referencia = selRef.value; aplicar(); };
    wRef.append(selRef); gOtr.append(wRef);
    gOtr.append(num(t("m.pRedondeo"), P.redondeo, 0.01, 10, 0.01, v => P.redondeo = v));

    const reset=document.createElement("button");
    reset.className="ghost"; reset.type="button"; reset.textContent=t("m.reset");
    // Copia profunda: {...PARAMS_DEF} compartiría los arrays de la matriz con
    // los valores por defecto, y el primer cambio los corrompería para siempre.
    reset.onclick=()=>{ P=JSON.parse(JSON.stringify(PARAMS_DEF)); aplicar(); };
    box.append(reset);
    sec.append(box);

    /* Los mayores ajustes primero: es donde está el dinero. Pero ordenar solo
       por |Δ€| encabeza la lista con el consejo peor sostenido que existe —el
       movimiento más grande es casi siempre el que se apoya en un único
       competidor—, y esa es exactamente la fila que un category manager tiene
       que defender delante de su director.

       Así que la evidencia va primero y el importe después. Nada se oculta:
       las filas débiles siguen en la lista, marcadas, detrás de las que el
       dato sostiene. El corte del 50 % es el mismo que ya gobierna el KPI de
       esta tarjeta, no un número nuevo.

       El orden de los dos pasos importa. Ordenar por evidencia ANTES de cortar
       a 40 no degrada las filas débiles: las expulsa de la tabla, porque hay
       ajustes bien sostenidos de sobra para llenar las 40 plazas. Así que
       primero se eligen las 40 por importe —son las mismas que antes— y
       después se reordenan. Se avisa, no se esconde. */
    const SALTO_GRANDE = 25;            // % de variación que pide dos opiniones
    for(const x of recs){
      x.saltoGrande = Math.abs(x.delta_pct) > SALTO_GRANDE && x.n_comp <= 1;
      x.debil = x.n_comp <= 1 || x.confianza < 50;
    }
    const top=[...recs]
      .sort((a,b)=>Math.abs(b.delta_eur)-Math.abs(a.delta_eur))
      .slice(0,40)
      .sort((a,b)=>(a.debil - b.debil) || Math.abs(b.delta_eur)-Math.abs(a.delta_eur));
    const topDebiles = top.filter(x=>x.debil).length;
    const byId=new Map(rows.map(r=>[r.modelo,r]));
    // `tb`, no `t`: en este fichero `t()` es la función de traducción, y una
    // variable local llamada `t` la tapa dentro de la plantilla de abajo.
    const tb=document.createElement("table"); tb.className="t-rec";
    tb.innerHTML=`<thead><tr><th>${t("g.thModelo")}</th><th>${t("m.thTramo")}</th>
      <th>${t("m.thActual")}</th><th>${t("m.thRec")}</th>
      <th>${t("m.thDif")}</th><th>${t("m.thPosRec")}</th><th>${t("m.thMargen")}</th>
      <th>${t("m.thConf")}</th><th>${t("m.thPorQue")}</th></tr></thead><tbody>${top.map(x=>{
      const r=byId.get(x.modelo);
      const cls=x.delta_eur<-0.004?"delta-dn":x.delta_eur>0.004?"delta-up":"";
      const nT = x.tramo + 1;
      const motivo =
          x.veredicto==="outlet_bajo_suelo" ? t("m.outletBajo",{n:nT})
        : x.veredicto==="fuera_de_tarifa" ? t("m.fueraTarifa",{n:nT})
        : x.veredicto==="no_alineable"    ? t("m.noAlineable",{n:nT})
        : x.barrera==="margen"            ? t("m.barrSuelo",{n:nT})
        : x.barrera==="C"                 ? t("m.barrC",{n:nT, p:pct(P.c_max[x.tramo])})
        : x.barrera==="PVP"               ? t("m.barrPvp")
        : x.barrera==="outlet"            ? t("m.barrOutlet")
        : x.ref                           ? t("m.objetivo",{p:pct(x.objetivo)})
        : t("m.sinComp");
      const cconf = x.confianza < 40 ? "c-baja" : x.confianza < 60 ? "c-media" : "c-alta";
      return `<tr class="${x.debil?"debil":""}">
        <td class="prod-cell" data-sort="${r.nombre_modelo.replace(/"/g,"&quot;")}"><span class="prod-name">
          <a href="${r.url}" target="_blank" rel="noopener">${r.nombre_modelo}</a>
          <small>${r.marca} · ${r.abcd_digital||t("m.sinRotacion")} · ${t("m.stock",{v:nivelLab(r.nivel_stock)})}</small>
        </span></td>
        <td data-sort="${x.tramo}" title="${eur.format(x.tramo===0?0:P.cortes[x.tramo-1])} – ${
          x.tramo===P.cortes.length?"∞":eur.format(P.cortes[x.tramo])}">${t("m.tramoN",{n:x.tramo+1})}</td>
        <td data-sort="${x.actual}">${eur2.format(x.actual)}</td>
        <td data-sort="${x.precio_rec}"><b>${eur2.format(x.precio_rec)}</b></td>
        <td class="${cls}" data-sort="${x.delta_eur}">${x.delta_eur>0?"+":""}${eur2.format(x.delta_eur)}</td>
        <td data-sort="${x.posicion_rec??""}">${x.posicion_rec?pct(x.posicion_rec):"—"}</td>
        <td data-sort="${x.margen_rec}">${pct(x.margen_rec)}</td>
        <td data-sort="${x.confianza}"><span class="conf ${cconf}"
            title="${t("m.umbral")}"><span class="conf-bar"><i style="width:${x.confianza}%"></i></span>
            ${x.confianza} %</span></td>
        <td class="t-k" data-sort="${motivo.replace(/"/g,"&quot;")}">${
          x.debil?`<span class="flag">${t("m.debil")}</span>`:""}${motivo}${
          x.saltoGrande?` · ${t("m.saltoGrande",{p:(x.delta_pct>0?"+":"")+pct(x.delta_pct)})}`
                       :x.notas.length?` · ${x.notas[0]}`:""}</td>
      </tr>`;}).join("")}</tbody>`;
    ordenable(tb, {clave:"rec"});
    const w=document.createElement("div"); w.className="t-wrap"; w.append(tb);
    sec.append(w);
    const nota=document.createElement("p"); nota.className="note";
    nota.textContent=t("m.nota",{n:nf.format(top.length), total:nf.format(recs.length)})
      + (topDebiles ? " " + t("m.debilAyuda",{n:nf.format(topDebiles), t:nf.format(top.length)}) : "");
    sec.append(nota);
    grid.append(sec);
  }

  /* 1 · Posición de precio frente a la competencia ----------------------
     Distribución de los modelos comparados según cuánto nos separamos del
     competidor más barato. Divergente y centrada en la paridad: a la izquierda
     somos más baratos, a la derecha más caros, y la altura dice cuántos
     modelos hay en cada situación. */
  if(SECCION === "home" && COMP.length){
    const ids1 = new Set(rows.map(r=>r.modelo));
    const mejor = new Map();
    for(const c of COMP){
      if(!ids1.has(c.modelo)) continue;
      if(F.competidores.size && !F.competidores.has(c.competidor)) continue;
      const prev = mejor.get(c.modelo);
      if(!prev || c.precio_comp < prev.precio_comp) mejor.set(c.modelo, c);
    }
    const vs1 = [...mejor.values()];

    const BANDAS = [
      {k:t("pp.b1"), lo:-1e9, hi:-20,  c:"var(--dv-c3)"},
      {k:t("pp.b2"), lo:-20,  hi:-10,  c:"var(--dv-c2)"},
      {k:t("pp.b3"), lo:-10,  hi:-2,   c:"var(--dv-c1)"},
      {k:t("pp.b4"), lo:-2,   hi:2,    c:"var(--dv-mid)"},
      {k:t("pp.b5"), lo:2,    hi:10,   c:"var(--dv-d1)"},
      {k:t("pp.b6"), lo:10,   hi:20,   c:"var(--dv-d2)"},
      {k:t("pp.b7"), lo:20,   hi:1e9,  c:"var(--dv-d3)"},
    ];
    const items = BANDAS.map(b=>{
      const inB = vs1.filter(x=>x.delta_pct >= b.lo && x.delta_pct < b.hi);
      return {k:b.k, v:inB.length, c:b.c,
              note:inB.length
                ? `<span class="t-k">${inB.length===1?t("g.modelo"):t("g.modelos")}:</span> ${nf.format(inB.length)}`
                  + `<br><span class="t-k">${t("g.ejemplo")}:</span> ${inB[0].nombre_modelo}`
                : ""};
    });

    const c = document.createElement("section"); c.className="card wide";
    if(!vs1.length){
      c.innerHTML=`<h2>${t("pp.titulo")}</h2><p class="sub">${t("pp.vacio")}</p>`;
      grid.append(c);
    } else {
      const baratos = vs1.filter(x=>x.delta_pct < -2).length;
      const igual   = vs1.filter(x=>x.delta_pct >= -2 && x.delta_pct < 2).length;
      const caros   = vs1.filter(x=>x.delta_pct >= 2).length;
      c.innerHTML=`<h2>${t("pp.tituloLargo")}</h2>
        <p class="sub">${t("pp.sub",{b:nf.format(baratos), i:nf.format(igual),
                                     c:nf.format(caros), t:nf.format(vs1.length)})}</p>`;
      const box=document.createElement("div");
      const leg=document.createElement("div"); leg.className="legend";
      leg.innerHTML=`<span><i class="swatch" style="background:var(--dv-c2)"></i>${t("pp.legBarato")}</span>
        <span><i class="swatch" style="background:var(--dv-mid)"></i>${t("pp.legIgual")}</span>
        <span><i class="swatch" style="background:var(--dv-d2)"></i>${t("pp.legCaro")}</span>`;
      box.append(leg, columns(items, {colorOf:d=>d.c, rotate:true}));
      c.append(box);
      c.append(...[tableFor([t("pp.thDif"),t("k.modelos"),t("pp.thPct")],
        // La primera columna son bandas ordenadas de −20 % a +20 %: alfabéticamente
        // quedarían al azar, así que ordenan por su posición en la escala.
        items.map((d,i)=>[[d.k,i], [nf.format(d.v),d.v],
                      [pct(vs1.length?d.v/vs1.length*100:0), vs1.length?d.v/vs1.length:0]]))].map(tb=>{
        const det=document.createElement("details");
        det.innerHTML=`<summary>${t("g.tabla")}</summary>`; det.append(tb); return det;}));
      grid.append(c);
    }
  }

  /* 2 · Frente a la competencia ------------------------------------------ */
  if(SECCION === "explorer" && COMP.length){
    const ids = new Set(rows.map(r=>r.modelo));
    // Three states, not two: an identical price is a match, not a narrow win.
    // Compared on cents to avoid float noise making 0,00 € look like a win.
    const comp = COMP
      // Respect the competitor filter here too: picking "Nike" should show
      // Nike's prices, not every price for the models Nike happens to carry.
      .filter(c=>ids.has(c.modelo) &&
                 (!F.competidores.size || F.competidores.has(c.competidor)))
      .map(c=>{
        const eq = Math.abs(c.delta_eur) < 0.005;
        return {...c, eq, edad: antiguedad(c.observed_at),
          cls:   eq ? "delta-eq" : (c.delta_eur>0 ? "delta-up" : "delta-dn"),
          badge: eq ? "igual"    : (c.somos_mas_baratos ? "barato" : "caro"),
          label: eq ? t("fc.igual") : (c.somos_mas_baratos ? t("fc.barato") : t("fc.caro"))};
      })
      .sort((a,b)=>b.delta_pct-a.delta_pct);
    // Group by model, worst gap first, and within a model cheapest rival first.
    const order = [...new Map(comp.map(c=>[c.modelo, c])).keys()];
    const rank = new Map(order.map((m,i)=>[m,i]));
    comp.sort((a,b)=> rank.get(a.modelo)-rank.get(b.modelo)
                   || a.precio_comp-b.precio_comp);
    const seen = new Set();
    comp.forEach(c=>{ c.first = !seen.has(c.modelo); seen.add(c.modelo); });
    const nComp = new Map();
    comp.forEach(c=>nComp.set(c.modelo,(nComp.get(c.modelo)||0)+1));
    comp.forEach(c=>{ c.rivals = nComp.get(c.modelo); });
    // The star marks the cheapest price for that product across us AND every
    // rival — so it answers "who is actually cheapest", not "which rival is".
    const mejorComp = new Map();
    comp.forEach(c=>{
      const prev = mejorComp.get(c.modelo);
      if(prev === undefined || c.precio_comp < prev) mejorComp.set(c.modelo, c.precio_comp);
    });
    comp.forEach(c=>{
      const mc = mejorComp.get(c.modelo);
      c.fsGana   = c.precio_fs <= mc;                              // we are cheapest
      c.compGana = !c.fsGana && Math.abs(c.precio_comp - mc) < 0.005; // this rival is
    });
    const c = document.createElement("section"); c.className="card wide";
    if(!comp.length){
      c.innerHTML=`<h2>${t("fc.titulo")}</h2><p class="sub">${t("fc.vacio")}</p>`;
      grid.append(c); 
    } else {
      const caros   = comp.filter(x=>!x.eq && !x.somos_mas_baratos).length;
      const iguales = comp.filter(x=>x.eq).length;
      const modelos = new Set(comp.map(x=>x.modelo)).size;
      const multi   = [...nComp.values()].filter(v=>v>1).length;
      const fuentes = [...new Set(comp.map(x=>x.competidor))];
      const fecha = new Date(Math.max(...comp.map(x=>+new Date(x.observed_at))));
      c.innerHTML=`<h2>${t("fc.titulo")}</h2>
        <p class="sub">${t("fc.sub",{
          m:nf.format(modelos), p:nf.format(comp.length), f:fuentes.join(", "),
          c:nf.format(caros),
          ig:iguales?t("fc.iguales",{n:nf.format(iguales)}):"",
          mu:multi?t("fc.multi",{n:nf.format(multi)}):""})}</p>`;
      const tb=document.createElement("table"); tb.className="t-comp";
      tb.innerHTML=`<thead><tr><th>${t("g.thModelo")}</th><th>${t("fc.thFs")}</th><th>${t("fc.thComp")}</th>
        <th>${t("m.thDif")}</th><th>${t("fc.thDifPct")}</th><th>${t("fc.thPos")}</th>
        <th>${t("f.competidor")}</th><th>${t("fc.thAct")}</th></tr></thead><tbody></tbody>`;

      /* Esta tabla agrupa: el nombre se imprime una vez por modelo y los
         rivales siguientes son «↳». Esa agrupación solo tiene sentido con las
         filas de un modelo juntas, así que en cuanto se ordena por una columna
         la tabla se aplana y cada fila recupera su nombre y su precio. Ordenar
         con la agrupación puesta dejaría «↳» huérfanos bajo otro producto. */
      const fila = (x, agrupado) => {
        const cab = agrupado && !x.first;
        return `<tr class="${x.eq?"igual-row ":""}${!agrupado?"":x.first?"grp-start":"grp-cont"}">
          ${!cab ? `<td class="prod-cell" data-sort="${x.nombre_modelo.replace(/"/g,"&quot;")}"><span class="prod">
            <img class="thumb" src="${x.img_thumb}" alt="" loading="lazy" decoding="async"
                 width="46" height="46"
                 onerror="this.setAttribute('data-failed','');this.removeAttribute('src')">
            <span class="prod-name">
              <a href="${x.url_fs}" target="_blank" rel="noopener">${x.nombre_modelo}</a>
              <small>${x.marca}${x.rivals>1?t("fc.rivales",{n:x.rivals}):""}</small>
            </span></span></td>`
          : `<td class="prod-cell cont-mark" data-sort="${x.nombre_modelo.replace(/"/g,"&quot;")}">↳</td>`}
          <td class="${!cab&&x.fsGana?"best":""}" data-sort="${x.precio_fs}">${!cab
            ? `${x.fsGana?`<span class="star" title="${t("fc.precioBajo")}">★</span>`:""}${eur2.format(x.precio_fs)}`
            : ""}</td>
          <td class="${x.compGana?"best":""}" data-sort="${x.precio_comp}">${x.compGana
            ? `<span class="star" title="${t("fc.precioBajo")}">★</span>`:""}<a href="${x.url_comp}"
            target="_blank" rel="noopener">${eur2.format(x.precio_comp)}</a>
            <small class="rival-sm" title="${x.competidor.replace(/"/g,"&quot;")}">${x.competidor}</small></td>
          <td class="${x.cls}" data-sort="${x.delta_eur}">${x.eq?"":(x.delta_eur>0?"+":"")}${eur2.format(x.delta_eur)}</td>
          <td class="${x.cls}" data-sort="${x.delta_pct}">${x.eq?"":(x.delta_pct>0?"+":"")}${pct(x.delta_pct)}</td>
          <td data-sort="${x.delta_pct}"><span class="badge ${x.badge}">${x.label}</span></td>
          <td class="rival" data-sort="${x.competidor.replace(/"/g,"&quot;")}"
              title="${x.competidor.replace(/"/g,"&quot;")}"><a href="${x.url_comp}" target="_blank" rel="noopener"
                 title="${t("fc.verEn",{m:x.nombre_modelo, c:x.competidor})}">${x.competidor}</a></td>
          <td class="edad${x.edad.stale?" stale":""}" title="${x.edad.full}"
              data-sort="${Date.parse(x.observed_at)||0}">${x.edad.txt}</td></tr>`;
      };
      const CLAVES_C = [x=>x.nombre_modelo, x=>x.precio_fs, x=>x.precio_comp,
                        x=>x.delta_eur, x=>x.delta_pct, x=>x.delta_pct,
                        x=>x.competidor, x=>Date.parse(x.observed_at)||0];
      /* Agrupada, la unidad de paginación es el MODELO, no la fila: partir un
         producto entre dos páginas dejaría sus rivales huérfanos al otro lado
         de un clic. Ordenada, la tabla ya está aplanada y se pagina por fila.
         El contador dice cuál de las dos cosas está contando. */
      const GRUPOS = [...comp.reduce((m,x)=>{
        if(!m.has(x.modelo)) m.set(x.modelo, []);
        m.get(x.modelo).push(x); return m;
      }, new Map()).values()];
      let ordenActual = null;              // null = agrupado por modelo

      const pager = crearPager({
        tabla: tb,
        total: () => ordenActual ? comp.length : GRUPOS.length,
        rango: (k,v) => ordenActual ? t("pg.rangoPrecios",v) : t("pg.rango",v),
        onDraw: (inicio, por) => {
          const trozo = ordenActual
            ? [...comp].sort(ordenActual).slice(inicio, inicio+por)
            : GRUPOS.slice(inicio, inicio+por).flat();
          tb.tBodies[0].innerHTML = trozo.map(x=>fila(x, !ordenActual)).join("");
          // Lo que el contador debe sumar: modelos agrupada, filas ordenada.
          return ordenActual ? trozo.length
               : GRUPOS.slice(inicio, inicio+por).length;
        },
      });

      ordenable(tb,{clave:"comp", onSort:(col,dir)=>{
        const k=CLAVES_C[col];
        ordenActual = (a,b)=>{
          const x=k(a), y=k(b);
          const c = typeof x==="string" ? x.localeCompare(y,LANG,{numeric:true}) : x-y;
          return dir*c || a.nombre_modelo.localeCompare(b.nombre_modelo,LANG)
                       || a.precio_comp-b.precio_comp;
        };
        // Ordenar y quedarse en la página 7 ordena algo que no se ve: la fila
        // que acaba de subir a la primera posición estaría seis páginas atrás.
        pager.primeraPagina();
        pager.draw();
      }});
      pager.draw();
      const w=document.createElement("div"); w.className="t-wrap"; w.append(tb);
      c.append(w, pager.nodo);
      const note=document.createElement("p"); note.className="comp-note";
      note.textContent=t("fc.nota",{
        f:fecha.toLocaleDateString(LOC(),{day:"numeric",month:"long",year:"numeric"})});
      c.append(note);
      grid.append(c);
    }
  }

  /* 3 · Modelos por marca ------------------------------------------------ */
  if(SECCION === "home"){
    const m=[...by(rows,r=>r.marca).entries()].sort((a,b)=>b[1]-a[1]);
    const top=m.slice(0,12).map(([k,v])=>({k,v}));
    const rest=m.slice(12).reduce((s,[,v])=>s+v,0);
    if(rest) top.push({k:t("mb.otras"),v:rest,
      note:`<span class="t-k">${t("mb.agrupadas",{n:m.length-12})}</span>`});
    grid.append(card(t("mb.titulo"), m.length>12?t("mb.sub12"):t("mb.sub"),
      hbar(top),
      tableFor([t("mb.thMarca"),t("k.modelos")], m.map(([k,v])=>[k,[nf.format(v),v]]))));
  }

  /* 4 · Bandas de precio ------------------------------------------------- */
  if(SECCION === "home"){
    const items=BANDS.map(([lo,hi,k])=>({k,v:rows.filter(r=>r.precio>=lo&&r.precio<hi).length}))
      .filter(d=>d.v);
    grid.append(card(t("bp.titulo"), t("bp.sub"),
      columns(items),
      tableFor([t("bp.thBanda"),t("k.modelos")],
        items.map((d,i)=>[[d.k,i],[nf.format(d.v),d.v]]))));
  }

  /* 5 · Nivel de margen (ordinal ramp) ----------------------------------- */
  if(SECCION === "home"){
    const items=ORD_MARGEN.map(k=>({k:nivelLab(k),raw:k,v:rows.filter(r=>r.nivel_margen===k).length}))
      .filter(d=>d.v);
    const idx=d=>ORD_MARGEN.indexOf(d.raw);
    grid.append(card(t("nm.titulo"), t("nm.sub"),
      hbar(items,{colorOf:d=>RAMP4[idx(d)]}),
      tableFor([t("g.nivel"),t("k.modelos"),t("g.pctTotal")],
        items.map(d=>[[d.k,idx(d)],[nf.format(d.v),d.v],
                      [pct(d.v/rows.length*100),d.v]]))));
  }

  /* 6 · Nivel de stock (ordinal ramp) ------------------------------------ */
  if(SECCION === "home"){
    const items=ORD_STOCK.map(k=>({k:nivelLab(k),raw:k,v:rows.filter(r=>r.nivel_stock===k).length}))
      .filter(d=>d.v);
    const idx=d=>ORD_STOCK.indexOf(d.raw);
    grid.append(card(t("ns.titulo"), t("ns.sub"),
      hbar(items,{colorOf:d=>RAMP5[idx(d)]}),
      tableFor([t("g.nivel"),t("k.modelos"),t("g.pctTotal")],
        items.map(d=>[[d.k,idx(d)],[nf.format(d.v),d.v],
                      [pct(d.v/rows.length*100),d.v]]))));
  }

  /* 7 · Running vs trail ------------------------------------------------- */
  if(SECCION === "home"){
    const items=[...by(rows,r=>r.tipo_producto).entries()]
      .sort((a,b)=>b[1]-a[1])
      .map(([k,v],i)=>({k:t("tipo."+k)==="tipo."+k ? k[0].toUpperCase()+k.slice(1) : t("tipo."+k), v,
        c:i?"var(--s2)":"var(--s1)", ink:i?"on-light":"on-dark"}));
    const leg=document.createElement("div"); leg.className="legend";
    leg.innerHTML=items.map(d=>`<span><i class="swatch" style="background:${d.c}"></i>${d.k}</span>`).join("");
    const box=document.createElement("div"); box.append(leg,stacked(items));
    grid.append(card(t("rt.titulo"), t("rt.sub"), box,
      tableFor([t("rt.thTipo"),t("k.modelos"),t("g.pctTotal")],
        items.map(d=>[d.k,[nf.format(d.v),d.v],
                      [pct(d.v/rows.length*100),d.v]])), true));
  }

  /* 8 · Catálogo paginado ------------------------------------------------ */
  if(SECCION === "explorer"){
    // The whole filtered slice, not a top-N: paging is what makes 1.483 rows
    // browsable. Still ordered by discount, so the head of the table is the
    // same "mayores descuentos" view it replaces.
    const all=[...rows];
    const row=r=>`<tr>
      <td class="prod-cell"><span class="prod">
        <img class="thumb" src="${r.img_thumb}" alt="" loading="lazy" decoding="async"
             width="46" height="46"
             onerror="this.setAttribute('data-failed','');this.removeAttribute('src')">
        <span class="prod-name">
          <a href="${r.url}" target="_blank" rel="noopener">${r.nombre_modelo}</a>
          <small>${r.marca}${r.outlet?'<span class="tag">outlet</span>':""}</small>
        </span></span></td>
      <td>${eur2.format(r.precio)}</td>
      <td>${r.en_rebaja?eur2.format(r.precio_rebaja):"—"}</td>
      <td>${r.en_rebaja?`<b>${pct(r.descuento_pct)}</b>`:'<span class="t-k">—</span>'}</td>
      <td>${eur2.format(r.precio_rebaja*(1-r.margen))}</td>
      <td>${nivelLab(r.nivel_stock)}</td></tr>`;

    const tb=document.createElement("table"); tb.className="t-cat";
    tb.innerHTML=`<thead><tr><th>${t("g.thModelo")}</th><th>${t("cat.thPvp")}</th>
      <th>${t("cat.thPrecio")}</th><th>${t("cat.thDto")}</th><th>${t("cat.thNeto")}</th>
      <th>${t("cat.thStock")}</th></tr></thead><tbody></tbody>`;
    const tbody=tb.querySelector("tbody");

    const pager=crearPager({
      tabla: tb, por: 12, total: () => all.length,
      onDraw: (inicio, por) => {
        const trozo = all.slice(inicio, inicio+por);
        tbody.innerHTML = trozo.map(row).join("");
        return trozo.length;
      },
    });

    // Esta tabla no tiene sus filas en el DOM: solo las 12 de la página. Si se
    // reordenaran los <tr> visibles se ordenaría una página, no la tabla, y la
    // fila con el mayor descuento seguiría escondida en la página 7. Así que
    // ordena el array completo y se vuelve a la primera página.
    // Las claves son lo que la celda MUESTRA, no lo que la fila contiene: las
    // columnas «Precio» y «Dto.» están vacías cuando el modelo no está
    // rebajado, y ordenar por el precio de rebaja que no se ve llenaba la
    // cabecera de guiones.
    const CLAVES=[r=>r.nombre_modelo, r=>r.precio,
                  r=>r.en_rebaja?r.precio_rebaja:null,
                  r=>r.en_rebaja?r.descuento_pct:null,
                  r=>r.precio_rebaja*(1-r.margen),
                  r=>ORD_STOCK.indexOf(r.nivel_stock)];
    ordenable(tb,{clave:"cat", inicial:{col:3,dir:-1}, onSort:(col,dir)=>{
      const k=CLAVES[col];
      all.sort((a,b)=>{
        const x=k(a), y=k(b);
        // Un hueco no es un cero: las celdas vacías van al final en ambos sentidos.
        if(x==null || y==null) return x==null&&y==null ? 0 : x==null ? 1 : -1;
        const c = typeof x==="string" ? x.localeCompare(y,LANG,{numeric:true}) : x-y;
        // Desempate estable por nombre: sin él, dos modelos con el mismo
        // descuento cambian de sitio entre ordenaciones sin motivo visible.
        return dir*c || a.nombre_modelo.localeCompare(b.nombre_modelo,LANG);
      });
      pager.primeraPagina(); pager.draw();
    }});

    const c=document.createElement("section"); c.className="card wide";
    c.innerHTML=`<h2>${t("cat.titulo")}</h2><p class="sub">${t("cat.sub")}</p>`;
    const w=document.createElement("div"); w.className="t-wrap"; w.append(tb);
    c.append(w, pager.nodo); grid.append(c);
    pager.draw();
  }

  document.getElementById("state")?.remove();
}

/* ── Panel de rastreo ──────────────────────────────────────────────────
   Todo lo de esta sección pasa por la Edge Function `scrape-control`, nunca
   por PostgREST con la clave pública. `competitors` y `crawl_log` tienen RLS
   sin una sola política a propósito: la página vive en una URL pública y sin
   autenticación, y qué competidores se vigilan —con qué retardo y con qué
   user-agent— es estrategia, no dato de precios.

   El token vive en localStorage, que es del navegador de quien opera, y viaja
   en una cabecera. Nunca entra en el HTML ni en el repositorio. */
const OP_KEY = "fs-operator-token";
let opToken = ""; try{ opToken = localStorage.getItem(OP_KEY) || ""; }catch{}
let scEstado = null, scFallo = null, scCargando = false, scMensaje = null;

async function scrapeApi(payload){
  const r = await fetch(`${URL_}/functions/v1/scrape-control`, {
    method: "POST",
    headers: { apikey: ANON, Authorization: `Bearer ${ANON}`,
               "Content-Type": "application/json", "x-operator-token": opToken },
    body: JSON.stringify(payload),
  });
  let j = null; try{ j = await r.json(); }catch{}
  if(!r.ok) throw Object.assign(new Error((j && (j.detail || j.error)) || r.status),
                                {status: r.status, cuerpo: j});
  return j;
}

async function cargarScraping(){
  if(!opToken) return;
  scCargando = true; scFallo = null;
  try      { scEstado = await scrapeApi({action:"status"}); }
  catch(e) { scFallo = e; scEstado = null; }
  finally  { scCargando = false; if(SECCION === "scraping") render(); }
}

/* Salud de un competidor a partir de su última ejecución. Una sola ejecución
   buena no dice que esté sano, pero una con cero páginas y errores sí dice que
   está roto, y eso es lo que hay que ver de un vistazo. */
function saludDe(c){
  if(!c.enabled)            return {k:"apagado", cls:"igual"};
  const u = (c.historial || [])[0];
  if(!u)                    return {k:"nunca",   cls:"igual"};
  if(u.errors > 0 && u.pages_fetched === 0) return {k:"roto",   cls:"caro"};
  if(u.errors > 0)          return {k:"avisos",  cls:"caro"};
  return {k:"ok", cls:"barato"};
}

function seccionScraping(app){
  const sec = document.createElement("section"); sec.className = "card wide";
  sec.innerHTML = `<h2>${t("sc.titulo")}</h2><p class="sub">${t("sc.sub")}</p>`;
  app.append(sec);

  /* ── sin token: sólo la puerta ─────────────────────────────────────── */
  if(!opToken){
    const f = document.createElement("form"); f.className = "sc-puerta";
    f.innerHTML = `<label class="param"><span>${t("sc.token")}</span></label>`;
    const i = document.createElement("input");
    i.type = "password"; i.autocomplete = "off"; i.className = "sc-token";
    i.setAttribute("aria-label", t("sc.token"));
    const b = document.createElement("button");
    b.className = "chip"; b.type = "submit"; b.textContent = t("sc.entrar");
    f.querySelector("label").append(i);
    f.append(b);
    f.onsubmit = e => {
      e.preventDefault();
      opToken = i.value.trim(); if(!opToken) return;
      try{ localStorage.setItem(OP_KEY, opToken); }catch{}
      cargarScraping(); render();
    };
    const p = document.createElement("p"); p.className = "note"; p.textContent = t("sc.pide");
    sec.append(p, f);
    if(scFallo) mostrarFallo(sec);
    return;
  }

  if(scFallo){ mostrarFallo(sec); botonSalir(sec); return; }
  if(!scEstado){
    const p = document.createElement("p"); p.className = "state";
    p.textContent = t("app.cargando"); sec.append(p);
    if(!scCargando) cargarScraping();
    return;
  }

  /* ── resumen ───────────────────────────────────────────────────────── */
  const comps = scEstado.competidores || [];
  const salud = comps.map(c => ({c, s: saludDe(c)}));
  const nOk   = salud.filter(x => x.s.k === "ok").length;
  const nMal  = salud.filter(x => x.s.k === "roto" || x.s.k === "avisos").length;
  const nOff  = salud.filter(x => x.s.k === "apagado").length;
  const ultima = comps.flatMap(c => c.historial || [])
    .map(h => h.started_at).sort().slice(-1)[0];
  const res = document.createElement("p"); res.className = "sub";
  res.innerHTML = t("sc.resumen", {ok:nOk, mal:nMal, off:nOff, n:comps.length,
    f: ultima ? antiguedad(ultima).full : "—"});
  sec.append(res);

  const rotos = salud.filter(x => x.s.k === "roto").length;
  if(rotos){
    const w = document.createElement("p"); w.className = "note";
    w.innerHTML = `<span class="warn">${t("sc.avisoRoto",{n:rotos})}</span>`;
    sec.append(w);
  }

  /* ── lanzar ────────────────────────────────────────────────────────── */
  const box = document.createElement("div"); box.className = "sc-lanzar";
  const selC = document.createElement("select");
  selC.setAttribute("aria-label", t("sc.thComp"));
  selC.innerHTML = `<option value="">${t("sc.todos")}</option>` +
    comps.map(c => `<option value="${c.slug}">${c.name}</option>`).join("");
  const selF = document.createElement("select");
  selF.setAttribute("aria-label", t("sc.fase"));
  selF.innerHTML = `<option value="refresh">${t("sc.refresh")}</option>` +
                   `<option value="discover">${t("sc.discover")}</option>`;
  const inL = document.createElement("input");
  inL.type = "number"; inL.min = 1; inL.max = 5000; inL.className = "sc-lim";
  inL.placeholder = "—"; inL.setAttribute("aria-label", t("sc.limite"));
  const go = document.createElement("button");
  go.className = "chip sc-go"; go.type = "button"; go.textContent = t("sc.ejecutar");
  go.onclick = async () => {
    go.disabled = true; scMensaje = null;
    try{
      const r = await scrapeApi({action:"run", slug:selC.value,
                                 phase:selF.value, limit:inL.value});
      scMensaje = {ok:true, texto: t("sc.lanzado",{q: r.lanzado.competidor + " · " + r.lanzado.phase}),
                   url: r.url};
    }catch(e){ scMensaje = {ok:false, texto:String(e.message)}; }
    finally{ go.disabled = false; render(); }
  };
  const etq = (clave, nodo) => {
    const l = document.createElement("label"); l.className = "param";
    l.innerHTML = `<span>${t(clave)}</span>`; l.append(nodo); return l;
  };
