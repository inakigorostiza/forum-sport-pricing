/* ── Creative Studio ──────────────────────────────────────────────────
   Turns a model's recommended price into a branded creative. Everything that
   spends money goes through the Edge Function `creative-studio`, behind the
   same operator token as the scraping panel; the prompt is built there, from
   the catalogue row, so a claim can only come from the data.

   The logo is composited here, on a canvas: the function hands back the
   generated still, we crop it to the channel's exact ratio, lay the official
   logo into the corner the prompt kept empty, and send the JPEG back to be
   stored. Video is then animated from that branded still. */
const CR_FORMATS = [
  {ch:"instagram", f:"feed",   label:"Instagram · feed 4:5",    aspect:"4:5",  gen:"3:4",  video:false},
  {ch:"instagram", f:"story",  label:"Instagram · story 9:16",  aspect:"9:16", gen:"9:16", video:true},
  {ch:"instagram", f:"reel",   label:"Instagram · reel 9:16",   aspect:"9:16", gen:"9:16", video:true},
  {ch:"tiktok",    f:"video",  label:"TikTok · 9:16",           aspect:"9:16", gen:"9:16", video:true},
  {ch:"youtube",   f:"video",  label:"YouTube · 16:9",          aspect:"16:9", gen:"16:9", video:true},
  {ch:"youtube",   f:"shorts", label:"YouTube · Shorts 9:16",   aspect:"9:16", gen:"9:16", video:true},
  {ch:"facebook",  f:"feed",   label:"Facebook · feed 1:1",     aspect:"1:1",  gen:"1:1",  video:true},
  {ch:"display",   f:"banner", label:"Display · banner 16:9",   aspect:"16:9", gen:"16:9", video:false},
];
const CR_GOALS = ["sale","awareness","clearance","launch"];
let crQ = "", crBrand = "", crShown = 40, crSel = null;
let crForm = {kind:"image", fmt:0, goal:"sale"};
let crJob = null;          // {id, stage, detail}
let crCost = null, crFallo = null;
let crGallery = null, crGalFiltro = "all";

async function crApi(payload, raw=false){
  const r = await fetch(`${URL_}/functions/v1/creative-studio`, {
    method:"POST",
    headers:{ apikey:ANON, Authorization:`Bearer ${ANON}`, "Content-Type":"application/json", "x-operator-token":opToken },
    body: JSON.stringify(payload),
  });
  if(raw && r.ok) return r;
  let j=null; try{ j=await r.json(); }catch{}
  if(!r.ok) throw Object.assign(new Error((j && (j.detail||j.error)) || r.status), {status:r.status, cuerpo:j});
  return j;
}

async function crLoadGallery(){
  try{
    const r = await fetch(`${URL_}/rest/v1/creatives_public?select=*&order=created_at.desc&limit=120`,
      {headers:{apikey:ANON, Authorization:`Bearer ${ANON}`}});
    crGallery = r.ok ? await r.json() : [];
  }catch{ crGallery = []; }
  if(SECCION === "creative") render();
}

const crLoad = src => new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = src; });

/* Crop to the channel's ratio and lay the real logo into the empty corner.
   The text of the logo is near-black, so on a dark corner we use the
   white-text version; red and yellow stay as they are. */
async function crBrandStill(blob, aspect){
  const img = await crLoad(URL.createObjectURL(blob));
  const [aw, ah] = aspect.split(":").map(Number);
  let w = img.naturalWidth, h = img.naturalHeight;
  let sx = 0, sy = 0;
  if(w/h > aw/ah){ const nw = Math.round(h*aw/ah); sx = Math.round((w-nw)/2); w = nw; }
  else           { const nh = Math.round(w*ah/aw); sy = Math.round((h-nh)/2); h = nh; }
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d");
  g.drawImage(img, sx, sy, w, h, 0, 0, w, h);
  const lw = Math.round(w * (aspect === "16:9" ? 0.22 : 0.30));
  const m  = Math.round(w * 0.035);
  const probe = g.getImageData(m, h - m - Math.round(lw*0.39), lw, Math.round(lw*0.39)).data;
  let lum = 0; for(let i=0; i<probe.length; i+=16) lum += 0.2126*probe[i] + 0.7152*probe[i+1] + 0.0722*probe[i+2];
  lum /= probe.length/16;
  const logo = await crLoad(lum < 110 ? "assets/fs-logo-white.png" : "assets/fs-logo.png");
  const lh = Math.round(lw * logo.naturalHeight / logo.naturalWidth);
  g.drawImage(logo, m, h - m - lh, lw, lh);
  return c.toDataURL("image/jpeg", 0.9);
}

async function crRun(row){
  crFallo = null; crCost = null;
  const fm = CR_FORMATS[crForm.fmt];
  try{
    crJob = {stage:"queued"}; render();
    const r = await crApi({action:"create", modelo:row.modelo, kind:crForm.kind, channel:fm.ch, format:fm.f,
                           goal:crForm.goal, price_rec:row.precio_rec});
    crJob = {id:r.id, stage:"still"}; render();
    while(true){
      await new Promise(z => setTimeout(z, 5000));
      const s = await crApi({action:"status", id:crJob.id});
      if(s.stage === "brand"){
        crJob.stage = "brand"; render();
        const src = await crApi({action:"source", id:crJob.id}, true);
        const jpeg = await crBrandStill(await src.blob(), fm.aspect);
        const f = await crApi({action:"finalize", id:crJob.id, jpeg});
        crJob.stage = f.stage; render();
        if(f.stage === "done") break;
        continue;
      }
      crJob.stage = s.stage; crJob.detail = s.detail; render();
      if(s.stage === "done" || s.stage === "failed") break;
    }
  }catch(e){
    crFallo = e; if(crJob) crJob.stage = "failed";
    if(e.status === 401) crForgetToken();
  }
  render(); crLoadGallery();
}

function crForgetToken(){
  opToken = ""; try{ localStorage.removeItem(OP_KEY); }catch{}
}

function crSetupNote(sec, e){
  const p = document.createElement("p"); p.className = "note";
  if(e.status === 503 && e.cuerpo && e.cuerpo.error === "higgsfield_setup") p.innerHTML = `<b>${t("cr.hfSetup")}</b><br>${t("cr.hfSetupComo")}`;
  else if(e.status === 503) p.innerHTML = `<b>${t("sc.setup")}</b><br>${t("sc.setupComo")}`;
  else if(e.status === 401) p.innerHTML = `<span class="warn">${t("sc.tokenMal")}</span>`;
  else p.innerHTML = `<span class="warn">${String(e.message)}</span>`;
  sec.append(p);
}

function seccionCreative(app){
  if(crGallery === null){ crGallery = []; crLoadGallery(); }
  const recs = recomendaciones(ROWS);
  const byModel = new Map(ROWS.map(r => [r.modelo, r]));
  let rows = recs.map(x => ({...byModel.get(x.modelo), ...x}))
    .filter(r => r.precio_rec && r.actual);
  const brands = [...new Set(rows.map(r => r.marca))].sort();
  const q = crQ.trim().toLowerCase();
  if(q) rows = rows.filter(r => (r.nombre_modelo + " " + r.marca).toLowerCase().includes(q));
  if(crBrand) rows = rows.filter(r => r.marca === crBrand);
  rows.sort((a,b) => (a.precio_rec - a.actual) - (b.precio_rec - b.actual));

  const sec = document.createElement("section"); sec.className = "card wide";
  sec.innerHTML = `<h2>${t("cr.titulo")}</h2><p class="sub">${t("cr.sub")}</p>`;
  app.append(sec);

  /* panel for the selected product */
  if(crSel !== null){
    const row = rows.find(r => r.modelo === crSel) || recs.map(x => ({...byModel.get(x.modelo), ...x})).find(r => r.modelo === crSel);
    if(row) sec.append(crPanel(row));
  }

  const bar = document.createElement("div"); bar.className = "cr-bar";
  const inp = document.createElement("input"); inp.type = "search"; inp.placeholder = t("cr.buscar"); inp.value = crQ;
  inp.setAttribute("aria-label", t("cr.buscar"));
  inp.oninput = () => { crQ = inp.value; crShown = 40; render(); document.querySelector(".cr-bar input")?.focus(); };
  const sel = document.createElement("select"); sel.setAttribute("aria-label", t("cr.todas"));
  sel.innerHTML = `<option value="">${t("cr.todas")}</option>` + brands.map(b => `<option${b===crBrand?" selected":""}>${b}</option>`).join("");
  sel.onchange = () => { crBrand = sel.value; crShown = 40; render(); };
  const cnt = document.createElement("span"); cnt.className = "f-count";
  cnt.textContent = t("cr.de", {n: nf.format(Math.min(crShown, rows.length)), t: nf.format(rows.length)});
  bar.append(inp, sel, cnt); sec.append(bar);

  const tb = document.createElement("table"); tb.className = "t-comp cr-table";
  tb.innerHTML = `<thead><tr><th>${t("g.thModelo")}</th><th>${t("cr.thAhora")}</th><th>${t("cr.thRec")}</th><th>${t("cr.thCambio")}</th><th></th></tr></thead><tbody></tbody>`;
  const body = tb.tBodies[0];
  for(const r of rows.slice(0, crShown)){
    const d = r.precio_rec - r.actual;
    const tr = document.createElement("tr");
    if(r.modelo === crSel) tr.className = "cr-on";
    tr.innerHTML = `<td class="prod-cell"><span class="prod"><img class="thumb" src="${r.img_thumb}" alt="" loading="lazy" width="46" height="46"
        onerror="this.setAttribute('data-failed','');this.removeAttribute('src')"><span class="prod-name">${r.nombre_modelo}<small>${r.marca}</small></span></span></td>
      <td>${eur2.format(r.actual)}</td><td><b>${eur2.format(r.precio_rec)}</b></td>
      <td class="${d<0?"barato":d>0?"caro":""}">${d>0?"+":""}${eur2.format(d)}</td><td></td>`;
    const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = t("cr.crear");
    b.onclick = () => { crSel = r.modelo; crJob = null; crCost = null; crFallo = null; render(); window.scrollTo({top:0, behavior:"smooth"}); };
    tr.lastElementChild.append(b); body.append(tr);
  }
  const wrap = document.createElement("div"); wrap.className = "tbl-wrap"; wrap.append(tb); sec.append(wrap);
  if(rows.length > crShown){
    const more = document.createElement("button"); more.type = "button"; more.className = "ghost"; more.textContent = t("cr.mas");
    more.onclick = () => { crShown += 40; render(); }; sec.append(more);
  }

  app.append(crGallerySection());
}

function crPanel(row){
  const box = document.createElement("div"); box.className = "cr-panel";
  const formats = CR_FORMATS.map((f,i) => ({...f, i})).filter(f => crForm.kind === "image" || f.video);
  if(!formats.some(f => f.i === crForm.fmt)) crForm.fmt = formats[0].i;
  const d = row.precio_rec - row.actual;
  box.innerHTML = `<div class="cr-prod"><img src="${row.img_thumb.replace("-200x200-f","-500x500-f")}" alt="" width="160" height="160">
      <div><p class="cr-k">${t("cr.panel")}</p><h3>${row.nombre_modelo}</h3><p class="cr-m">${row.marca}</p>
      <p class="cr-p"><s>${eur2.format(row.actual)}</s> <b>${eur2.format(row.precio_rec)}</b> <span class="${d<0?"barato":"caro"}"> ${d>0?"+":""}${eur2.format(d)}</span></p></div></div>`;
  const form = document.createElement("div"); form.className = "cr-form";
  const group = (label, html) => `<label class="param"><span>${label}</span>${html}</label>`;
  form.innerHTML =
    group(t("cr.tipo"), `<select data-k="kind"><option value="image"${crForm.kind==="image"?" selected":""}>${t("cr.imagen")}</option><option value="video"${crForm.kind==="video"?" selected":""}>${t("cr.video")}</option></select>`) +
    group(t("cr.canal"), `<select data-k="fmt">${formats.map(f => `<option value="${f.i}"${f.i===crForm.fmt?" selected":""}>${f.label}</option>`).join("")}</select>`) +
    group(t("cr.objetivo"), `<select data-k="goal">${CR_GOALS.map(g => `<option value="${g}"${g===crForm.goal?" selected":""}>${t("cr.g."+g)}</option>`).join("")}</select>`);
  form.querySelectorAll("select").forEach(s => s.onchange = () => {
    const k = s.dataset.k; crForm[k] = k === "fmt" ? Number(s.value) : s.value; crCost = null; render();
  });
  box.append(form);

  const acts = document.createElement("div"); acts.className = "cr-acts";
  const busy = crJob && !["done","failed"].includes(crJob.stage);
  if(!opToken){
    const f = document.createElement("form"); f.className = "sc-puerta";
    f.innerHTML = `<label class="param"><span>${t("sc.token")}</span></label>`;
    const i = document.createElement("input"); i.type = "password"; i.autocomplete = "off"; i.className = "sc-token";
    i.setAttribute("aria-label", t("sc.token"));
    const b = document.createElement("button"); b.className = "chip"; b.type = "submit"; b.textContent = t("sc.entrar");
    f.querySelector("label").append(i); f.append(b);
    f.onsubmit = e => { e.preventDefault(); opToken = i.value.replace(/[\s"'`]/g, ""); if(!opToken) return;
      crFallo = null; crJob = null; try{ localStorage.setItem(OP_KEY, opToken); }catch{} render(); };
    acts.append(f);
  } else {
    const est = document.createElement("button"); est.type = "button"; est.className = "ghost"; est.textContent = t("cr.estimar"); est.disabled = busy;
    est.onclick = async () => {
      crFallo = null; const fm = CR_FORMATS[crForm.fmt];
      try{
        const r = await crApi({action:"estimate", modelo:row.modelo, kind:crForm.kind, channel:fm.ch, format:fm.f, goal:crForm.goal, price_rec:row.precio_rec});
        /* Higgsfield returns a fixed estimate for video ({credits, usd} as strings)
           and only a pricing description for token-billed images. */
        const part = (o, label) => !o ? "" : o.type === "estimate"
          ? `${label}: ${Number(o.credits).toFixed(2)} cr ($${Number(o.usd).toFixed(2)})`
          : `${label}: ${t("cr.porUso")}`;
        crCost = [part(r.image, t("cr.imagen")), part(r.video, t("cr.video"))].filter(Boolean).join(" · ");
      }catch(e){ crFallo = e; if(e.status === 401) crForgetToken(); }
      render();
    };
    const gen = document.createElement("button"); gen.type = "button"; gen.className = "chip cr-go"; gen.textContent = t("cr.generar"); gen.disabled = busy;
    gen.onclick = () => crRun(row);
    const out = document.createElement("button"); out.type = "button"; out.className = "ghost"; out.textContent = t("cr.cambiarToken");
    out.onclick = () => { crForgetToken(); crFallo = null; crJob = null; render(); };
    acts.append(est, gen, out);
  }
  const close = document.createElement("button"); close.type = "button"; close.className = "ghost"; close.textContent = t("cr.cerrar");
  close.onclick = () => { crSel = null; crJob = null; crCost = null; crFallo = null; render(); };
  acts.append(close);
  box.append(acts);

  if(crCost){ const p = document.createElement("p"); p.className = "note"; p.textContent = t("cr.coste", {c: crCost}); box.append(p); }
  if(crJob){
    const p = document.createElement("p"); p.className = "cr-status" + (crJob.stage === "failed" ? " warn" : "");
    p.setAttribute("role","status");
    const why = crFallo ? crFallo.message : (crJob.detail || "");
    p.textContent = crJob.stage !== "failed" ? t("cr.st."+crJob.stage)
      : /not_enough_credits/.test(why) ? t("cr.sinSaldo")
      : /unauthorized/.test(why) ? t("cr.tokenMal") : t("cr.st.failed", {d: why});
    box.append(p);
  }
  if(crFallo && !crJob) crSetupNote(box, crFallo);
  const note = document.createElement("p"); note.className = "note"; note.textContent = t("cr.reglas"); box.append(note);
  return box;
}

    const fig = document.createElement("figure"); fig.className = "cr-card";
    const media = g.video_url
      ? `<div class="cr-vid"><video src="${g.video_url}" poster="${g.image_url}" controls muted playsinline loop preload="none"></video><img class="cr-wm" src="assets/fs-logo-white.png" alt=""></div>`
      : `<img src="${g.image_url}" alt="${g.marca} ${g.nombre_modelo}" loading="lazy">`;
    const fm = CR_FORMATS.find(f => f.ch === g.channel && f.f === g.format);
    fig.innerHTML = `${media}<figcaption><b>${g.nombre_modelo}</b> · ${g.marca}<br>
      <s>${eur2.format(g.price_now)}</s> <span class="cr-rec">${eur2.format(g.price_rec)}</span><br>
      <small>${fm ? fm.label : g.channel} · ${t("cr.g."+g.goal)} · ${g.kind === "video" ? t("cr.video") : t("cr.imagen")}</small>
      <a href="${g.video_url || g.image_url}" download target="_blank" rel="noopener">${t("cr.descargar")}</a></figcaption>`;
    grid.append(fig);
  }
  sec.append(grid);
  return sec;
}

/* La navegación de secciones. Patrón de pestañas completo —roles, aria-selected
   y flechas— porque es exactamente lo que es: un grupo de paneles excluyentes
   sobre los mismos datos filtrados. */
function pintarNav(){
  const nav = document.getElementById("nav");
  nav.setAttribute("aria-label", t("nav.aria"));
  nav.innerHTML = "";
  const lista = document.createElement("div");
  lista.className = "sec-lista"; lista.setAttribute("role", "tablist");
  SECCIONES.forEach((k, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "sec"; b.id = "tab-" + k;
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(k === SECCION));
    // Una sola pestaña en el orden de tabulación: dentro del grupo se navega
    // con las flechas, que es lo que un lector de pantalla espera aquí.
    b.tabIndex = k === SECCION ? 0 : -1;
    b.innerHTML = `<span class="sec-n">${i+1}</span>
      <span class="sec-txt"><span class="sec-tit">${t("nav."+k)}</span>
      <span class="sec-sub">${t("nav."+k+"Sub")}</span></span>`;
    b.onclick = () => ir(k);
    b.onkeydown = e => {
      const d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
      if(!d) return;
      e.preventDefault();
      const j = (SECCIONES.indexOf(k) + d + SECCIONES.length) % SECCIONES.length;
      ir(SECCIONES[j]);
      document.getElementById("tab-" + SECCIONES[j])?.focus();
    };
    lista.append(b);
  });
  nav.append(lista);
  const app = document.getElementById("app");
  app.setAttribute("aria-labelledby", "tab-" + SECCION);
}
function ir(k){
  if(k === SECCION) return;
  SECCION = k;
  // El hash es el estado: replaceState dejaría el botón Atrás sin nada que hacer.
  location.hash = k;
  render();
  // Volver arriba: cambiar de sección a mitad de una tabla deja al lector
  // mirando el pie de otra cosa.
  scrollTo({top:0, behavior:"smooth"});
}

/* ── cadenas fuera de #app ────────────────────────────────────────────
   render() reconstruye #app entero, así que todo lo que vive dentro se
   traduce solo. La cabecera y el pie no: se repintan aquí, desde la misma
   tabla T, para que no queden dos fuentes de texto. */
function pintarEstaticos(){
  document.documentElement.lang = LANG;
  document.querySelector("h1.tool").textContent = t("app.titulo");
  document.querySelector(".live").innerHTML = `<span class="pulse"></span> ${t("app.vivo")}`;
  const th = document.getElementById("theme");
  th.textContent = t("app.tema"); th.setAttribute("aria-label", t("app.temaAria"));
  const lg = document.getElementById("lang");
  lg.setAttribute("aria-label", t("app.idioma"));
  lg.querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  document.getElementById("pie").innerHTML = t("app.pie");

  const meta = document.getElementById("meta");
  if(ROWS.length){
    meta.innerHTML = t("app.meta",{
      modelos: nf.format(ROWS.length),
      skus:    nf.format(ROWS.reduce((s,r)=>s+r.num_skus,0)),
      marcas:  nf.format(new Set(ROWS.map(r=>r.brand_code)).size)});
  } else {
    meta.innerHTML = `<span>${t("app.cargando")}</span>`;
  }
  const st = document.getElementById("state");
  if(st && !st.classList.contains("err")) st.textContent = t("app.conectando");
}

document.getElementById("lang").addEventListener("click", e => {
  const b = e.target.closest("button[data-lang]");
  if(!b || b.dataset.lang === LANG) return;
  LANG = b.dataset.lang;
  try{ localStorage.setItem("fs-lang", LANG); }catch{}
  // Los formateadores PRIMERO: pintarEstaticos() ya los usa para el contador
  // de modelos, y render() los usa en cada cifra de la página.
  formatos();
  pintarEstaticos();
  if(ROWS.length) render();
});

/* ── boot ─────────────────────────────────────────────────────────────── */
pintarEstaticos();
(async () => {
  try{
    const [rows_, comp_, hist_] =
      await Promise.all([load(), loadComparison(), loadHistoria(null, null)]);
    ROWS = rows_; COMP = comp_; HIST = hist_;
    pintarEstaticos();
    render();
  }catch(e){
    document.getElementById("state").className="state err";
    document.getElementById("state").textContent=t("app.error")+e.message;
    console.error(e);
  }
})();
</script>
</body>
