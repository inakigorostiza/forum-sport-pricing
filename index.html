/* ── render ───────────────────────────────────────────────────────────── */
function render(){
  const rows=filtered(), app=document.getElementById("app");
  // Capture focus BEFORE wiping: clearing the DOM fires the outgoing input's
  // blur handler, so any flag it maintains is already stale by the time the new
  // row is built.
  const active = document.activeElement;
  const keepFocus = !!(active && active.classList && active.classList.contains("search-in"));
  const caret = keepFocus ? (active.selectionStart ?? active.value.length) : 0;
  app.innerHTML="";

  /* filters ---------------------------------------------------------- */
  const marcas = [...new Map(ROWS.map(r=>[r.brand_code, r.marca])).entries()]
    .map(([code,name])=>({value:code, label:name,
                          count:ROWS.filter(r=>r.brand_code===code).length}))
    .sort((a,b)=>a.label.localeCompare(b.label,"es"));
  const tipos = [...new Set(ROWS.map(r=>r.tipo_producto))].sort()
    .map(t=>({value:t, label:t[0].toUpperCase()+t.slice(1),
              count:ROWS.filter(r=>r.tipo_producto===t).length}));
  const competidores = [...new Set(COMP.map(c=>c.competidor))].sort()
    .map(n=>({value:n, label:n,
              count:new Set(COMP.filter(c=>c.competidor===n).map(c=>c.modelo)).size}));

  const f = document.createElement("div"); f.className="filters";
  const lab = document.createElement("span"); lab.className="f-lab"; lab.textContent="Filtrar";
  f.append(lab);
  const sb = searchBox(ROWS, render);
  f.append(sb.root);
  f.append(multiSelect({label:"Marca", options:marcas,
                        selected:F.marcas, onChange:render}));
  f.append(multiSelect({label:"Tipo", options:tipos,
                        selected:F.tipos, onChange:render}));
  if(competidores.length)
    f.append(multiSelect({label:"Competidor", options:competidores,
                          selected:F.competidores, onChange:render}));

  /* Period presets. Date range first — it is the control a reader reaches for
     before any dimension. It is also the only filter that refetches, because
     every other one is a pure function of data already in the browser. */
  const per=document.createElement("span"); per.className="periodo";
  const pl=document.createElement("span"); pl.className="f-lab"; pl.textContent="Periodo";
  per.append(pl);
  const hoy=new Date();
  const iso=d=>d.toISOString().slice(0,10);
  const presets=[["7 d",7],["30 d",30],["90 d",90],["Todo",null]];
  for(const [etq,dd] of presets){
    const b=document.createElement("button");
    b.className="chip"; b.type="button"; b.textContent=etq;
    const desde = dd===null ? null : iso(new Date(hoy.getTime()-dd*86400000));
    b.setAttribute("aria-pressed", String(F.desde===desde));
    b.onclick=async()=>{
      F.desde=desde; F.hasta=null;
      b.disabled=true; app.style.opacity=".55";
      HIST = await loadHistoria(F.desde, F.hasta);
      app.style.opacity=""; render();
    };
    per.append(b);
  }
  f.append(per);

  const btnRebaja=document.createElement("button");
  btnRebaja.className="chip"; btnRebaja.type="button"; btnRebaja.textContent="Solo en rebaja";
  btnRebaja.setAttribute("aria-pressed", String(F.rebaja));
  btnRebaja.onclick=()=>{F.rebaja=!F.rebaja; render();};
  f.append(btnRebaja);

  /* The eight catalogue dimensions. They live behind a disclosure because the
     filter bar is sticky: eleven dropdowns in one row would wrap to three lines
     and park a wall across the top of the page. Collapsed, the summary carries
     the number of active ones so nothing is hidden silently. */
  const dimBox = document.createElement("details"); dimBox.className="dims";
  const activos = DIMS.reduce((n,dm)=>n+(F[dm.k].size?1:0),0);
  if(activos) dimBox.open = true;
  const sum = document.createElement("summary");
  sum.textContent = "Más filtros";
  if(activos){ const b=document.createElement("span"); b.className="n";
               b.textContent=String(activos); sum.append(b); }
  dimBox.append(sum);
  const dimRow = document.createElement("div"); dimRow.className="dim-row";
  for(const dm of DIMS){
    const counts = new Map();
    for(const r of ROWS){ const v=dimVal(r,dm.campo); counts.set(v,(counts.get(v)||0)+1); }
    const options = [...counts.entries()]
      .map(([value,count])=>({value, label:dm.fmt(value), count}))
      .sort(dm.sort || ((a,b)=>a.label.localeCompare(b.label,"es")));
    dimRow.append(multiSelect({label:dm.label, options,
                               selected:F[dm.k], onChange:render}));
  }
  dimBox.append(dimRow);

  const btnClear=document.createElement("button");
  btnClear.className="ghost"; btnClear.type="button"; btnClear.textContent="Limpiar";
  btnClear.onclick=()=>{F.q=""; F.marcas.clear(); F.tipos.clear(); F.competidores.clear();
                        F.rebaja=false; DIMS.forEach(dm=>F[dm.k].clear()); render();};
  f.append(btnClear);

  const cnt=document.createElement("span"); cnt.className="f-count";
  cnt.innerHTML=`<b>${nf.format(rows.length)}</b> de ${nf.format(ROWS.length)} modelos`;
  f.append(cnt);
  f.append(dimBox);
  app.append(f);

  // Park the sticky table headers directly under the filter bar. Measured
  // rather than hard-coded: the bar wraps to two lines on narrow screens.
  requestAnimationFrame(()=>{
    const h = f.getBoundingClientRect().height;
    if(h) document.documentElement.style.setProperty("--filters-h", `${Math.round(h)}px`);
  });

  // The row above was just rebuilt, so the input the user is typing in is a new
  // element. Restore focus and caret, or every keystroke would drop the cursor.
  if(keepFocus){
    sb.input.focus();
    try{ sb.input.setSelectionRange(caret, caret); }catch{}
    sb.paint();
  }

  if(!rows.length){
    app.insertAdjacentHTML("beforeend",
      `<div class="state">Ningún modelo cumple estos filtros${
        F.q?` · búsqueda «${F.q}»`:""}.</div>`); return;
  }

  /* hero + kpis · Forum Sport frente a la competencia ------------------ */
  // Compared at MODEL level against the cheapest rival for that model, so a
  // product watched at three shops counts once, not three times.
  const ids0 = new Set(rows.map(r=>r.modelo));
  const barato = new Map();
  for(const c of COMP){
    if(!ids0.has(c.modelo)) continue;
    if(!F.competidores.size || F.competidores.has(c.competidor)){
      const prev = barato.get(c.modelo);
      if(!prev || c.precio_comp < prev.precio_comp) barato.set(c.modelo, c);
    }
  }
  const vs        = [...barato.values()];
  const esIgual   = x => Math.abs(x.delta_eur) < 0.005;
  const caros     = vs.filter(x=>!esIgual(x) && x.delta_eur > 0);
  const baratos   = vs.filter(x=>!esIgual(x) && x.delta_eur < 0);
  const iguales0  = vs.filter(esIgual);
  const rivales   = new Set(vs.map(x=>x.competidor)).size;
  const gapMedio  = vs.length ? vs.reduce((s,x)=>s+x.delta_pct,0)/vs.length : 0;
  const peor      = vs.length ? vs.reduce((a,b)=>b.delta_pct>a.delta_pct?b:a) : null;

  const hero=document.createElement("div"); hero.className="hero";
  if(vs.length){
    const pctCaros = caros.length/vs.length*100;
    hero.innerHTML=`<p class="hero-fig">${nf1.format(pctCaros)} %</p>
      <div class="hero-cap">
        <p class="lede">de los modelos comparados son más caros en Forum Sport
        que en el competidor más barato.</p>
        <p>Sobre <strong>${nf.format(vs.length)}</strong> modelos con precio observado en
        <strong>${nf.format(rivales)}</strong> competidor${rivales===1?"":"es"}, la diferencia media es de
        <strong>${gapMedio>0?"+":""}${nf1.format(gapMedio)} %</strong>${peor&&peor.delta_pct>0?
        ` y la mayor brecha es <strong>${peor.nombre_modelo}</strong>, ${nf1.format(peor.delta_pct)} %
        por encima de ${peor.competidor}`:""}. Ahí es donde una calculadora de precio dinámico
        tiene margen para actuar.</p>
      </div>`;
  } else {
    // Nothing crawled for this slice: fall back to the catalogue story.
    const pctReb0 = rows.filter(r=>r.en_rebaja).length/rows.length*100;
    hero.innerHTML=`<p class="hero-fig">${nf1.format(pctReb0)} %</p>
      <div class="hero-cap">
        <p class="lede">de los modelos se venden por debajo de su PVP.</p>
        <p>Todavía no hay precios de competencia para este filtro, así que la
        comparativa no puede calcularse sobre esta selección.</p>
      </div>`;
  }
  app.append(hero);

  const reb=rows.filter(r=>r.en_rebaja);
  const share = n => vs.length ? pct(n/vs.length*100) : "—";
  const kpis = vs.length ? [
    ["Modelos comparados", nf.format(vs.length),
     `${pct(vs.length/rows.length*100)} del catálogo filtrado`],
    ["Competidores", nf.format(rivales), "con precio observado"],
    ["Más caros", nf.format(caros.length), share(caros.length)],
    ["Más baratos", nf.format(baratos.length), share(baratos.length)],
    ["Mismo precio", nf.format(iguales0.length), share(iguales0.length)],
    ["Diferencia media", `${gapMedio>0?"+":""}${nf1.format(gapMedio)} %`,
     "frente al más barato"],
  ] : [
    ["Modelos", nf.format(rows.length), `${nf.format(rows.reduce((s,r)=>s+r.num_skus,0))} SKU`],
    ["Marcas", nf.format(new Set(rows.map(r=>r.brand_code)).size), "en el catálogo"],
    ["PVP medio", eur.format(avg(rows,r=>r.precio)), "precio de tarifa"],
    ["Precio medio real", eur.format(avg(rows,r=>r.precio_rebaja)), "tras rebaja"],
    ["Descuento medio", reb.length?pct(avg(reb,r=>r.descuento_pct)):"—", "de los rebajados"],
    ["Margen medio", pct(avg(rows,r=>r.margen)*100), "sintético"],
  ];
  const k=document.createElement("div"); k.className="kpis";
  // Money, and only money, wears the brand's price face.
  const money = v => /€/.test(String(v)) ? " money" : "";
  k.innerHTML=kpis.map(([l,v,sub])=>
    `<div class="kpi"><p class="k-label">${l}</p><p class="k-val${money(v)}">${v}</p><p class="k-sub">${sub}</p></div>`).join("");
  app.append(k);

  // The catalogue figures the competitive view replaced, kept as a second row:
  // they are the context for every chart below.
  const cat=document.createElement("div"); cat.className="kpis kpis-sec";
  cat.innerHTML=[
    ["Modelos", nf.format(rows.length), `${nf.format(rows.reduce((s,r)=>s+r.num_skus,0))} SKU`],
    ["PVP medio", eur.format(avg(rows,r=>r.precio)), "precio de tarifa"],
    ["Precio medio real", eur.format(avg(rows,r=>r.precio_rebaja)), "tras rebaja"],
    ["En rebaja", pct(reb.length/rows.length*100), `${nf.format(reb.length)} modelos`],
    ["Margen medio", pct(avg(rows,r=>r.margen)*100), "sintético"],
    ["Stock bajo o muy bajo",
     pct(rows.filter(r=>r.nivel_stock==="muy bajo"||r.nivel_stock==="bajo").length/rows.length*100),
     "del catálogo"],
  ].map(([l,v,sub])=>
    `<div class="kpi"><p class="k-label">${l}</p><p class="k-val${money(v)}">${v}</p><p class="k-sub">${sub}</p></div>`).join("");
  if(vs.length) app.append(cat);

  const grid=document.createElement("div"); grid.className="grid"; app.append(grid);

  /* 0 · POSICIONAMIENTO ONLINE % en el tiempo --------------------------
     La métrica que pide Forum Sport: nuestro precio dividido por el del
     competidor de referencia (para el MVP, el más barato encontrado). */
  {
    const pts = serieDiaria(rows);
    const sec = document.createElement("section"); sec.className="card wide";
    const dias = pts.length;
    const conDato = pts.filter(p=>p.v!=null);
    // The headline quotes the last day with a basket worth quoting.
    const solidos = conDato.filter(p=>!p.flojo);
    const ultimo  = (solidos.length?solidos:conDato).slice(-1)[0];
    const colaFloja = conDato.length && conDato[conDato.length-1].flojo
                    ? conDato[conDato.length-1] : null;
    let sub = dias
      ? `Nuestro precio frente al del competidor más barato, <b>un modelo = un dato</b> — `
        + `la misma base que la «diferencia media» de arriba, que es este mismo número `
        + `menos 100. 100 % es paridad; por encima somos más caros. `
        + `Último dato ${ultimo?ultimo.k:"—"}: <b>${nf1.format(ultimo?ultimo.v:0)} %</b>.`
      : `Todavía no hay histórico para los filtros seleccionados.`;
    if(dias && dias < 14)
      sub += ` <span class="warn">Solo ${dias} ${dias===1?"día":"días"} de histórico: `
           + `todavía no hay tendencia que leer.</span>`;
    if(colaFloja)
      sub += ` <span class="warn">El ${colaFloja.k} solo se rastrearon `
           + `${nf.format(colaFloja.n)} modelos, muy por debajo del resto: ese punto `
           + `aparece hueco y no se usa como último dato.</span>`;
    if(!HIST_COMPLETO)
      sub += ` <span class="warn">Rango amplio: se ha descargado solo el rival más `
           + `barato de cada día, así que el filtro de competidor no cambia la referencia.</span>`;
    sec.innerHTML = `<h2>Posicionamiento online %</h2><p class="sub">${sub}</p>`;

    if(dias){
      sec.append(line(pts,{baseline:100}));
      // The basket changes from day to day, so say so where it is measurable
      // rather than letting the line imply a stability it does not have.
      const nMin=Math.min(...pts.map(p=>p.n)), nMax=Math.max(...pts.map(p=>p.n));
      if(nMax && nMin !== nMax){
        const nota=document.createElement("p"); nota.className="note";
        nota.textContent=`La cesta comparada varía entre ${nf.format(nMin)} y `
          +`${nf.format(nMax)} modelos según el día; parte del movimiento es cobertura, `
          +`no precio. El tooltip lleva el número de modelos de cada fecha.`;
        sec.append(nota);
      }
      const tbl=tableFor(["Fecha","Posicionamiento","Mediana","Modelos","Competidores"],
        pts.filter(p=>p.v!=null).map(p=>[p.fecha, nf1.format(p.v)+" %",
          nf1.format(p.mediana)+" %", nf.format(p.n), nf.format(p.comps)]));
      const det=document.createElement("details");
      det.innerHTML="<summary>Ver los datos como tabla</summary>"; det.append(tbl);
      sec.append(det);
    }
    grid.append(sec);
  }

  /* 1 · Posición de precio frente a la competencia ----------------------
     Distribución de los modelos comparados según cuánto nos separamos del
     competidor más barato. Divergente y centrada en la paridad: a la izquierda
     somos más baratos, a la derecha más caros, y la altura dice cuántos
     modelos hay en cada situación. */
  if(COMP.length){
    const ids1 = new Set(rows.map(r=>r.modelo));
    const mejor = new Map();
    for(const c of COMP){
      if(!ids1.has(c.modelo)) continue;
      if(F.competidores.size && !F.competidores.has(c.competidor)) continue;
      const prev = mejor.get(c.modelo);
      if(!prev || c.precio_comp < prev.precio_comp) mejor.set(c.modelo, c);
    }
    const vs1 = [...mejor.values()];

    const BANDAS = [
      {k:"−20 % o más", lo:-1e9, hi:-20,  c:"var(--dv-c3)"},
      {k:"−20 a −10 %", lo:-20,  hi:-10,  c:"var(--dv-c2)"},
      {k:"−10 a −2 %",  lo:-10,  hi:-2,   c:"var(--dv-c1)"},
      {k:"±2 % igual",  lo:-2,   hi:2,    c:"var(--dv-mid)"},
      {k:"+2 a +10 %",  lo:2,    hi:10,   c:"var(--dv-d1)"},
      {k:"+10 a +20 %", lo:10,   hi:20,   c:"var(--dv-d2)"},
      {k:"+20 % o más", lo:20,   hi:1e9,  c:"var(--dv-d3)"},
    ];
    const items = BANDAS.map(b=>{
      const inB = vs1.filter(x=>x.delta_pct >= b.lo && x.delta_pct < b.hi);
      return {k:b.k, v:inB.length, c:b.c,
              note:inB.length
                ? `<span class="t-k">${inB.length===1?"modelo":"modelos"}:</span> ${nf.format(inB.length)}`
                  + `<br><span class="t-k">ejemplo:</span> ${inB[0].nombre_modelo}`
                : ""};
    });

    const c = document.createElement("section"); c.className="card wide";
    if(!vs1.length){
      c.innerHTML=`<h2>Posición de precio</h2>
        <p class="sub">Ningún modelo del filtro actual tiene precio de competencia.</p>`;
      grid.append(c);
    } else {
      const baratos = vs1.filter(x=>x.delta_pct < -2).length;
      const igual   = vs1.filter(x=>x.delta_pct >= -2 && x.delta_pct < 2).length;
      const caros   = vs1.filter(x=>x.delta_pct >= 2).length;
      c.innerHTML=`<h2>Posición de precio frente a la competencia</h2>
        <p class="sub">Cada modelo comparado con el competidor más barato que lo vende.
        A la izquierda ganamos, a la derecha perdemos.
        <strong>${nf.format(baratos)}</strong> más baratos ·
        <strong>${nf.format(igual)}</strong> al mismo precio ·
        <strong>${nf.format(caros)}</strong> más caros de ${nf.format(vs1.length)}.</p>`;
      const box=document.createElement("div");
      const leg=document.createElement("div"); leg.className="legend";
      leg.innerHTML=`<span><i class="swatch" style="background:var(--dv-c2)"></i>Somos más baratos</span>
        <span><i class="swatch" style="background:var(--dv-mid)"></i>Mismo precio (±2 %)</span>
        <span><i class="swatch" style="background:var(--dv-d2)"></i>Somos más caros</span>`;
      box.append(leg, columns(items, {colorOf:d=>d.c, unit:"modelos", rotate:true}));
      c.append(box);
      c.append(...[tableFor(["Diferencia frente al más barato","Modelos","% del comparado"],
        items.map(d=>[d.k, nf.format(d.v),
                      nf1.format(vs1.length?d.v/vs1.length*100:0)+" %"]))].map(t=>{
        const det=document.createElement("details");
        det.innerHTML="<summary>Ver los datos como tabla</summary>"; det.append(t); return det;}));
      grid.append(c);
    }
  }

  /* 2 · Frente a la competencia ------------------------------------------ */
  if(COMP.length){
    const ids = new Set(rows.map(r=>r.modelo));
    // Three states, not two: an identical price is a match, not a narrow win.
    // Compared on cents to avoid float noise making 0,00 € look like a win.
    const comp = COMP
      // Respect the competitor filter here too: picking "Nike" should show
      // Nike's prices, not every price for the models Nike happens to carry.
      .filter(c=>ids.has(c.modelo) &&
                 (!F.competidores.size || F.competidores.has(c.competidor)))
      .map(c=>{
        const eq = Math.abs(c.delta_eur) < 0.005;
        return {...c, eq, edad: antiguedad(c.observed_at),
          cls:   eq ? "delta-eq" : (c.delta_eur>0 ? "delta-up" : "delta-dn"),
          badge: eq ? "igual"    : (c.somos_mas_baratos ? "barato" : "caro"),
          label: eq ? "igual"    : (c.somos_mas_baratos ? "más barato" : "más caro")};
      })
      .sort((a,b)=>b.delta_pct-a.delta_pct);
    // Group by model, worst gap first, and within a model cheapest rival first.
    const order = [...new Map(comp.map(c=>[c.modelo, c])).keys()];
    const rank = new Map(order.map((m,i)=>[m,i]));
    comp.sort((a,b)=> rank.get(a.modelo)-rank.get(b.modelo)
                   || a.precio_comp-b.precio_comp);
    const seen = new Set();
    comp.forEach(c=>{ c.first = !seen.has(c.modelo); seen.add(c.modelo); });
    const nComp = new Map();
    comp.forEach(c=>nComp.set(c.modelo,(nComp.get(c.modelo)||0)+1));
    comp.forEach(c=>{ c.rivals = nComp.get(c.modelo); });
    // The star marks the cheapest price for that product across us AND every
    // rival — so it answers "who is actually cheapest", not "which rival is".
    const mejorComp = new Map();
    comp.forEach(c=>{
      const prev = mejorComp.get(c.modelo);
      if(prev === undefined || c.precio_comp < prev) mejorComp.set(c.modelo, c.precio_comp);
    });
    comp.forEach(c=>{
      const mc = mejorComp.get(c.modelo);
      c.fsGana   = c.precio_fs <= mc;                              // we are cheapest
      c.compGana = !c.fsGana && Math.abs(c.precio_comp - mc) < 0.005; // this rival is
    });
    const c = document.createElement("section"); c.className="card wide";
    if(!comp.length){
      c.innerHTML=`<h2>Frente a la competencia</h2>
        <p class="sub">Ningún modelo del filtro actual tiene todavía datos de competencia.</p>`;
      grid.append(c); 
    } else {
      const caros   = comp.filter(x=>!x.eq && !x.somos_mas_baratos).length;
      const iguales = comp.filter(x=>x.eq).length;
      const modelos = new Set(comp.map(x=>x.modelo)).size;
      const multi   = [...nComp.values()].filter(v=>v>1).length;
      const fuentes = [...new Set(comp.map(x=>x.competidor))];
      const fecha = new Date(Math.max(...comp.map(x=>+new Date(x.observed_at))));
      c.innerHTML=`<h2>Frente a la competencia</h2>
        <p class="sub">${nf.format(modelos)} modelos · ${nf.format(comp.length)} precios observados en
        ${fuentes.join(", ")}. Somos más caros en <strong>${nf.format(caros)}</strong>
        de ${nf.format(comp.length)}${iguales?`, igualamos el precio en <strong>${nf.format(iguales)}</strong>`:""}${
        multi?` · ${nf.format(multi)} modelos tienen más de un competidor`:""}.
        Ordenado por mayor diferencia en contra.</p>`;
      const t=document.createElement("table");
      t.innerHTML=`<thead><tr><th>Modelo</th><th>Forum Sport</th><th>Competencia</th>
        <th>Dif.</th><th>Dif. %</th><th>Posición</th><th>Competidor</th>
        <th>Actualizado</th></tr></thead>
        <tbody>${comp.map(x=>`<tr class="${x.eq?"igual-row ":""}${x.first?"grp-start":"grp-cont"}">
          ${x.first ? `<td class="prod-cell"><span class="prod">
            <img class="thumb" src="${x.img_thumb}" alt="" loading="lazy" decoding="async"
                 width="46" height="46"
                 onerror="this.setAttribute('data-failed','');this.removeAttribute('src')">
            <span class="prod-name">
              <a href="${x.url_fs}" target="_blank" rel="noopener">${x.nombre_modelo}</a>
              <small>${x.marca}${x.rivals>1?` · ${x.rivals} competidores`:""}</small>
            </span></span></td>`
          : `<td class="prod-cell cont-mark">↳</td>`}
          <td class="${x.first&&x.fsGana?"best":""}">${x.first
            ? `${x.fsGana?'<span class="star" title="Precio más bajo">★</span>':""}${eur2.format(x.precio_fs)}`
            : ""}</td>
          <td class="${x.compGana?"best":""}">${x.compGana
            ? '<span class="star" title="Precio más bajo">★</span>':""}<a href="${x.url_comp}"
            target="_blank" rel="noopener">${eur2.format(x.precio_comp)}</a></td>
          <td class="${x.cls}">${x.eq?"":(x.delta_eur>0?"+":"")}${eur2.format(x.delta_eur)}</td>
          <td class="${x.cls}">${x.eq?"":(x.delta_pct>0?"+":"")}${nf1.format(x.delta_pct)} %</td>
          <td><span class="badge ${x.badge}">${x.label}</span></td>
          <td><a href="${x.url_comp}" target="_blank" rel="noopener"
                 title="Ver ${x.nombre_modelo} en ${x.competidor}">${x.competidor}</a></td>
          <td class="edad${x.edad.stale?" stale":""}" title="${x.edad.full}">${x.edad.txt}</td></tr>`).join("")}</tbody>`;
      const w=document.createElement("div"); w.className="t-wrap"; w.append(t);
      c.append(w);
      const note=document.createElement("p"); note.className="comp-note";
      note.textContent=`★ marca el precio más bajo de cada producto, contando el nuestro. `
        + `Precio más bajo observado por competidor. Última lectura: `
        + fecha.toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"})
        + `. El precio de la competencia enlaza a su ficha.`;
      c.append(note);
      grid.append(c);
    }
  }

  /* 3 · Modelos por marca ------------------------------------------------ */
  {
    const m=[...by(rows,r=>r.marca).entries()].sort((a,b)=>b[1]-a[1]);
    const top=m.slice(0,12).map(([k,v])=>({k,v}));
    const rest=m.slice(12).reduce((s,[,v])=>s+v,0);
    if(rest) top.push({k:"Otras marcas",v:rest,note:`<span class="t-k">${m.length-12} marcas agrupadas</span>`});
    grid.append(card("Modelos por marca",
      m.length>12?`Las 12 marcas con más modelos; el resto se agrupa en «Otras».`:"Marcas del catálogo.",
      hbar(top),
      tableFor(["Marca","Modelos"], m.map(([k,v])=>[k,nf.format(v)]))));
  }

  /* 4 · Bandas de precio ------------------------------------------------- */
  {
    const items=BANDS.map(([lo,hi,k])=>({k,v:rows.filter(r=>r.precio>=lo&&r.precio<hi).length}))
      .filter(d=>d.v);
    grid.append(card("Distribución por banda de precio",
      "Modelos según su PVP de tarifa, en euros.",
      columns(items),
      tableFor(["Banda (€)","Modelos"], items.map(d=>[d.k,nf.format(d.v)]))));
  }

  /* 5 · Nivel de margen (ordinal ramp) ----------------------------------- */
  {
    const items=ORD_MARGEN.map(k=>({k,v:rows.filter(r=>r.nivel_margen===k).length}))
      .filter(d=>d.v);
    const idx=k=>ORD_MARGEN.indexOf(k);
    grid.append(card("Nivel de margen",
      "Escala ordenada de menor a mayor margen sintético.",
      hbar(items,{colorOf:d=>RAMP4[idx(d.k)]}),
      tableFor(["Nivel","Modelos","% del total"],
        items.map(d=>[d.k,nf.format(d.v),nf1.format(d.v/rows.length*100)+" %"]))));
  }

  /* 6 · Nivel de stock (ordinal ramp) ------------------------------------ */
  {
    const items=ORD_STOCK.map(k=>({k,v:rows.filter(r=>r.nivel_stock===k).length}))
      .filter(d=>d.v);
    const idx=k=>ORD_STOCK.indexOf(k);
    grid.append(card("Nivel de stock",
      "Escala ordenada de menor a mayor cobertura de almacén.",
      hbar(items,{colorOf:d=>RAMP5[idx(d.k)]}),
      tableFor(["Nivel","Modelos","% del total"],
        items.map(d=>[d.k,nf.format(d.v),nf1.format(d.v/rows.length*100)+" %"]))));
  }

  /* 7 · Running vs trail ------------------------------------------------- */
  {
    const items=[...by(rows,r=>r.tipo_producto).entries()]
      .sort((a,b)=>b[1]-a[1])
      .map(([k,v],i)=>({k:k[0].toUpperCase()+k.slice(1),v,
        c:i?"var(--s2)":"var(--s1)", ink:i?"on-light":"on-dark"}));
    const leg=document.createElement("div"); leg.className="legend";
    leg.innerHTML=items.map(d=>`<span><i class="swatch" style="background:${d.c}"></i>${d.k}</span>`).join("");
    const box=document.createElement("div"); box.append(leg,stacked(items));
    grid.append(card("Running y trail","Reparto del catálogo por tipo de producto.", box,
      tableFor(["Tipo","Modelos","% del total"],
        items.map(d=>[d.k,nf.format(d.v),nf1.format(d.v/rows.length*100)+" %"])), true));
  }

  /* 8 · Catálogo paginado ------------------------------------------------ */
  {
    // The whole filtered slice, not a top-N: paging is what makes 1.483 rows
    // browsable. Still ordered by discount, so the head of the table is the
    // same "mayores descuentos" view it replaces.
    const all=[...rows].sort((a,b)=>
      b.descuento_pct-a.descuento_pct || a.nombre_modelo.localeCompare(b.nombre_modelo,"es"));
    let per=12, page=0;
    const pages=()=>Math.max(1,Math.ceil(all.length/per));

    const row=r=>`<tr>
      <td class="prod-cell"><span class="prod">
        <img class="thumb" src="${r.img_thumb}" alt="" loading="lazy" decoding="async"
             width="46" height="46"
             onerror="this.setAttribute('data-failed','');this.removeAttribute('src')">
        <span class="prod-name">
          <a href="${r.url}" target="_blank" rel="noopener">${r.nombre_modelo}</a>
          <small>${r.marca}${r.outlet?'<span class="tag">outlet</span>':""}</small>
        </span></span></td>
      <td>${eur2.format(r.precio)}</td>
      <td>${r.en_rebaja?eur2.format(r.precio_rebaja):"—"}</td>
      <td>${r.en_rebaja?`<b>${nf1.format(r.descuento_pct)} %</b>`:'<span class="t-k">—</span>'}</td>
      <td>${eur2.format(r.precio_rebaja*(1-r.margen))}</td>
      <td>${r.nivel_stock}</td></tr>`;

    const t=document.createElement("table");
    t.innerHTML=`<thead><tr><th>Modelo</th><th>PVP</th><th>Precio</th>
      <th>Dto.</th><th>Neto</th><th>Stock</th></tr></thead><tbody></tbody>`;
    const tbody=t.querySelector("tbody");

    const pager=document.createElement("div"); pager.className="pager";
    pager.innerHTML=`
      <button class="pg" data-go="first" type="button" aria-label="Primera página">«</button>
      <button class="pg" data-go="prev"  type="button" aria-label="Página anterior">‹</button>
      <span class="of" aria-hidden="true"></span>
      <button class="pg" data-go="next"  type="button" aria-label="Página siguiente">›</button>
      <button class="pg" data-go="last"  type="button" aria-label="Última página">»</button>
      <span class="range grow" role="status" aria-live="polite"></span>
      <label class="range" for="per">Por página</label>
      <select id="per" aria-label="Filas por página">
        <option value="12">12</option><option value="25">25</option>
        <option value="50">50</option><option value="100">100</option>
      </select>`;
    const of=pager.querySelector(".of"), range=pager.querySelector(".range");
    const btn=k=>pager.querySelector(`[data-go="${k}"]`);

    function draw(){
      page=Math.min(page,pages()-1);
      const start=page*per, slice=all.slice(start,start+per);
      tbody.innerHTML=slice.map(row).join("");
      of.textContent=`${page+1} / ${nf.format(pages())}`;
      range.textContent=all.length
        ? `${nf.format(start+1)}–${nf.format(start+slice.length)} de ${nf.format(all.length)} modelos`
        : "Sin resultados";
      btn("first").disabled=btn("prev").disabled = page===0;
      btn("last").disabled =btn("next").disabled = page>=pages()-1;
    }
    const go=k=>{ const last=pages()-1;
      page = k==="first"?0 : k==="prev"?Math.max(0,page-1)
           : k==="next" ?Math.min(last,page+1) : last;
      draw();
      // Keep the table head in view when paging from further down the row list.
      t.scrollIntoView({block:"nearest", behavior:"smooth"});
    };
    pager.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
    pager.querySelector("#per").onchange=e=>{
      const firstRow=page*per;            // keep the reader roughly where they were
      per=Number(e.target.value); page=Math.floor(firstRow/per); draw();
    };

    const c=document.createElement("section"); c.className="card wide";
    c.innerHTML=`<h2>Catálogo</h2>
      <p class="sub">Todos los modelos del filtro, ordenados por descuento sobre PVP.
      «Neto» es el ingreso tras margen, calculado en la base de datos.
      El nombre enlaza a la ficha pública.</p>`;
    const w=document.createElement("div"); w.className="t-wrap"; w.append(t);
    c.append(w, pager); grid.append(c);
    draw();
  }

  document.getElementById("state")?.remove();
}

/* ── boot ─────────────────────────────────────────────────────────────── */
(async () => {
  try{
    const [rows_, comp_, hist_] =
      await Promise.all([load(), loadComparison(), loadHistoria(null, null)]);
    ROWS = rows_; COMP = comp_; HIST = hist_;
    const skus = ROWS.reduce((s,r)=>s+r.num_skus,0);
    document.getElementById("meta").innerHTML =
      `<b>${nf.format(ROWS.length)}</b> modelos <span class="dot"></span>`+
      `<b>${nf.format(skus)}</b> SKU <span class="dot"></span>`+
      `<b>${nf.format(new Set(ROWS.map(r=>r.brand_code)).size)}</b> marcas `+
      `<span class="dot"></span> running y trail hombre`;
    render();
  }catch(e){
    document.getElementById("state").className="state err";
    document.getElementById("state").textContent="No se pudo cargar el catálogo: "+e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
