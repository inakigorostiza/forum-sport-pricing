<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forum Sport · Pricing dinámico</title>
<meta name="description" content="Panel de precios, márgenes y stock del catálogo de running y trail de Forum Sport.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M9 22V10h9M9 16h7' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Public+Sans:ital,wght@0,300..800;1,400&display=swap" rel="stylesheet">
<style>
/* ── Tokens ───────────────────────────────────────────────────────────── */
:root{
  color-scheme: light;
  --plane:#f4f2ed;      /* page plane, warmed */
  --surface:#fcfcfb;    /* chart surface (validator baseline) */
  --ink:#0b0b0b;
  --ink-2:#52514e;
  --muted:#898781;
  --grid:#e1e0d9;
  --axis:#c3c2b7;
  --rule:rgba(11,11,11,.10);
  --accent:#2a78d6;
  --s1:#2a78d6; --s2:#eb6834;              /* categorical slots 1,2 (validated) */
  --o1:#86b6ef; --o2:#5598e7; --o3:#2a78d6; --o4:#1c5cab; --o5:#104281; /* ordinal */
  --good:#006300;
  --shadow:0 1px 2px rgba(11,11,11,.04), 0 8px 24px -12px rgba(11,11,11,.10);
  --serif:"Instrument Serif", Georgia, serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19;
    --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --rule:rgba(255,255,255,.12);
    --accent:#3987e5;
    --s1:#3987e5; --s2:#d95926;
    --o1:#9ec5f4; --o2:#6da7ec; --o3:#3987e5; --o4:#256abf; --o5:#184f95;
    --good:#0ca30c;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0d0d0d; --surface:#1a1a19;
  --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --rule:rgba(255,255,255,.12);
  --accent:#3987e5;
  --s1:#3987e5; --s2:#d95926;
  --o1:#9ec5f4; --o2:#6da7ec; --o3:#3987e5; --o4:#256abf; --o5:#184f95;
  --good:#0ca30c;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--plane); color:var(--ink);
  font-family:var(--sans); font-weight:400;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
.wrap{max-width:1240px; margin:0 auto; padding:0 16px}
@media(min-width:900px){ .wrap{padding:0 40px} }

/* ── Masthead ─────────────────────────────────────────────────────────── */
header.mast{border-bottom:1px solid var(--rule); padding:36px 0 22px; margin-bottom:30px}
.mast-top{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap}
.eyebrow{
  font-size:11px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--muted); font-weight:600; margin:0 0 8px;
}
h1{
  font-family:var(--serif); font-weight:400;
  font-size:clamp(38px,7vw,74px); line-height:.94; margin:0;
  letter-spacing:-.015em;
}
h1 em{font-style:italic; color:var(--ink-2)}
.mast-meta{
  margin:16px 0 0; color:var(--ink-2); font-size:14px;
  display:flex; gap:8px 18px; flex-wrap:wrap; align-items:center;
}
.mast-meta b{font-weight:650; color:var(--ink); font-variant-numeric:tabular-nums}
.dot{width:3px;height:3px;border-radius:50%;background:var(--axis);flex:none}
.live{
  display:inline-flex; align-items:center; gap:7px; font-size:11px;
  letter-spacing:.1em; text-transform:uppercase; font-weight:650; color:var(--ink-2);
  border:1px solid var(--rule); border-radius:999px; padding:5px 11px; background:var(--surface);
}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--good); flex:none;
  box-shadow:0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); animation:pulse 2.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.mast-actions{display:flex; gap:8px; align-items:center}
button.ghost{
  font-family:var(--sans); font-size:12px; font-weight:600; color:var(--ink-2);
  background:var(--surface); border:1px solid var(--rule); border-radius:8px;
  padding:7px 12px; cursor:pointer; transition:.16s;
}
button.ghost:hover{color:var(--ink); border-color:var(--axis)}

/* ── Hero ─────────────────────────────────────────────────────────────── */
.hero{
  display:grid; gap:28px 48px; align-items:end; margin-bottom:34px;
  grid-template-columns:1fr;
}
@media(min-width:820px){ .hero{grid-template-columns:auto 1fr} }
.hero-fig{font-size:clamp(64px,11vw,118px); font-weight:250; line-height:.86;
  letter-spacing:-.045em; margin:0; color:var(--accent)}
.hero-cap{max-width:56ch}
.hero-cap p{margin:0 0 10px; font-size:17px; line-height:1.55; color:var(--ink-2)}
.hero-cap p strong{color:var(--ink); font-weight:650}
.hero-cap .lede{font-family:var(--serif); font-size:22px; line-height:1.34; color:var(--ink)}

/* ── KPI row ──────────────────────────────────────────────────────────── */
.kpis{
  display:grid; grid-template-columns:repeat(2,1fr); gap:1px;
  background:var(--rule); border:1px solid var(--rule); border-radius:12px;
  overflow:hidden; margin-bottom:34px;
}
@media(min-width:700px){ .kpis{grid-template-columns:repeat(3,1fr)} }
@media(min-width:1050px){ .kpis{grid-template-columns:repeat(6,1fr)} }
.kpi{background:var(--surface); padding:16px 16px 18px}
.kpi .k-label{font-size:11px; letter-spacing:.07em; text-transform:uppercase;
  color:var(--muted); font-weight:650; margin:0 0 7px}
.kpi .k-val{font-size:27px; font-weight:600; letter-spacing:-.02em; margin:0; color:var(--ink)}
.kpi .k-sub{font-size:12px; color:var(--muted); margin:4px 0 0}

/* ── Filters ──────────────────────────────────────────────────────────── */
.filters{
  display:flex; gap:10px; flex-wrap:wrap; align-items:center; min-width:0;
  padding:13px 16px; background:var(--surface);
  border:1px solid var(--rule); border-radius:12px; margin-bottom:26px;
  position:sticky; top:0; z-index:20; box-shadow:var(--shadow);
}
.filters .f-lab{font-size:11px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); font-weight:650; margin-right:2px}
select, .chip{
  font-family:var(--sans); font-size:13px; font-weight:500; color:var(--ink);
  background:var(--plane); border:1px solid var(--rule); border-radius:8px;
  padding:7px 11px; cursor:pointer;
}
select:focus-visible,.chip:focus-visible,button:focus-visible,summary:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--accent); color:#fff; border-color:var(--accent)}
.search{position:relative; flex:1 1 210px; min-width:170px; max-width:320px}
.search-in{
  font-family:var(--sans); font-size:13px; color:var(--ink); width:100%;
  background:var(--plane); border:1px solid var(--rule); border-radius:8px;
  padding:7px 28px 7px 30px;
}
.search-in::placeholder{color:var(--muted)}
/* type=search draws its own clear button in WebKit, which would sit beside ours. */
.search-in::-webkit-search-cancel-button,
.search-in::-webkit-search-decoration{-webkit-appearance:none; appearance:none}
.search-in:focus{outline:none; border-color:var(--accent)}
.search .ico{
  position:absolute; left:10px; top:50%; transform:translateY(-50%);
  color:var(--muted); font-size:12px; pointer-events:none;
}
.search .clr{
  position:absolute; right:7px; top:50%; transform:translateY(-50%);
  background:none; border:none; color:var(--muted); cursor:pointer;
  font-size:15px; line-height:1; padding:2px 4px;
}
.search .clr:hover{color:var(--ink)}
.ac{
  position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:45;
  background:var(--surface); border:1px solid var(--rule); border-radius:10px;
  box-shadow:var(--shadow); padding:5px; max-height:300px; overflow-y:auto;
}
.ac[hidden]{display:none}
.ac-opt{
  display:flex; align-items:baseline; gap:8px; padding:7px 9px; border-radius:7px;
  font-size:13px; cursor:pointer; color:var(--ink);
}
.ac-opt[aria-selected="true"],.ac-opt:hover{background:color-mix(in srgb, var(--accent) 11%, transparent)}
.ac-opt mark{background:color-mix(in srgb, var(--accent) 28%, transparent); color:inherit; border-radius:3px}
.ac-opt .br{color:var(--muted); font-size:11.5px}
.ac-opt .cnt{margin-left:auto; color:var(--muted); font-size:11.5px; font-variant-numeric:tabular-nums}
.ac-none{padding:9px; font-size:12.5px; color:var(--muted)}
.ms{position:relative}
.ms-btn{
  font-family:var(--sans); font-size:13px; font-weight:500; color:var(--ink);
  background:var(--plane); border:1px solid var(--rule); border-radius:8px;
  padding:7px 11px; cursor:pointer; display:inline-flex; align-items:center; gap:7px;
}
.ms-btn:hover{border-color:var(--axis)}
.ms-btn[aria-expanded="true"]{border-color:var(--accent)}
.ms-btn .caret{color:var(--muted); font-size:10px}
.ms-btn .n{
  background:var(--accent); color:#fff; border-radius:999px;
  font-size:11px; font-weight:700; padding:1px 6px; font-variant-numeric:tabular-nums;
}
.ms-pop{
  position:absolute; top:calc(100% + 6px); left:0; z-index:40; min-width:230px;
  max-height:320px; overflow-y:auto; background:var(--surface);
  border:1px solid var(--rule); border-radius:10px; box-shadow:var(--shadow); padding:6px;
}
.ms-pop[hidden]{display:none}
.ms-opt{
  display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:7px;
  font-size:13px; cursor:pointer; color:var(--ink); white-space:nowrap;
}
.ms-opt:hover{background:color-mix(in srgb, var(--accent) 9%, transparent)}
.ms-opt input{accent-color:var(--accent); width:14px; height:14px; margin:0; cursor:pointer}
.ms-opt .cnt{margin-left:auto; color:var(--muted); font-size:11.5px; font-variant-numeric:tabular-nums}
.ms-head{
  display:flex; gap:8px; padding:4px 9px 8px; border-bottom:1px solid var(--rule); margin-bottom:4px;
}
.ms-head button{
  font-family:var(--sans); font-size:11.5px; font-weight:600; color:var(--accent);
  background:none; border:none; padding:0; cursor:pointer;
}
.ms-head button:hover{text-decoration:underline}
.f-count{margin-left:auto; flex:none; font-size:13px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.f-count b{color:var(--ink); font-weight:650}

/* ── Chart cards ──────────────────────────────────────────────────────── */
.grid{display:grid; gap:18px; grid-template-columns:1fr; margin-bottom:18px; min-width:0}
@media(min-width:880px){ .grid{grid-template-columns:1fr 1fr} }
.card{
  min-width:0; scroll-margin-top:76px;
  background:var(--surface); border:1px solid var(--rule); border-radius:14px;
  padding:20px 20px 16px; box-shadow:var(--shadow);
}
.card.wide{grid-column:1/-1; min-width:0}
.card h2{
  font-family:var(--serif); font-weight:400; font-size:23px; line-height:1.2;
  margin:0 0 3px; letter-spacing:-.01em;
}
.card .sub{font-size:13px; color:var(--muted); margin:0 0 16px}
.legend{display:flex; gap:16px; flex-wrap:wrap; margin:0 0 12px; font-size:12.5px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.swatch{width:11px; height:11px; border-radius:3px; flex:none}
svg{display:block; width:100%; height:auto; overflow:visible}
.tick{font-size:11px; fill:var(--muted); font-variant-numeric:tabular-nums}
.cat{font-size:12px; fill:var(--ink-2)}
.val{font-size:12px; fill:var(--ink-2); font-weight:650; font-variant-numeric:tabular-nums}
text.val.on-light{fill:#0b0b0b}   /* on orange: 6.8:1 — beats white's 3.1:1 */
text.val.on-dark{fill:#fff}       /* on blue:   4.2:1 */
.gridline{stroke:var(--grid); stroke-width:1}
.axis{stroke:var(--axis); stroke-width:1}
.mark{transition:opacity .13s}
.hit{fill:transparent; cursor:pointer}
g.row:hover .mark{opacity:.72}

details{margin-top:14px; border-top:1px solid var(--rule); padding-top:10px}
summary{font-size:12px; color:var(--muted); cursor:pointer; font-weight:600;
  letter-spacing:.04em; list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ "; color:var(--axis)}
details[open] summary::before{content:"▾ "}
summary:hover{color:var(--ink-2)}
.t-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%}
table{width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; min-width:420px}
th,td{text-align:right; padding:7px 8px; border-bottom:1px solid var(--rule);
  font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left; font-variant-numeric:normal}
th{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
  font-weight:650; border-bottom:1px solid var(--axis)}
tbody tr:hover{background:color-mix(in srgb, var(--accent) 6%, transparent)}
td a{color:var(--ink); text-decoration:none; border-bottom:1px solid var(--axis)}
td a:hover{color:var(--accent); border-color:var(--accent)}
.thumb{
  width:46px; height:46px; border-radius:8px; flex:none; object-fit:contain;
  background:color-mix(in srgb, var(--ink) 4%, transparent);
  border:1px solid var(--rule);
}
.thumb[data-failed]{
  background:
    repeating-linear-gradient(45deg, transparent 0 5px, color-mix(in srgb,var(--ink) 5%,transparent) 5px 10px),
    color-mix(in srgb, var(--ink) 3%, transparent);
}
.prod{display:flex; align-items:center; gap:12px}
.prod-name{display:flex; flex-direction:column; gap:1px; min-width:0}
.prod-name small{color:var(--muted); font-size:11.5px; letter-spacing:.03em;
  display:flex; align-items:center; gap:0}
.prod-name a{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:34ch}
td.prod-cell{padding:8px}
.badge{
  display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.04em;
  padding:3px 8px; border-radius:6px; white-space:nowrap;
}
.badge.caro{background:color-mix(in srgb, var(--s2) 18%, transparent); color:var(--ink)}
.badge.barato{background:color-mix(in srgb, var(--good) 18%, transparent); color:var(--ink)}
/* Same price is its own state, not a weak win: blue, distinct from both. */
.badge.igual{background:color-mix(in srgb, var(--s1) 20%, transparent); color:var(--ink)}
tr.igual-row{background:color-mix(in srgb, var(--s1) 6%, transparent)}
/* A model with several rivals reads as one product: the name prints once and a
   heavier rule opens the group, so repeated rows are visibly continuations. */
tr.grp-start td{border-top:1px solid var(--axis)}
tr.grp-cont td.prod-cell{padding-left:70px}
td.cont-mark{color:var(--muted); font-size:12px}
.delta-up{color:var(--s2); font-weight:700}
.delta-dn{color:var(--good); font-weight:700}
.delta-eq{color:var(--s1); font-weight:700}
.edad{color:var(--muted); font-size:12px; white-space:nowrap}
.edad.stale{color:var(--s2)}
.comp-note{
  font-size:12px; color:var(--muted); margin:12px 0 0; padding-top:10px;
  border-top:1px solid var(--rule);
}
.pager{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  margin-top:14px; padding-top:13px; border-top:1px solid var(--rule);
}
.pager .range{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.pager .grow{margin-left:auto}
.pager select{padding:5px 8px; font-size:12.5px}
button.pg{
  font-family:var(--sans); font-size:12.5px; font-weight:600; color:var(--ink-2);
  background:var(--plane); border:1px solid var(--rule); border-radius:8px;
  min-width:34px; height:32px; padding:0 11px; cursor:pointer; transition:.15s;
}
button.pg:hover:not(:disabled){color:var(--ink); border-color:var(--axis)}
button.pg:disabled{opacity:.3; cursor:not-allowed}
.pager .of{font-size:12.5px; color:var(--ink-2); font-variant-numeric:tabular-nums;
  padding:0 4px; min-width:66px; text-align:center}
.tag{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.04em;
  padding:2px 6px; border-radius:5px; background:color-mix(in srgb, var(--s2) 16%, transparent);
  color:var(--ink); margin-left:6px}

/* ── Tooltip ──────────────────────────────────────────────────────────── */
#tip{
  position:fixed; pointer-events:none; opacity:0; transform:translateY(3px);
  transition:opacity .12s, transform .12s; z-index:90;
  background:var(--ink); color:var(--plane); font-size:12.5px; line-height:1.45;
  padding:8px 11px; border-radius:8px; max-width:280px;
  box-shadow:0 8px 28px -8px rgba(0,0,0,.45);
}
#tip.on{opacity:1; transform:translateY(0)}
#tip b{font-weight:700} #tip .t-k{opacity:.66}

/* ── States / footer ──────────────────────────────────────────────────── */
.state{padding:56px 20px; text-align:center; color:var(--muted); font-size:15px}
.state.err{color:#d03b3b}
#app[data-loading="1"]{opacity:.45; transition:opacity .2s}
footer{border-top:1px solid var(--rule); margin-top:36px; padding:26px 0 40px;
  color:var(--muted); font-size:12.5px; display:flex; justify-content:space-between;
  gap:16px; flex-wrap:wrap; align-items:center}
footer a{color:var(--ink-2)}
.sig{display:inline-flex; align-items:center; gap:6px; text-decoration:none;
  color:var(--muted); opacity:.65; transition:.2s; font-size:11.5px; letter-spacing:.04em}
.sig:hover{opacity:1; color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}
</style>
</head>

<div id="tip" role="status" aria-live="polite"></div>

<div class="wrap">
  <header class="mast">
    <div class="mast-top">
      <div>
        <p class="eyebrow">Forum Sport · Laboratorio de pricing</p>
        <h1>Pricing <em>dinámico</em></h1>

      <div class="mast-actions">
        <span class="live"><span class="pulse"></span> Datos en vivo</span>

      Catálogo de running y trail · origen <code>Dataset_FS_pricing_dinámico.xlsx</code> ·

    </span>
    <a class="sig" href="https://deerflow.tech" target="_blank" rel="noopener noreferrer">✦ Created by Deerflow</a>
  </footer>
</div>

<script type="module">
const URL_  = "https://hhehxwdpvoojgjbogton.supabase.co";
const ANON  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhoZWh4d2Rwdm9vamdqYm9ndG9uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNzI0MTgsImV4cCI6MjEwNTY0ODQxOH0.JzAvwowqBm6hFM9Ct19Tqq-MyxROK-JAiYjg7LWaROY";

/* ── formatting (es-ES) ───────────────────────────────────────────────── */
const nf  = new Intl.NumberFormat("es-ES");
const nf1 = new Intl.NumberFormat("es-ES",{minimumFractionDigits:1,maximumFractionDigits:1});
const eur = new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const eur2= new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",minimumFractionDigits:2});
const pct = v => nf1.format(v)+" %";
const N   = v => v===null||v===undefined ? null : Number(v);   // PostgREST sends numeric as string

/* How old a price is matters more than when it was taken, so recent readings
   are relative and older ones fall back to a date. */
const rtf = new Intl.RelativeTimeFormat("es-ES", {numeric:"auto"});
const fechaCorta = new Intl.DateTimeFormat("es-ES",{day:"numeric",month:"short"});
const fechaLarga = new Intl.DateTimeFormat("es-ES",
  {dateStyle:"long", timeStyle:"short"});
function antiguedad(iso){
  if(!iso) return {txt:"—", full:"", stale:false};
  const d = new Date(iso), mins = Math.round((Date.now() - d) / 60000);
  const txt = mins < 1      ? "ahora"
            : mins < 60     ? rtf.format(-mins, "minute")
            : mins < 1440   ? rtf.format(-Math.round(mins/60), "hour")
            : mins < 10080  ? rtf.format(-Math.round(mins/1440), "day")
            : fechaCorta.format(d);
  return {txt, full: fechaLarga.format(d), stale: mins > 10080};
}

/* ── data ─────────────────────────────────────────────────────────────── */
const FIELDS = ["modelo","brand_code","marca","nombre_modelo","tipo_producto","temporada",
  "ano_temporada","precio","precio_rebaja","descuento_pct","en_rebaja","margen","nivel_margen",
  "nivel_margen_orden","nivel_stock","nivel_stock_orden","cobertura_stock","outlet",
  "exclusivo_online","num_skus","url","img_thumb"].join(",");

let ROWS = [];
let COMP = [];                     // competitor comparison (public view only)
// Sets, so each filter takes 1..n values. An empty set means "no restriction",
// which keeps the default cheap: no membership test runs until something is picked.
const F = { q:"", marcas:new Set(), tipos:new Set(), competidores:new Set(), rebaja:false };

// Accent- and case-insensitive: "galaxy" must find "GALAXY", "peregrine" must
// find "PEREGRINE GORE-TEX", and an accented query must not miss its own match.
const norm = str => (str||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

// render() rebuilds the filter row on every keystroke, so focus and caret are
// re-read from the DOM at the top of render() rather than tracked in a flag.

async function page(offset){
  const u = `${URL_}/rest/v1/v_modelos_detalle?select=${FIELDS}&order=modelo&limit=1000&offset=${offset}`;
  const r = await fetch(u,{headers:{apikey:ANON, Authorization:`Bearer ${ANON}`}});
  if(!r.ok) throw new Error(`${r.status} ${r.statusText} — ${(await r.text()).slice(0,160)}`);
  return r.json();
}

async function loadComparison(){
  // comparativa_publica is a narrow, public table refreshed by the scraper:
  // prices and the difference between them. Margin and cost stay private.
  const u = `${URL_}/rest/v1/comparativa_publica`
    + `?select=modelo,marca,nombre_modelo,img_thumb,url_fs,precio_fs,pvp,`
    + `competidor,precio_comp,url_comp,delta_eur,delta_pct,somos_mas_baratos,`
    + `nivel_stock,skus_vistos,skus_disponibles,promo,observed_at`
    + `&order=delta_pct.desc`;
  try{
    const r = await fetch(u,{headers:{apikey:ANON, Authorization:`Bearer ${ANON}`}});
    if(!r.ok) return [];                       // no comparison yet is not an error
    return (await r.json()).map(d=>({...d,
      precio_fs:N(d.precio_fs), pvp:N(d.pvp), precio_comp:N(d.precio_comp),
      delta_eur:N(d.delta_eur), delta_pct:N(d.delta_pct)}));
  }catch{ return []; }
}

async function load(){
  // PostgREST caps a response at 1.000 rows, so the 1.483 models come in two pages.
  const out=[]; let off=0;
  for(;;){ const p = await page(off); out.push(...p); if(p.length<1000) break; off+=1000; }
  return out.map(d=>({...d,
    precio:N(d.precio), precio_rebaja:N(d.precio_rebaja), descuento_pct:N(d.descuento_pct),
    margen:N(d.margen), cobertura_stock:N(d.cobertura_stock), num_skus:N(d.num_skus),
    ano_temporada:N(d.ano_temporada),
    nivel_margen_orden:N(d.nivel_margen_orden), nivel_stock_orden:N(d.nivel_stock_orden)}));
}

// Models carrying a price from each selected competitor. Selecting a competitor
// narrows the whole page, not just the comparison table, so every chart and KPI
// describes the same slice.
const modelosDe = comps => {
  if(!comps.size) return null;
  const ok = new Set();
  for(const c of COMP) if(comps.has(c.competidor)) ok.add(c.modelo);
  return ok;
};

const filtered = () => {
  const conComp = modelosDe(F.competidores);
  const q = norm(F.q);
  return ROWS.filter(d =>
    (!q || norm(d.nombre_modelo).includes(q) || norm(d.marca).includes(q)) &&
    (!F.marcas.size || F.marcas.has(d.brand_code)) &&
    (!F.tipos.size  || F.tipos.has(d.tipo_producto)) &&
    (!F.rebaja      || d.en_rebaja) &&
    (!conComp       || conComp.has(d.modelo)));
};

/* ── tooltip ──────────────────────────────────────────────────────────── */
const tip = document.getElementById("tip");
function bindTip(el, html){
  const show = e => {
    tip.innerHTML = html; tip.classList.add("on");
    const r = tip.getBoundingClientRect();
    const x = Math.min(Math.max(8,(e.clientX??0)+14), innerWidth -r.width -8);
    const y = Math.max(8,(e.clientY??0)-r.height-12);
    tip.style.left = x+"px"; tip.style.top = y+"px";
  };
  el.addEventListener("mouseenter",show); el.addEventListener("mousemove",show);
  el.addEventListener("focus",e=>{
    const b=el.getBoundingClientRect();
    show({clientX:b.left+b.width/2, clientY:b.top});
  });
  const hide=()=>tip.classList.remove("on");
  el.addEventListener("mouseleave",hide); el.addEventListener("blur",hide);
}

/* ── svg helpers ──────────────────────────────────────────────────────── */
const SVGNS="http://www.w3.org/2000/svg";
const el=(n,a={})=>{const e=document.createElementNS(SVGNS,n);
  for(const k in a) e.setAttribute(k,a[k]); return e;};
// Bar grows from a square baseline and gets a 4px rounded data-end.
function hbarPath(x0,y,w,h,r=4){
  r=Math.min(r,Math.max(0,w),h/2); const x1=x0+w;
  if(w<=r) return `M${x0},${y}H${x1}V${y+h}H${x0}Z`;
  return `M${x0},${y}H${x1-r}Q${x1},${y} ${x1},${y+r}V${y+h-r}Q${x1},${y+h} ${x1-r},${y+h}H${x0}Z`;
}
function vbarPath(x,yTop,w,h,r=4){
  r=Math.min(r,w/2,Math.max(0,h)); const yB=yTop+h;
  if(h<=r) return `M${x},${yTop}H${x+w}V${yB}H${x}Z`;
  return `M${x},${yB}V${yTop+r}Q${x},${yTop} ${x+r},${yTop}H${x+w-r}Q${x+w},${yTop} ${x+w},${yTop+r}V${yB}Z`;
}
/* Axis maxima land on clean numbers AND hug the data: derive the step from
   ~5 intervals, then take only as many steps as the data needs. */
function niceScale(maxVal, target=5){
  if(!(maxVal>0)) return {max:1, ticks:[0,1]};
  const raw=maxVal/target, p=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/p;
  const step=(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;
  const count=Math.max(1,Math.ceil(maxVal/step - 1e-9));
  return {max:step*count, ticks:Array.from({length:count+1},(_,i)=>step*i)};
}

/* Horizontal bar chart. One series → one colour, no legend box (the title names it). */
function hbar(items,{fill="var(--s1)", fmt=nf.format, unit="modelos", colorOf=null}={}){
  const BAR=Math.min(24,Math.max(12,Math.round(210/items.length)));
  const GAP=Math.max(8,Math.round(BAR*.55)), LAB=132, PADR=64, W=640;
  const H=items.length*(BAR+GAP)+16;
  const sc=niceScale(Math.max(...items.map(d=>d.v),0)), max=sc.max, sw=W-LAB-PADR;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img"});
  sc.ticks.forEach((tv,i)=>{ const x=LAB+sw*tv/max;
    svg.append(el("line",{x1:x,x2:x,y1:0,y2:H-16,class:i?"gridline":"axis"}));
    const t=el("text",{x,y:H-3,class:"tick","text-anchor":"middle"}); t.textContent=fmt(tv); svg.append(t);
  });
  items.forEach((d,i)=>{
    const y=i*(BAR+GAP)+2, w=Math.max(0,sw*d.v/max);
    const g=el("g",{class:"row"});
    const lb=el("text",{x:LAB-10,y:y+BAR/2+4,class:"cat","text-anchor":"end"});
    lb.textContent=d.k.length>19?d.k.slice(0,18)+"…":d.k; g.append(lb);
    g.append(el("path",{d:hbarPath(LAB,y,w,BAR),fill:colorOf?colorOf(d,i):fill,class:"mark"}));
    const vt=el("text",{x:LAB+w+9,y:y+BAR/2+4,class:"val"}); vt.textContent=fmt(d.v); g.append(vt);
    const hit=el("rect",{x:0,y:y-GAP/2,width:W,height:BAR+GAP,class:"hit",tabindex:"0",
      role:"img","aria-label":`${d.k}: ${fmt(d.v)} ${unit}`});
    bindTip(hit,`<b>${d.k}</b><br><span class="t-k">${unit}:</span> ${fmt(d.v)}${d.note?`<br>${d.note}`:""}`);
    g.append(hit); svg.append(g);
  });
  return svg;
}

/* Column chart. */
function columns(items,{fill="var(--s1)", fmt=nf.format, unit="modelos", colorOf=null, rotate=false}={}){
  const W=640,H=rotate?250:224, PADB=rotate?52:32, PADT=18, PADL=44, PADR=8;
  const pw=W-PADL-PADR, ph=H-PADB-PADT;
  const band=pw/items.length, BAR=Math.min(24,Math.max(6,band-Math.max(2,band*.28)));
  const sc=niceScale(Math.max(...items.map(d=>d.v),0)), max=sc.max;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img"});
  sc.ticks.forEach((tv,i)=>{ const y=PADT+ph-ph*tv/max;
    svg.append(el("line",{x1:PADL,x2:W-PADR,y1:y,y2:y,class:i?"gridline":"axis"}));
    const t=el("text",{x:PADL-8,y:y+4,class:"tick","text-anchor":"end"}); t.textContent=fmt(tv); svg.append(t);
  });
  items.forEach((d,i)=>{
    const x=PADL+band*i+(band-BAR)/2, h=Math.max(0,ph*d.v/max), y=PADT+ph-h;
    const g=el("g",{class:"row"});
    g.append(el("path",{d:vbarPath(x,y,BAR,h),fill:colorOf?colorOf(d,i):fill,class:"mark"}));
    const lx=PADL+band*i+band/2;
    const lb=el("text",{x:lx,y:PADT+ph+16,class:"tick","text-anchor":rotate?"end":"middle"});
    lb.textContent=d.k;
    if(rotate) lb.setAttribute("transform",`rotate(-42 ${lx} ${PADT+ph+16})`);
    g.append(lb);
    const hit=el("rect",{x:PADL+band*i,y:PADT,width:band,height:ph,class:"hit",tabindex:"0",
      role:"img","aria-label":`${d.k}: ${fmt(d.v)} ${unit}`});
    bindTip(hit,`<b>${d.k}</b><br><span class="t-k">${unit}:</span> ${fmt(d.v)}${d.note?`<br>${d.note}`:""}`);
    g.append(hit); svg.append(g);
  });
  return svg;
}

/* Part-to-whole: a single stacked bar, 2px surface gap between segments. */
function stacked(items,{fmt=nf.format}={}){
  const W=640,H=46,BAR=30,GAP=2, total=items.reduce((s,d)=>s+d.v,0)||1;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img"});
  let x=0;
  items.forEach(d=>{
    const w=Math.max(0,(W-GAP*(items.length-1))*d.v/total);
    const g=el("g",{class:"row"});
    g.append(el("rect",{x,y:6,width:w,height:BAR,rx:4,fill:d.c,class:"mark"}));
    if(w>92){
      const t=el("text",{x:x+10,y:6+BAR/2+4,class:"val "+(d.ink||"on-dark")});
      t.textContent=`${fmt(d.v)} · ${nf1.format(d.v/total*100)} %`; g.append(t);
    }
    const hit=el("rect",{x,y:0,width:w,height:BAR+12,class:"hit",tabindex:"0",
      role:"img","aria-label":`${d.k}: ${fmt(d.v)}`});
    bindTip(hit,`<b>${d.k}</b><br><span class="t-k">modelos:</span> ${fmt(d.v)} (${nf1.format(d.v/total*100)} %)`);
    g.append(hit); svg.append(g); x+=w+GAP;
  });
  return svg;
}

/* ── multi-select dropdown ────────────────────────────────────────────── */
/* A native <select multiple> is unusable on touch and gives no counts, so this
   is a button + checkbox popover. One open at a time; Escape and outside-click
   close it. */
let openPop = null;
document.addEventListener("click", e => {
  if(openPop && !openPop.root.contains(e.target)) close_();
});
document.addEventListener("keydown", e => { if(e.key === "Escape") close_(); });
function close_(){
  if(!openPop) return;
  openPop.pop.hidden = true;
  openPop.btn.setAttribute("aria-expanded", "false");
  openPop = null;
}

/* Search box with autocomplete over product names.
   The text itself filters live; the dropdown is a shortcut to an exact name. */
function searchBox(rows, onChange){
  const root = document.createElement("div"); root.className = "search";
  root.innerHTML = `<span class="ico">⌕</span>
    <input class="search-in" type="search" placeholder="Buscar modelo…"
           autocomplete="off" role="combobox" aria-expanded="false"
           aria-autocomplete="list" aria-label="Buscar modelo o marca">
    <button class="clr" type="button" aria-label="Limpiar búsqueda" hidden>×</button>
    <div class="ac" role="listbox" hidden></div>`;
  const input = root.querySelector("input");
  const ac    = root.querySelector(".ac");
  const clr   = root.querySelector(".clr");
  input.value = F.q;
  clr.hidden  = !F.q;
  let cursor = -1, items = [];

  // One entry per distinct product name, with its brand and how many models
  // share it — a name like GALAXY 7 covers several colourways.
  const index = [...rows.reduce((m, r) => {
    const k = r.nombre_modelo + "|" + r.marca;
    m.set(k, m.get(k) ? {...m.get(k), n: m.get(k).n + 1}
                      : {name: r.nombre_modelo, marca: r.marca, n: 1});
    return m;
  }, new Map()).values()];

  const hide = () => { ac.hidden = true; input.setAttribute("aria-expanded","false"); cursor = -1; };

  const mark = (text, q) => {
    const i = norm(text).indexOf(q);
    if (i < 0) return text;
    return text.slice(0,i) + "<mark>" + text.slice(i, i+q.length) + "</mark>" + text.slice(i+q.length);
  };

  const paint = () => {
    const q = norm(input.value);
    if (q.length < 2) return hide();
    // Names that start with the query rank above names that merely contain it.
    items = index.filter(e => norm(e.name).includes(q) || norm(e.marca).includes(q))
      .sort((a,b) => (norm(b.name).startsWith(q) - norm(a.name).startsWith(q))
                  || a.name.localeCompare(b.name,"es"))
      .slice(0, 8);
    ac.innerHTML = items.length
      ? items.map((e,i) => `<div class="ac-opt" role="option" data-i="${i}"
           aria-selected="${i===cursor}"><span>${mark(e.name,q)}</span>
           <span class="br">${e.marca}</span>
           <span class="cnt">${e.n}</span></div>`).join("")
      : `<div class="ac-none">Ningún modelo coincide con «${input.value}»</div>`;
    ac.hidden = false; input.setAttribute("aria-expanded","true");
    ac.querySelectorAll(".ac-opt").forEach(el =>
      el.onmousedown = ev => { ev.preventDefault(); choose(items[+el.dataset.i]); });
  };

  const choose = e => { if(!e) return; F.q = e.name; hide(); onChange(); };

  input.oninput = () => {
    F.q = input.value; clr.hidden = !F.q;
    cursor = -1; onChange();   // rebuilds the row; the new input repaints on focus

  };
  input.onfocus = () => paint();
  input.onblur  = () => setTimeout(hide, 120);
  input.onkeydown = ev => {
    if (ac.hidden || !items.length) { if (ev.key === "Escape") { F.q=""; input.value=""; onChange(); } return; }
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault();
      cursor = (cursor + (ev.key === "ArrowDown" ? 1 : items.length - 1)) % items.length;
      ac.querySelectorAll(".ac-opt").forEach((el,i) => el.setAttribute("aria-selected", String(i===cursor)));
      ac.querySelector('[aria-selected="true"]')?.scrollIntoView({block:"nearest"});
    } else if (ev.key === "Enter") { ev.preventDefault(); choose(items[cursor >= 0 ? cursor : 0]); }
    else if (ev.key === "Escape") { hide(); }
  };
  clr.onclick = () => { F.q = ""; input.value = ""; clr.hidden = true; hide(); onChange(); };
  return {root, input, paint};
}

function multiSelect({label, options, selected, onChange}){
  const root = document.createElement("div"); root.className = "ms";
  const btn = document.createElement("button");
  btn.type = "button"; btn.className = "ms-btn";
  btn.setAttribute("aria-haspopup", "true"); btn.setAttribute("aria-expanded", "false");
  const pop = document.createElement("div"); pop.className = "ms-pop"; pop.hidden = true;

  const paint = () => {
    const n = selected.size;
    btn.innerHTML = `<span>${label}</span>`
      + (n ? `<span class="n">${n}</span>` : "")
      + `<span class="caret">▾</span>`;
  };
  paint();

  const head = document.createElement("div"); head.className = "ms-head";
  head.innerHTML = `<button type="button" data-all>Todos</button>
                    <button type="button" data-none>Ninguno</button>`;
  pop.append(head);
  head.querySelector("[data-all]").onclick = () => {
    options.forEach(o => selected.add(o.value));
    pop.querySelectorAll("input").forEach(i => i.checked = true); paint(); onChange();
  };
  head.querySelector("[data-none]").onclick = () => {
    selected.clear();
    pop.querySelectorAll("input").forEach(i => i.checked = false); paint(); onChange();
  };

  for(const o of options){
    const row = document.createElement("label"); row.className = "ms-opt";
    row.innerHTML = `<input type="checkbox"${selected.has(o.value) ? " checked" : ""}>
      <span>${o.label}</span>${o.count != null ? `<span class="cnt">${nf.format(o.count)}</span>` : ""}`;
    row.querySelector("input").onchange = e => {
      e.target.checked ? selected.add(o.value) : selected.delete(o.value);
      paint(); onChange();
    };
    pop.append(row);
  }

  btn.onclick = e => {
    e.stopPropagation();
    const wasOpen = openPop && openPop.pop === pop;
    close_();
    if(!wasOpen){
      pop.hidden = false; btn.setAttribute("aria-expanded", "true");
      openPop = {root, btn, pop};
    }
  };
  root.append(btn, pop);
  return root;
}

/* ── aggregation ──────────────────────────────────────────────────────── */
const by=(rows,key)=>{const m=new Map();
  for(const r of rows){const k=key(r); m.set(k,(m.get(k)||0)+1);} return m;};
const avg=(rows,f)=>rows.length?rows.reduce((s,r)=>s+f(r),0)/rows.length:0;

const BANDS=[[0,60,"< 60"],[60,80,"60–79"],[80,100,"80–99"],[100,120,"100–119"],
  [120,140,"120–139"],[140,160,"140–159"],[160,180,"160–179"],[180,200,"180–199"],
  [200,1e9,"200 +"]];
const ORD_MARGEN=["muy bajo","bajo","medio","alto"];
const ORD_STOCK =["muy bajo","bajo","medio","alto","muy alto"];
const RAMP4=["var(--o1)","var(--o2)","var(--o4)","var(--o5)"];
const RAMP5=["var(--o1)","var(--o2)","var(--o3)","var(--o4)","var(--o5)"];

/* ── render ───────────────────────────────────────────────────────────── */
function render(){
  const rows=filtered(), app=document.getElementById("app");
  // Capture focus BEFORE wiping: clearing the DOM fires the outgoing input's
  // blur handler, so any flag it maintains is already stale by the time the new
  // row is built.
  const active = document.activeElement;
  const keepFocus = !!(active && active.classList && active.classList.contains("search-in"));
  const caret = keepFocus ? (active.selectionStart ?? active.value.length) : 0;
  app.innerHTML="";

  /* filters ---------------------------------------------------------- */
  const marcas = [...new Map(ROWS.map(r=>[r.brand_code, r.marca])).entries()]
    .map(([code,name])=>({value:code, label:name,
                          count:ROWS.filter(r=>r.brand_code===code).length}))
    .sort((a,b)=>a.label.localeCompare(b.label,"es"));
  const tipos = [...new Set(ROWS.map(r=>r.tipo_producto))].sort()
    .map(t=>({value:t, label:t[0].toUpperCase()+t.slice(1),
              count:ROWS.filter(r=>r.tipo_producto===t).length}));
  const competidores = [...new Set(COMP.map(c=>c.competidor))].sort()
    .map(n=>({value:n, label:n,
              count:new Set(COMP.filter(c=>c.competidor===n).map(c=>c.modelo)).size}));

  const f = document.createElement("div"); f.className="filters";
  const lab = document.createElement("span"); lab.className="f-lab"; lab.textContent="Filtrar";
  f.append(lab);
  const sb = searchBox(ROWS, render);
  f.append(sb.root);
  f.append(multiSelect({label:"Marca", options:marcas,
                        selected:F.marcas, onChange:render}));
  f.append(multiSelect({label:"Tipo", options:tipos,
                        selected:F.tipos, onChange:render}));
  if(competidores.length)
    f.append(multiSelect({label:"Competidor", options:competidores,
                          selected:F.competidores, onChange:render}));

  const btnRebaja=document.createElement("button");
  btnRebaja.className="chip"; btnRebaja.type="button"; btnRebaja.textContent="Solo en rebaja";
  btnRebaja.setAttribute("aria-pressed", String(F.rebaja));
  btnRebaja.onclick=()=>{F.rebaja=!F.rebaja; render();};
  f.append(btnRebaja);

  const btnClear=document.createElement("button");
  btnClear.className="ghost"; btnClear.type="button"; btnClear.textContent="Limpiar";
  btnClear.onclick=()=>{F.q=""; F.marcas.clear(); F.tipos.clear(); F.competidores.clear();
                        F.rebaja=false; render();};
  f.append(btnClear);

  const cnt=document.createElement("span"); cnt.className="f-count";
  cnt.innerHTML=`<b>${nf.format(rows.length)}</b> de ${nf.format(ROWS.length)} modelos`;
  f.append(cnt);
  app.append(f);

  // The row above was just rebuilt, so the input the user is typing in is a new
  // element. Restore focus and caret, or every keystroke would drop the cursor.
  if(keepFocus){
    sb.input.focus();
    try{ sb.input.setSelectionRange(caret, caret); }catch{}
    sb.paint();
  }

  if(!rows.length){
    app.insertAdjacentHTML("beforeend",
      `<div class="state">Ningún modelo cumple estos filtros${
        F.q?` · búsqueda «${F.q}»`:""}.</div>`); return;
  }

  /* hero + kpis ------------------------------------------------------ */
  const reb=rows.filter(r=>r.en_rebaja);
  const stockBajo=rows.filter(r=>r.nivel_stock==="muy bajo"||r.nivel_stock==="bajo");
  const pctReb=reb.length/rows.length*100;
  const hero=document.createElement("div"); hero.className="hero";
  hero.innerHTML=`<p class="hero-fig">${nf1.format(pctReb)} %</p>
    <div class="hero-cap">
      <p class="lede">de los modelos se venden por debajo de su PVP.</p>
      <p>Al mismo tiempo <strong>${pct(stockBajo.length/rows.length*100)}</strong> del catálogo
      está en nivel de stock bajo o muy bajo. Rebajar lo que apenas queda en almacén es margen
      regalado: ahí empieza el trabajo de una calculadora de precio dinámico.</p>
    </div>`;
  app.append(hero);

  const margenMedio=avg(rows,r=>r.margen);
  const kpis=[
    ["Modelos", nf.format(rows.length), `${nf.format(rows.reduce((s,r)=>s+r.num_skus,0))} SKU`],
    ["Marcas", nf.format(new Set(rows.map(r=>r.brand_code)).size), "en el catálogo"],
    ["PVP medio", eur.format(avg(rows,r=>r.precio)), "precio de tarifa"],
    ["Precio medio real", eur.format(avg(rows,r=>r.precio_rebaja)), "tras rebaja"],
    ["Descuento medio", reb.length?pct(avg(reb,r=>r.descuento_pct)):"—", "de los rebajados"],
    ["Margen medio", pct(margenMedio*100), "sintético"],
  ];
  const k=document.createElement("div"); k.className="kpis";
  k.innerHTML=kpis.map(([l,v,s])=>
    `<div class="kpi"><p class="k-label">${l}</p><p class="k-val">${v}</p><p class="k-sub">${s}</p></div>`).join("");
  app.append(k);

  const grid=document.createElement("div"); grid.className="grid"; app.append(grid);

  /* 1 · Rebaja frente a stock — the chart the whole project points at ----
     100% stacked: every row is the same length, so bar length and the printed
     figure both encode share. Absolute counts ride the tooltip and the table,
     where they can't be confused with the percentage. */
  {
    const items=ORD_STOCK.map(lvl=>{
      const g=rows.filter(r=>r.nivel_stock===lvl);
      const r_=g.filter(x=>x.en_rebaja).length;
      return {k:lvl, n:g.length, reb:r_, full:g.length-r_, pct:g.length?r_/g.length*100:0};
    }).filter(d=>d.n);
    const mediaPct = rows.filter(r=>r.en_rebaja).length/rows.length*100;

    const W=640, BAR=26, GAP=18, LAB=92, PADR=84, sw=W-LAB-PADR;
    const H=items.length*(BAR+GAP)+20;
    const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img",
      "aria-label":"Porcentaje de modelos en rebaja dentro de cada nivel de stock"});
    [0,25,50,75,100].forEach((tv,i)=>{ const x=LAB+sw*tv/100;
      svg.append(el("line",{x1:x,x2:x,y1:0,y2:H-20,class:i?"gridline":"axis"}));
      const t=el("text",{x,y:H-5,class:"tick","text-anchor":"middle"}); t.textContent=tv+" %"; svg.append(t);
    });
    items.forEach((d,i)=>{
      const y=i*(BAR+GAP)+2, wR=sw*d.pct/100, wF=sw-wR;
      const g=el("g",{class:"row"});
      const lb=el("text",{x:LAB-10,y:y+BAR/2+4,class:"cat","text-anchor":"end"});
      lb.textContent=d.k; g.append(lb);
      // 2px surface gap does the separating — no stroke around the marks.
      g.append(el("path",{d:hbarPath(LAB,y,Math.max(0,wR-(wF>2?2:0)),BAR,wF>2?0:4),
        fill:"var(--s2)",class:"mark"}));
      if(wF>0) g.append(el("path",{d:hbarPath(LAB+wR,y,wF,BAR),fill:"var(--s1)",class:"mark"}));
      // Label inside the mark only when it fits with padding.
      if(wR>52){
        const t=el("text",{x:LAB+10,y:y+BAR/2+4,class:"val on-light"});
        t.textContent=nf1.format(d.pct)+" %"; g.append(t);
      }
      const nt=el("text",{x:LAB+sw+10,y:y+BAR/2+4,class:"tick"});
      nt.textContent="n = "+nf.format(d.n); g.append(nt);
      const hit=el("rect",{x:0,y:y-GAP/2,width:W,height:BAR+GAP,class:"hit",tabindex:"0",
        role:"img","aria-label":`Stock ${d.k}: ${nf1.format(d.pct)} por ciento en rebaja, ${nf.format(d.reb)} de ${nf.format(d.n)} modelos`});
      bindTip(hit,`<b>Stock ${d.k}</b><br><b>${nf1.format(d.pct)} %</b> en rebaja`
        +`<br><span class="t-k">rebajados:</span> ${nf.format(d.reb)}`
        +`<br><span class="t-k">precio completo:</span> ${nf.format(d.full)}`
        +`<br><span class="t-k">modelos:</span> ${nf.format(d.n)}`);
      g.append(hit); svg.append(g);
    });
    // Catalogue average, as a solid hairline reference (never dashed).
    const mx=LAB+sw*mediaPct/100;
    svg.append(el("line",{x1:mx,x2:mx,y1:-4,y2:H-20,stroke:"var(--ink-2)","stroke-width":1}));
    const mt=el("text",{x:mx,y:-9,class:"tick","text-anchor":"middle",fill:"var(--ink-2)"});
    mt.textContent="media "+nf1.format(mediaPct)+" %"; svg.append(mt);

    const leg=document.createElement("div"); leg.className="legend";
    leg.innerHTML=`<span><i class="swatch" style="background:var(--s2)"></i>En rebaja</span>
      <span><i class="swatch" style="background:var(--s1)"></i>Precio completo</span>`;
    const box=document.createElement("div"); box.style.paddingTop="14px"; box.append(leg,svg);
    grid.append(card("Rebaja frente a stock",
      "Qué proporción de cada nivel de stock se vende rebajada. Todas las barras miden lo mismo: lo que cambia es el reparto.",
      box,
      tableFor(["Nivel de stock","Modelos","En rebaja","Precio completo","% rebajado"],
        items.map(d=>[d.k,nf.format(d.n),nf.format(d.reb),nf.format(d.full),nf1.format(d.pct)+" %"])),
      true));
  }


  /* 2 · Frente a la competencia ------------------------------------------ */
  if(COMP.length){
    const ids = new Set(rows.map(r=>r.modelo));
    // Three states, not two: an identical price is a match, not a narrow win.
    // Compared on cents to avoid float noise making 0,00 € look like a win.
    const comp = COMP
      // Respect the competitor filter here too: picking "Nike" should show
      // Nike's prices, not every price for the models Nike happens to carry.
      .filter(c=>ids.has(c.modelo) &&
                 (!F.competidores.size || F.competidores.has(c.competidor)))
      .map(c=>{
        const eq = Math.abs(c.delta_eur) < 0.005;
        return {...c, eq, edad: antiguedad(c.observed_at),
          cls:   eq ? "delta-eq" : (c.delta_eur>0 ? "delta-up" : "delta-dn"),
          badge: eq ? "igual"    : (c.somos_mas_baratos ? "barato" : "caro"),
          label: eq ? "igual"    : (c.somos_mas_baratos ? "más barato" : "más caro")};
      })
      .sort((a,b)=>b.delta_pct-a.delta_pct);
    // Group by model, worst gap first, and within a model cheapest rival first.
    const order = [...new Map(comp.map(c=>[c.modelo, c])).keys()];
    const rank = new Map(order.map((m,i)=>[m,i]));
    comp.sort((a,b)=> rank.get(a.modelo)-rank.get(b.modelo)
                   || a.precio_comp-b.precio_comp);
    const seen = new Set();
    comp.forEach(c=>{ c.first = !seen.has(c.modelo); seen.add(c.modelo); });
    const nComp = new Map();
    comp.forEach(c=>nComp.set(c.modelo,(nComp.get(c.modelo)||0)+1));
    comp.forEach(c=>{ c.rivals = nComp.get(c.modelo); });
    const c = document.createElement("section"); c.className="card wide";
    if(!comp.length){
      c.innerHTML=`<h2>Frente a la competencia</h2>
        <p class="sub">Ningún modelo del filtro actual tiene todavía datos de competencia.</p>`;
      grid.append(c); 
    } else {
      const caros   = comp.filter(x=>!x.eq && !x.somos_mas_baratos).length;
      const iguales = comp.filter(x=>x.eq).length;
      const modelos = new Set(comp.map(x=>x.modelo)).size;
      const multi   = [...nComp.values()].filter(v=>v>1).length;
      const fuentes = [...new Set(comp.map(x=>x.competidor))];
      const fecha = new Date(Math.max(...comp.map(x=>+new Date(x.observed_at))));
      c.innerHTML=`<h2>Frente a la competencia</h2>
        <p class="sub">${nf.format(modelos)} modelos · ${nf.format(comp.length)} precios observados en
        ${fuentes.join(", ")}. Somos más caros en <strong>${nf.format(caros)}</strong>
        de ${nf.format(comp.length)}${iguales?`, igualamos el precio en <strong>${nf.format(iguales)}</strong>`:""}${
        multi?` · ${nf.format(multi)} modelos tienen más de un competidor`:""}.
        Ordenado por mayor diferencia en contra.</p>`;
      const t=document.createElement("table");
      t.innerHTML=`<thead><tr><th>Modelo</th><th>Forum Sport</th><th>Competencia</th>
        <th>Dif.</th><th>Dif. %</th><th>Posición</th><th>Competidor</th>
        <th>Actualizado</th></tr></thead>
        <tbody>${comp.map(x=>`<tr class="${x.eq?"igual-row ":""}${x.first?"grp-start":"grp-cont"}">
          ${x.first ? `<td class="prod-cell"><span class="prod">
            <img class="thumb" src="${x.img_thumb}" alt="" loading="lazy" decoding="async"
                 width="46" height="46"
                 onerror="this.setAttribute('data-failed','');this.removeAttribute('src')">
            <span class="prod-name">
              <a href="${x.url_fs}" target="_blank" rel="noopener">${x.nombre_modelo}</a>
              <small>${x.marca}${x.rivals>1?` · ${x.rivals} competidores`:""}</small>
            </span></span></td>`
          : `<td class="prod-cell cont-mark">↳</td>`}
          <td>${x.first?eur2.format(x.precio_fs):""}</td>
          <td><a href="${x.url_comp}" target="_blank" rel="noopener">${eur2.format(x.precio_comp)}</a></td>
          <td class="${x.cls}">${x.eq?"":(x.delta_eur>0?"+":"")}${eur2.format(x.delta_eur)}</td>
          <td class="${x.cls}">${x.eq?"":(x.delta_pct>0?"+":"")}${nf1.format(x.delta_pct)} %</td>
          <td><span class="badge ${x.badge}">${x.label}</span></td>
          <td><a href="${x.url_comp}" target="_blank" rel="noopener"
                 title="Ver ${x.nombre_modelo} en ${x.competidor}">${x.competidor}</a></td>
          <td class="edad${x.edad.stale?" stale":""}" title="${x.edad.full}">${x.edad.txt}</td></tr>`).join("")}</tbody>`;
      const w=document.createElement("div"); w.className="t-wrap"; w.append(t);
      c.append(w);
      const note=document.createElement("p"); note.className="comp-note";
      note.textContent=`Precio más bajo observado por modelo. Última lectura: `
        + fecha.toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"})
        + `. El precio de la competencia enlaza a su ficha.`;
      c.append(note);
      grid.append(c);
    }
  }

  /* 3 · Modelos por marca ------------------------------------------------ */
  {
    const m=[...by(rows,r=>r.marca).entries()].sort((a,b)=>b[1]-a[1]);
    const top=m.slice(0,12).map(([k,v])=>({k,v}));
    const rest=m.slice(12).reduce((s,[,v])=>s+v,0);
    if(rest) top.push({k:"Otras marcas",v:rest,note:`<span class="t-k">${m.length-12} marcas agrupadas</span>`});
    grid.append(card("Modelos por marca",
      m.length>12?`Las 12 marcas con más modelos; el resto se agrupa en «Otras».`:"Marcas del catálogo.",
      hbar(top),
      tableFor(["Marca","Modelos"], m.map(([k,v])=>[k,nf.format(v)]))));
  }

  /* 4 · Bandas de precio ------------------------------------------------- */
  {
    const items=BANDS.map(([lo,hi,k])=>({k,v:rows.filter(r=>r.precio>=lo&&r.precio<hi).length}))
      .filter(d=>d.v);
    grid.append(card("Distribución por banda de precio",
      "Modelos según su PVP de tarifa, en euros.",
      columns(items),
      tableFor(["Banda (€)","Modelos"], items.map(d=>[d.k,nf.format(d.v)]))));
  }

  /* 5 · Nivel de margen (ordinal ramp) ----------------------------------- */
  {
    const items=ORD_MARGEN.map(k=>({k,v:rows.filter(r=>r.nivel_margen===k).length}))
      .filter(d=>d.v);
    const idx=k=>ORD_MARGEN.indexOf(k);
    grid.append(card("Nivel de margen",
      "Escala ordenada de menor a mayor margen sintético.",
      hbar(items,{colorOf:d=>RAMP4[idx(d.k)]}),
      tableFor(["Nivel","Modelos","% del total"],
        items.map(d=>[d.k,nf.format(d.v),nf1.format(d.v/rows.length*100)+" %"]))));
  }

  /* 6 · Nivel de stock (ordinal ramp) ------------------------------------ */
  {
    const items=ORD_STOCK.map(k=>({k,v:rows.filter(r=>r.nivel_stock===k).length}))
      .filter(d=>d.v);
    const idx=k=>ORD_STOCK.indexOf(k);
    grid.append(card("Nivel de stock",
      "Escala ordenada de menor a mayor cobertura de almacén.",
      hbar(items,{colorOf:d=>RAMP5[idx(d.k)]}),
      tableFor(["Nivel","Modelos","% del total"],
        items.map(d=>[d.k,nf.format(d.v),nf1.format(d.v/rows.length*100)+" %"]))));
  }

  /* 7 · Running vs trail ------------------------------------------------- */
  {
    const items=[...by(rows,r=>r.tipo_producto).entries()]
      .sort((a,b)=>b[1]-a[1])
      .map(([k,v],i)=>({k:k[0].toUpperCase()+k.slice(1),v,
        c:i?"var(--s2)":"var(--s1)", ink:i?"on-light":"on-dark"}));
    const leg=document.createElement("div"); leg.className="legend";
    leg.innerHTML=items.map(d=>`<span><i class="swatch" style="background:${d.c}"></i>${d.k}</span>`).join("");
    const box=document.createElement("div"); box.append(leg,stacked(items));
    grid.append(card("Running y trail","Reparto del catálogo por tipo de producto.", box,
      tableFor(["Tipo","Modelos","% del total"],
        items.map(d=>[d.k,nf.format(d.v),nf1.format(d.v/rows.length*100)+" %"])), true));
  }

  /* 8 · Catálogo paginado ------------------------------------------------ */
  {
    // The whole filtered slice, not a top-N: paging is what makes 1.483 rows
    // browsable. Still ordered by discount, so the head of the table is the
    // same "mayores descuentos" view it replaces.
    const all=[...rows].sort((a,b)=>
      b.descuento_pct-a.descuento_pct || a.nombre_modelo.localeCompare(b.nombre_modelo,"es"));
    let per=12, page=0;
    const pages=()=>Math.max(1,Math.ceil(all.length/per));

    const row=r=>`<tr>
      <td class="prod-cell"><span class="prod">
        <img class="thumb" src="${r.img_thumb}" alt="" loading="lazy" decoding="async"
             width="46" height="46"
             onerror="this.setAttribute('data-failed','');this.removeAttribute('src')">
        <span class="prod-name">
          <a href="${r.url}" target="_blank" rel="noopener">${r.nombre_modelo}</a>
          <small>${r.marca}${r.outlet?'<span class="tag">outlet</span>':""}</small>
        </span></span></td>
      <td>${eur2.format(r.precio)}</td>
      <td>${r.en_rebaja?eur2.format(r.precio_rebaja):"—"}</td>
      <td>${r.en_rebaja?`<b>${nf1.format(r.descuento_pct)} %</b>`:'<span class="t-k">—</span>'}</td>
      <td>${eur2.format(r.precio_rebaja*(1-r.margen))}</td>
      <td>${r.nivel_stock}</td></tr>`;

    const t=document.createElement("table");
    t.innerHTML=`<thead><tr><th>Modelo</th><th>PVP</th><th>Precio</th>
      <th>Dto.</th><th>Neto</th><th>Stock</th></tr></thead><tbody></tbody>`;
    const tbody=t.querySelector("tbody");

    const pager=document.createElement("div"); pager.className="pager";
    pager.innerHTML=`
      <button class="pg" data-go="first" type="button" aria-label="Primera página">«</button>
      <button class="pg" data-go="prev"  type="button" aria-label="Página anterior">‹</button>
      <span class="of" aria-hidden="true"></span>
      <button class="pg" data-go="next"  type="button" aria-label="Página siguiente">›</button>
      <button class="pg" data-go="last"  type="button" aria-label="Última página">»</button>
      <span class="range grow" role="status" aria-live="polite"></span>
      <label class="range" for="per">Por página</label>
      <select id="per" aria-label="Filas por página">
        <option value="12">12</option><option value="25">25</option>
        <option value="50">50</option><option value="100">100</option>
      </select>`;
    const of=pager.querySelector(".of"), range=pager.querySelector(".range");
    const btn=k=>pager.querySelector(`[data-go="${k}"]`);

    function draw(){
      page=Math.min(page,pages()-1);
      const start=page*per, slice=all.slice(start,start+per);
      tbody.innerHTML=slice.map(row).join("");
      of.textContent=`${page+1} / ${nf.format(pages())}`;
      range.textContent=all.length
        ? `${nf.format(start+1)}–${nf.format(start+slice.length)} de ${nf.format(all.length)} modelos`
        : "Sin resultados";
      btn("first").disabled=btn("prev").disabled = page===0;
      btn("last").disabled =btn("next").disabled = page>=pages()-1;
    }
    const go=k=>{ const last=pages()-1;
      page = k==="first"?0 : k==="prev"?Math.max(0,page-1)
           : k==="next" ?Math.min(last,page+1) : last;
      draw();
      // Keep the table head in view when paging from further down the row list.
      t.scrollIntoView({block:"nearest", behavior:"smooth"});
    };
    pager.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
    pager.querySelector("#per").onchange=e=>{
      const firstRow=page*per;            // keep the reader roughly where they were
      per=Number(e.target.value); page=Math.floor(firstRow/per); draw();
    };

    const c=document.createElement("section"); c.className="card wide";
    c.innerHTML=`<h2>Catálogo</h2>
      <p class="sub">Todos los modelos del filtro, ordenados por descuento sobre PVP.
      «Neto» es el ingreso tras margen, calculado en la base de datos.
      El nombre enlaza a la ficha pública.</p>`;
    const w=document.createElement("div"); w.className="t-wrap"; w.append(t);
    c.append(w, pager); grid.append(c);
    draw();
  }

  document.getElementById("state")?.remove();
}

/* ── boot ─────────────────────────────────────────────────────────────── */
(async () => {
  try{
    const [rows_, comp_] = await Promise.all([load(), loadComparison()]);
    ROWS = rows_; COMP = comp_;
    const skus = ROWS.reduce((s,r)=>s+r.num_skus,0);
    document.getElementById("meta").innerHTML =
      `<b>${nf.format(ROWS.length)}</b> modelos <span class="dot"></span>`+
      `<b>${nf.format(skus)}</b> SKU <span class="dot"></span>`+
      `<b>${nf.format(new Set(ROWS.map(r=>r.brand_code)).size)}</b> marcas `+
      `<span class="dot"></span> running y trail hombre`;
    render();
  }catch(e){
    document.getElementById("state").className="state err";
    document.getElementById("state").textContent="No se pudo cargar el catálogo: "+e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
