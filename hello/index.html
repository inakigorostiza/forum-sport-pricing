<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello World</title>
<meta name="description" content="A simple hello world landing page.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E32219;
  --ink:#222222;
  --paper:#FFFFFF;
  --muted:#5C5C5C;
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#F5F5F5; --paper:#222222; --muted:#B5B5B5; }
}
*{ box-sizing:border-box; margin:0; }
body{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:16px;
  background:var(--paper);
  color:var(--ink);
  font-family:Roboto, system-ui, sans-serif;
  text-align:center;
}
h1{
  font-family:"Roboto Condensed", sans-serif;
  font-size:clamp(3rem, 12vw, 7rem);
  text-transform:uppercase;
  line-height:1;
}
h1 span{ color:var(--red); }
p{ margin-top:1rem; color:var(--muted); font-size:1.125rem; }
</style>
</head>
<body>
<main>
  <h1>Hello, <span>world</span></h1>
  <p>It works.</p>
</main>
</body>
</html>
